/* ============================ Broker portfolio CSV import (DEGIRO + Trade Republic) ============================ */
function BrokerImportModal({ data, onClose, onCommit }){
  const fileRef = useRef(null);
  const [broker, setBroker] = useState('degiro');     // 'degiro' (portfolio) | 'degiro-tx' (transactions/cost) | 'trade-republic'
  const [rows, setRows] = useState(null);
  const [mode, setMode] = useState(null);             // 'portfolio' | 'transaction' | 'degirocost'
  const [err, setErr] = useState(null);
  const stockAssets = data.assets.filter(a => a.category === 'stocks');

  const STOP = ['the','etf','inc','corp','plc','holding','holdings','ord','reg','nv','sa','ag',
    'common','stock','stocks','shares','share','class','co','company','ucits','acc','dist','usd','eur','core'];
  const norm = s => String(s||'').toLowerCase().replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
  const toks = s => norm(s).split(' ').filter(w => w.length > 2 && STOP.indexOf(w) === -1);
  const matchAsset = (product, isin) => {
    if (isin){
      const byIsin = stockAssets.find(a => a.isin && a.isin.toUpperCase() === isin.toUpperCase());
      if (byIsin) return byIsin.id;
    }
    const pt = toks(product); let best = null, bestScore = 0;
    stockAssets.forEach(a => {
      const at = toks(a.name);
      const shared = pt.filter(w => at.indexOf(w) !== -1).length;
      const score = shared / Math.max(1, Math.min(pt.length, at.length));
      if (shared > 0 && score > bestScore){ bestScore = score; best = a.id; }
    });
    return bestScore >= 0.5 ? best : null;
  };
  const num = v => { const n = parseDutchAmount(v); return isNaN(n) ? 0 : n; };
  const signedNum = v => {                            // keep a leading minus if present
    const neg = /^\s*-/.test(String(v||''));
    const n = num(v); return neg ? -Math.abs(n) : n;
  };

  /* DEGIRO: one row per holding, current value in EUR */
  const parsePortfolio = parsed => {
    const get = fieldGetter(parsed[0]);
    const out = [];
    parsed.slice(1).forEach(r => {
      const product = get(r, ['product','productnaam','naam','name']);
      if (!product) return;
      const isin = get(r, ['symbool/isin','isin','symbol/isin','symboolisin']);
      const qty  = parseDutchAmount(get(r, ['aantal','quantity','amount']));
      const value = parseDutchAmount(get(r, ['waardeineur','waardeineuro','valueineur','value','waarde']));
      if (isNaN(value)) return;
      out.push({ key:uid(), product, isin:isin || '', shares:isNaN(qty) ? null : qty, value,
        cost:null, lastRate:null, mapTo: matchAsset(product, isin) || '__new__' });
    });
    return out;
  };

  /* Trade Republic: transaction history → aggregate net shares + estimate value from last trade price */
  const parseTransactions = parsed => {
    const get = fieldGetter(parsed[0]);
    const groups = {};
    parsed.slice(1).forEach(r => {
      const type = get(r, ['type','transactietype','art','transaction','transactiontype']).toLowerCase();
      const assetType = get(r, ['assettype','asset type','soort']).toLowerCase();
      const name = get(r, ['name','instrumentname','asset','product','naam','omschrijving']);
      const isin = get(r, ['instrument','isin','symbool/isin','wkn/isin']);
      if (!name && !isin) return;
      if (assetType && /crypto/.test(assetType)) return;                     // skip crypto lines
      const dateRaw = get(r, ['date','timestamp','datum','executiondate']);
      const date = parseINGDate((dateRaw.match(/\d{4}-\d{2}-\d{2}/) || dateRaw.match(/\d{2}-\d{2}-\d{4}/) || [''])[0]) || dateRaw;
      let sh = signedNum(get(r, ['shares','aantal','quantity','anzahl','stück','stuks','nominal']));
      const rate = num(get(r, ['rate','price','kurs','koers','priceper','pricepershare','prijs','averageprice']));
      if (!sh) return;                                                       // dividends/cash have no shares
      if (/(sale|sell|verkoop|verkauf|sell-out)/.test(type) && sh > 0) sh = -sh;
      const key = (isin || name).toUpperCase();
      if (!groups[key]) groups[key] = { name, isin, shares:0, cost:0, lastRate:rate || 0, lastDate:'' };
      groups[key].shares += sh;
      if (sh > 0) groups[key].cost += sh * rate;
      if (rate && (!groups[key].lastDate || String(date) >= groups[key].lastDate)){ groups[key].lastRate = rate; groups[key].lastDate = String(date); }
      if (!groups[key].name && name) groups[key].name = name;
      if (!groups[key].isin && isin) groups[key].isin = isin;
    });
    return Object.keys(groups).map(k => {
      const g = groups[k];
      const shares = Math.round(g.shares * 1e6) / 1e6;
      return { key:uid(), product:g.name || k, isin:g.isin || '', shares,
        lastRate:g.lastRate, value: shares * g.lastRate, cost:g.cost,
        mapTo: matchAsset(g.name, g.isin) || '__new__' };
    }).filter(r => r.shares > 0.000001);
  };

  /* DEGIRO: transaction history -> average cost basis (EUR) for the shares still held. */
  const parseDegiroCost = parsed => {
    const get = fieldGetter(parsed[0]);
    const groups = {};
    parsed.slice(1).forEach(r => {
      const name = get(r, ['product','naam','name','productnaam']);
      const isin = get(r, ['isin','symbool/isin','symboolisin']);
      if (!name && !isin) return;
      const sh = signedNum(get(r, ['aantal','quantity','shares','amount']));
      if (!sh) return;                                          // skip cash/dividend/fee rows
      let eur = parseDutchAmount(get(r, ['waardeeur','waarde','valueeur','value','totaaleur','totaal','total']));
      eur = isNaN(eur) ? 0 : Math.abs(eur);                     // EUR value of the trade
      const key = (isin || name).toUpperCase();
      if (!groups[key]) groups[key] = { name, isin, shares:0, buyShares:0, buyCost:0 };
      const g = groups[key];
      g.shares += sh;
      if (sh > 0){ g.buyShares += sh; g.buyCost += eur; }       // money spent buying
      if (!g.name && name) g.name = name;
      if (!g.isin && isin) g.isin = isin;
    });
    return Object.keys(groups).map(k => {
      const g = groups[k];
      const shares = Math.round(g.shares * 1e6) / 1e6;
      const avg = g.buyShares > 0 ? g.buyCost / g.buyShares : 0;     // avg EUR cost / share
      const cost = Math.round(avg * Math.max(shares, 0) * 100) / 100;
      return { key:uid(), product:g.name || k, isin:g.isin || '', shares,
        cost, value:null, lastRate:null, mapTo: matchAsset(g.name, g.isin) || '__new__' };
    }).filter(r => r.shares > 0.000001);
  };

  const onFile = e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    readFileSmart(f).then(text => {
      const parsed = parseCSV(text).rows;
      if (parsed.length < 2){ setErr('No rows found in this CSV.'); return; }
      const m = broker === 'trade-republic' ? 'transaction' : broker === 'degiro-tx' ? 'degirocost' : 'portfolio';
      const out = m === 'portfolio' ? parsePortfolio(parsed)
                : m === 'degirocost' ? parseDegiroCost(parsed)
                : parseTransactions(parsed);
      if (!out.length){
        setErr(m === 'portfolio'
          ? 'No value column found. A DEGIRO Portfolio export has a "Waarde in EUR" / "Value in EUR" column — make sure you exported Portfolio, not transactions.'
          : m === 'degirocost'
          ? 'No share transactions found. Use the DEGIRO Transactions export (Activity → Transactions → Export), which lists each individual buy and sell.'
          : 'No share transactions found. In Trade Republic use Profile → Account Statements → Transaction Export, then pick that CSV here.');
        return;
      }
      setErr(null); setMode(m); setRows(out); e.target.value = '';
    }).catch(er => setErr('Could not read file: ' + er.message));
  };

  const setMap = (key, v) => setRows(rows.map(r => r.key === key ? { ...r, mapTo:v } : r));

  const commit = () => {
    let assets = [...data.assets];
    const institutionId = broker.indexOf('degiro') === 0 ? 'degiro' : 'trade-republic';
    const tag = institutionId === 'trade-republic' ? 'Trade Republic' : 'DEGIRO';
    const setsValue = mode !== 'degirocost';            // cost-only import leaves value alone
    const setsQty = mode !== 'portfolio';
    let updated = 0, added = 0;
    rows.forEach(r => {
      if (r.mapTo === '__skip__') return;
      const cost = ((mode === 'transaction' || mode === 'degirocost') && r.cost > 0) ? Math.round(r.cost*100)/100 : null;
      if (r.mapTo === '__new__'){
        assets.push({ id:uid(), name:r.product, note:tag,
          value:(setsValue ? r.value : (r.cost || 0)), category:'stocks', institutionId, isin:r.isin || null,
          quantity:(setsQty ? r.shares : null), costBasis:cost, lastUpdated:ISO(TODAY) });
        added++;
      } else {
        assets = assets.map(a => a.id === r.mapTo
          ? { ...a, value:(setsValue ? r.value : a.value), isin:(a.isin || r.isin || null),
              quantity:(setsQty ? r.shares : a.quantity),
              costBasis:(cost != null ? cost : a.costBasis), lastUpdated:ISO(TODAY) } : a);
        updated++;
      }
    });
    onCommit(assets, tag + (mode === 'degirocost' ? ' cost-basis import' : ' import') + ': updated ' + updated +
      ', added ' + added + ' position' + (added === 1 ? '' : 's') +
      (mode === 'transaction' ? ' · values estimated from last trade price'
        : mode === 'degirocost' ? ' · current values left as-is' : '') + '.');
  };

  const nMatch = rows ? rows.filter(r => r.mapTo !== '__skip__' && r.mapTo !== '__new__').length : 0;
  const nNew   = rows ? rows.filter(r => r.mapTo === '__new__').length : 0;
  const nSkip  = rows ? rows.filter(r => r.mapTo === '__skip__').length : 0;

  return (
    <div className="modal-back" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal">
        <div className="spread mb">
          <h2 style={{margin:0}}>📥 Import broker CSV</h2>
          <button className="btn" onClick={onClose}>✕ Close</button>
        </div>

        {!rows && (
          <div className="stack">
            <div className="row" style={{gap:8, flexWrap:'wrap'}}>
              <label className="row small muted" style={{gap:6}}>Broker:
                <select value={broker} onChange={e => { setBroker(e.target.value); setErr(null); }}>
                  <option value="degiro">DEGIRO — Portfolio export (current values)</option>
                  <option value="degiro-tx">DEGIRO — Transactions export (cost basis)</option>
                  <option value="trade-republic">Trade Republic — Transaction export</option>
                </select>
              </label>
            </div>
            <div className="card" style={{background:'var(--bg)', borderStyle:'dashed', textAlign:'center', padding:'24px'}}>
              {broker === 'degiro'
                ? <div className="mb small muted">DEGIRO: <b>Portfolio → Export → Portfolio</b>. Values arrive in EUR, so every position updates at once.</div>
                : broker === 'degiro-tx'
                ? <div className="mb small muted">DEGIRO: <b>Activity → Transactions → Export</b>. The app reads every buy and sell and computes your average cost basis in EUR. Current values are left untouched — use the Portfolio export for those.</div>
                : <div className="mb small muted">Trade Republic: <b>Profile → Account Statements → Transaction Export → Create</b>. This is a transaction history — the app sums your net shares and estimates value from your last trade price.</div>}
              <button className="btn btn-blue" onClick={() => fileRef.current && fileRef.current.click()}>Choose CSV…</button>
              <input ref={fileRef} type="file" accept=".csv,text/csv" style={{display:'none'}} onChange={onFile}/>
            </div>
            {err && <div className="small red">{err}</div>}
          </div>
        )}

        {rows && (
          <div className="stack">
            <div className="small muted">
              {mode === 'transaction'
                ? 'Reconstructed from your Trade Republic transactions. Value = net shares × your last trade price (an estimate — adjust on the Holdings list after importing).'
                : mode === 'degirocost'
                ? 'Average cost basis (EUR) computed from your DEGIRO transactions. Applying this fills cost basis and gain — your current values stay exactly as they are.'
                : 'Matched to existing holdings by ISIN or name. Check the matches, then apply.'}
            </div>
            <div className="review-wrap">
              <table>
                <thead>
                  {mode === 'transaction'
                    ? <tr><th>Position</th><th className="r">Net shares</th><th className="r">Last price</th><th className="r">Est. value</th><th>Maps to holding</th></tr>
                    : mode === 'degirocost'
                    ? <tr><th>Position</th><th className="r">Net shares</th><th className="r">Cost basis (EUR)</th><th>Maps to holding</th></tr>
                    : <tr><th>DEGIRO product</th><th className="r">Qty</th><th className="r">Value (EUR)</th><th>Maps to holding</th></tr>}
                </thead>
                <tbody>
                  {rows.map(r => (
                    <tr key={r.key}>
                      <td style={{fontWeight:600}}>{r.product}{r.isin && <span className="dim small num"> · {r.isin}</span>}</td>
                      {mode === 'transaction'
                        ? <React.Fragment>
                            <td className="r num">{(+r.shares).toLocaleString('nl-NL',{maximumFractionDigits:4})}</td>
                            <td className="r num muted">{r.lastRate ? fmt(r.lastRate) : '—'}</td>
                            <td className="r num" style={{fontWeight:700}}>{fmt(r.value)}</td>
                          </React.Fragment>
                        : mode === 'degirocost'
                        ? <React.Fragment>
                            <td className="r num">{(+r.shares).toLocaleString('nl-NL',{maximumFractionDigits:4})}</td>
                            <td className="r num" style={{fontWeight:700}}>{r.cost ? fmt(r.cost) : '—'}</td>
                          </React.Fragment>
                        : <React.Fragment>
                            <td className="r num">{r.shares == null ? '—' : (+r.shares).toLocaleString('nl-NL',{maximumFractionDigits:4})}</td>
                            <td className="r num" style={{fontWeight:700}}>{fmt(r.value)}</td>
                          </React.Fragment>}
                      <td>
                        <select value={r.mapTo} onChange={e => setMap(r.key, e.target.value)}>
                          <option value="__new__">➕ Add as new position</option>
                          <option value="__skip__">Skip this row</option>
                          {stockAssets.map(a => <option key={a.id} value={a.id}>{a.name} ({fmt0(a.value)})</option>)}
                        </select>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div className="spread" style={{flexWrap:'wrap', gap:10}}>
              <span className="small muted">{nMatch} matched · {nNew} new · {nSkip} skipped</span>
              <span className="row" style={{gap:8}}>
                <button className="btn" onClick={() => { setRows(null); setMode(null); }}>← Back</button>
                <button className="btn btn-blue" onClick={commit}>Apply to holdings</button>
              </span>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================ Spending insights (trends + subscriptions) ============================ */
function cleanLabel(desc){
  return String(desc||'').toLowerCase()
    .replace(/\d+/g,' ').replace(/[^a-z& ]+/g,' ').replace(/\s+/g,' ').trim().slice(0,40);
}
function median(arr){ const s=[...arr].sort((a,b)=>a-b); const n=s.length; return n ? (n%2 ? s[(n-1)/2] : (s[n/2-1]+s[n/2])/2) : 0; }

function detectSubscriptions(transactions){
  const groups={};
  (transactions||[]).filter(t => t.amount < 0 && !t.isTransfer).forEach(t => {
    const key=cleanLabel(t.description);
    if(!key) return;
    (groups[key]=groups[key]||[]).push(t);
  });
  const subs=[];
  Object.keys(groups).forEach(key => {
    const txs=groups[key];
    const months=[...new Set(txs.map(t => t.date.slice(0,7)))];
    if(months.length < 2) return;                       // must recur across months
    const amts=txs.map(t => Math.abs(t.amount));
    const med=median(amts);
    if(med <= 0) return;
    const consistent=amts.filter(a => Math.abs(a-med)/med < 0.2).length;
    if(consistent < 2) return;                          // amount must be stable
    subs.push({ name:txs[0].description, monthly:med, months:months.length, count:txs.length,
      annual:med*12, last:txs.map(t => t.date).sort().slice(-1)[0] });
  });
  return subs.sort((a,b) => b.monthly - a.monthly);
}

function SpendingInsights({ data, lens = 'sven' }){
  const cats = (data.categories||[]).filter(c => c.type === 'variable');
  const byMonth = {};
  (data.transactions||[]).filter(t => t.amount < 0 && !t.isTransfer && catOf(data, t.categoryId).type === 'variable' && lensMatch(t.account, lens))
    .forEach(t => {
      const mk = t.date.slice(0,7);
      byMonth[mk] = byMonth[mk] || {};
      byMonth[mk][t.categoryId] = (byMonth[mk][t.categoryId] || 0) + Math.abs(t.amount);
    });
  const months = Object.keys(byMonth).sort().slice(-12);
  const rows = months.map(mk => {
    const row = { month: mk };
    cats.forEach(c => { row[c.id] = Math.round(((byMonth[mk] || {})[c.id] || 0) * 100) / 100; });
    return row;
  });
  const subs = detectSubscriptions((data.transactions || []).filter(t => lensMatch(t.account, lens)));
  const subTotal = subs.reduce((s,x) => s + x.monthly, 0);

  if (months.length === 0 && subs.length === 0) return null;

  return (
    <div className="card">
      <h2>Spending insights</h2>
      {months.length >= 2
        ? <React.Fragment>
            <h3>Variable spending by category — last {months.length} months</h3>
            <div style={{width:'100%', height:260}}>
              <ResponsiveContainer>
                <BarChart data={rows} margin={{top:8, right:8, left:8, bottom:0}}>
                  <CartesianGrid stroke="#D9CFBD" strokeDasharray="3 3"/>
                  <XAxis dataKey="month" tick={{fill:'#5C574C', fontSize:11}}/>
                  <YAxis tick={{fill:'#5C574C', fontSize:12}} tickFormatter={v => '€' + Math.round(v)} width={55}/>
                  <Tooltip formatter={v => fmt(v)}/>
                  {cats.map(c => <Bar key={c.id} dataKey={c.id} name={c.name} stackId="s" fill={c.color}/>)}
                  <Legend wrapperStyle={{fontSize:11}}/>
                </BarChart>
              </ResponsiveContainer>
            </div>
            <div className="sub">Each bar is one month, split by category — watch for a slice creeping up over time.</div>
          </React.Fragment>
        : <div className="sub">Import or log at least two months of spending to see category trends.</div>}

      <h3 className="mt">Recurring charges {subs.length > 0 && <span className="muted small">· ~{fmt(subTotal)}/mnd · {fmt(subTotal*12)}/yr</span>}</h3>
      {subs.length === 0
        ? <div className="sub">No recurring monthly charges detected yet. After a couple of months of imports, subscriptions surface here automatically.</div>
        : <React.Fragment>
            <table>
              <thead><tr><th>Merchant</th><th className="r">~Monthly</th><th className="r">Per year</th><th className="r">Months</th><th>Last seen</th></tr></thead>
              <tbody>
                {subs.map((s,i) => (
                  <tr key={i}>
                    <td style={{fontWeight:600}}>{s.name}</td>
                    <td className="r num">{fmt(s.monthly)}</td>
                    <td className="r num muted">{fmt(s.annual)}</td>
                    <td className="r num">{s.months}</td>
                    <td className="dim small num">{s.last}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="sub">Found by spotting charges that repeat at a similar amount across months. Cancel anything you don't recognise — that's the fastest money you'll ever save.</div>
          </React.Fragment>}
    </div>
  );
}

/* ============================ Savings goals ============================ */
function goalMonthsLeft(fromMK, toMK){
  const f = String(fromMK).split('-').map(Number), t = String(toMK).split('-').map(Number);
  return (t[0] - f[0]) * 12 + (t[1] - f[1]);
}
function addMonthsMK(mk, n){
  const p = String(mk).split('-').map(Number);
  const d = new Date(p[0], p[1] - 1 + n, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function requiredMonthlyFor(target, saved, n, ratePct){
  const remaining = Math.max(target - saved, 0);
  if (remaining <= 0) return 0;
  if (n <= 0) return remaining;
  const r = (ratePct || 0) / 100 / 12;
  if (r <= 0) return remaining / n;
  const f = Math.pow(1 + r, n);
  return Math.max((target - saved * f) / ((f - 1) / r), 0);
}
function monthsToReach(target, saved, monthly, ratePct){
  if (saved >= target) return 0;
  if (monthly <= 0) return Infinity;
  const r = (ratePct || 0) / 100 / 12;
  let v = saved, m = 0;
  while (v < target && m < 1200){ v = v * (1 + r) + monthly; m++; }
  return m >= 1200 ? Infinity : m;
}

function GoalsTab({ data, setData, lens = 'sven' }){
  const goals = data.goals || [];
  const vGoals = goals.filter(g => lensMatch(g.owner, lens));
  const nowMK = monthKey();
  const blank = { name:'', icon:'🎯', target:0, targetDate: addMonthsMK(nowMK, 24), saved:0, monthly:0, owner:'sven' };
  const [showForm, setShowForm] = useState(vGoals.length === 0);
  const [editingId, setEditingId] = useState(null);
  const [form, setForm] = useState(blank);

  const setGoals = next => setData({ ...data, goals: next });
  const setGoal = (id, k, v) => setGoals(goals.map(g => g.id === id ? { ...g, [k]: v } : g));
  const startAdd = () => { setForm(blank); setEditingId(null); setShowForm(true); };
  const startEdit = g => { setForm({ name:g.name, icon:g.icon || '🎯', target:g.target, targetDate:g.targetDate, saved:g.saved || 0, monthly:g.monthly || 0, owner:g.owner || 'sven' }); setEditingId(g.id); setShowForm(true); };
  const save = () => {
    if (!form.name || !form.target || !form.targetDate) return;
    const g = { name:String(form.name).trim(), icon:form.icon || '🎯', target:Number(form.target) || 0,
      targetDate:form.targetDate, saved:Number(form.saved) || 0, monthly:Number(form.monthly) || 0, owner:form.owner || 'sven' };
    if (editingId) setGoals(goals.map(x => x.id === editingId ? { ...x, ...g } : x));
    else setGoals(goals.concat([{ id:uid(), ...g }]));
    setForm(blank); setEditingId(null); setShowForm(false);
  };
  const del = id => setGoals(goals.filter(g => g.id !== id));

  /* honest "free to save" estimate, consistent with the Budget tab's surplus — lens-aware */
  const gHH = data.household || {};
  const gContribEach = gHH.jointContribEach != null ? gHH.jointContribEach : 1000;
  const gFc = data.fixedCosts || [];
  const gShared = gFc.filter(c => c.shared).reduce((s, c) => s + monthlyEq(c), 0);
  const gPersonal = gFc.filter(c => !c.shared && lensMatch(c.owner, lens)).reduce((s, c) => s + monthlyEq(c), 0);
  const totalIn = lens === 'charlotte' ? ((data.income || {}).charlotte || 0)
    : lens === 'ours' ? (((data.income || {}).sven || 0) + ((data.income || {}).charlotte || 0))
    : ((data.income || {}).sven || 0);
  const monthlyFixed = lens === 'ours'
    ? gShared + gFc.filter(c => !c.shared).reduce((s, c) => s + monthlyEq(c), 0)
    : gContribEach + gPersonal;
  const varByMonth = {};
  (data.transactions || []).filter(t => t.amount < 0 && !t.isTransfer && catOf(data, t.categoryId).type === 'variable' && lensMatch(t.account, lens))
    .forEach(t => { const mk = t.date.slice(0,7); varByMonth[mk] = (varByMonth[mk] || 0) + Math.abs(t.amount); });
  const varMonths = Object.keys(varByMonth);
  const avgVar = varMonths.length ? varMonths.reduce((s, m) => s + varByMonth[m], 0) / varMonths.length : null;
  const typicalSurplus = avgVar != null ? totalIn - monthlyFixed - avgVar : null;

  const calc = g => {
    const n = Math.max(goalMonthsLeft(nowMK, g.targetDate), 0);
    const remaining = Math.max(g.target - (g.saved || 0), 0);
    const reached = (g.saved || 0) >= g.target && g.target > 0;
    const required = requiredMonthlyFor(g.target, g.saved || 0, n, 0);
    const pct = g.target > 0 ? Math.min(100, (g.saved || 0) / g.target * 100) : 0;
    const planned = g.monthly || 0;
    const projMonths = planned > 0 ? monthsToReach(g.target, g.saved || 0, planned, 0) : Infinity;
    const projDate = isFinite(projMonths) ? addMonthsMK(nowMK, projMonths) : null;
    const onTrack = planned > 0 && isFinite(projMonths) && projMonths <= n;
    return { n, remaining, reached, required, pct, planned, projMonths, projDate, onTrack };
  };

  const totalRequired = vGoals.reduce((s, g) => s + calc(g).required, 0);
  const totalSaved = vGoals.reduce((s, g) => s + (g.saved || 0), 0);
  const totalTarget = vGoals.reduce((s, g) => s + g.target, 0);

  return (
    <div className="stack">
      <div className="card">
        <div className="spread" style={{flexWrap:'wrap', gap:8}}>
          <h2 style={{margin:0}}>Savings goals</h2>
          <button className="btn btn-blue" onClick={startAdd}>+ Add goal</button>
        </div>
        {vGoals.length > 0 &&
          <div className="grid3 mt">
            <div className="card" style={{background:'var(--bg)'}}>
              <h3>Goals</h3><div className="metric">{vGoals.length}</div>
              <div className="sub">{fmt0(totalSaved)} saved of {fmt0(totalTarget)}</div>
            </div>
            <div className="card" style={{background:'var(--bg)'}}>
              <h3>To set aside</h3><div className="metric">{fmt0(totalRequired)}<span className="sub"> /mnd</span></div>
              <div className="sub">across all goals, to hit every date</div>
            </div>
            <div className="card" style={{background:'var(--bg)'}}>
              <h3>Typical monthly surplus</h3>
              {typicalSurplus != null
                ? <React.Fragment>
                    <div className={'metric ' + (typicalSurplus >= totalRequired ? 'green' : 'yellow')}>{fmt0(typicalSurplus)}</div>
                    <div className="sub">{typicalSurplus >= totalRequired ? 'comfortably covers your goals' : 'tight — goals need ' + fmt0(totalRequired) + '/mnd'}</div>
                  </React.Fragment>
                : <React.Fragment><div className="metric dim">—</div><div className="sub">import a few months of spending to estimate</div></React.Fragment>}
            </div>
          </div>}
      </div>

      {showForm &&
        <div className="card">
          <h3>{editingId ? 'Edit goal' : 'New goal'}</h3>
          <div className="form-grid">
            <label className="fld">Name<input value={form.name} onChange={e => setForm({ ...form, name:e.target.value })} placeholder="e.g. New car" style={{width:170}}/></label>
            <label className="fld">Icon<input value={form.icon} onChange={e => setForm({ ...form, icon:e.target.value })} style={{width:56, textAlign:'center'}}/></label>
            <label className="fld">Target<NumInput value={form.target} step={500} onChange={v => setForm({ ...form, target:v })} suffix="€"/></label>
            <label className="fld">Target date<input type="month" value={form.targetDate} onChange={e => setForm({ ...form, targetDate:e.target.value })} style={{width:160}}/></label>
            <label className="fld">Already saved<NumInput value={form.saved} step={100} onChange={v => setForm({ ...form, saved:v })} suffix="€"/></label>
            <label className="fld">Planned/mnd <span className="dim">(optional)</span><NumInput value={form.monthly} step={25} onChange={v => setForm({ ...form, monthly:v })} suffix="€"/></label>
            <label className="fld">Owner<select value={form.owner || 'sven'} onChange={e => setForm({ ...form, owner:e.target.value })} style={{width:130}}>{OWNER_OPTS.map(o => <option key={o[0]} value={o[0]}>{o[1]}</option>)}</select></label>
          </div>
          <div className="row mt" style={{gap:8}}>
            <button className="btn btn-blue" onClick={save}>{editingId ? 'Save' : 'Add goal'}</button>
            <button className="btn" onClick={() => { setShowForm(false); setEditingId(null); }}>Cancel</button>
          </div>
        </div>}

      {vGoals.length === 0 && !showForm &&
        <div className="card"><div className="sub">No goals yet. Add one — like a 25.000 car in 2028 — and you'll get a monthly savings target.</div></div>}

      {vGoals.slice().sort((a, b) => String(a.targetDate).localeCompare(String(b.targetDate))).map(g => {
        const c = calc(g);
        return (
          <div key={g.id} className="card">
            <div className="spread" style={{flexWrap:'wrap', gap:8, alignItems:'flex-start'}}>
              <div>
                <h2 style={{margin:0}}>{g.icon} {g.name}</h2>
                <div className="sub">{fmt0(g.target)} by {monthLabel(g.targetDate)} · {c.reached ? 'reached 🎉' : (c.n > 0 ? c.n + ' months left' : 'due now')}</div>
              </div>
              <div className="row" style={{gap:4}}>
                <button className="btn" style={{padding:'4px 10px'}} onClick={() => startEdit(g)}>✏️</button>
                <button className="btn" style={{padding:'4px 10px'}} onClick={() => del(g.id)}>🗑</button>
              </div>
            </div>

            <div style={{position:'relative', height:12, background:'var(--bg)', borderRadius:8, marginTop:12}}>
              <div className="growbar" style={{position:'absolute', left:0, top:0, height:'100%', width:c.pct + '%',
                background: c.reached ? 'var(--green)' : 'linear-gradient(90deg,#4A211C,#5E6B3B)', borderRadius:8, transition:'width .4s'}}></div>
            </div>
            <div className="spread" style={{marginTop:6}}>
              <span className="small num green">{fmt0(g.saved || 0)} saved</span>
              <span className="small num muted">{pct1(c.pct)}</span>
              <span className="small num dim">{fmt0(g.target)}</span>
            </div>

            <div className="card mt" style={{background:'var(--bg)'}}>
              {c.reached
                ? <div className="green">You've hit this goal — {fmt0(g.saved || 0)} saved. 🎉</div>
                : <React.Fragment>
                    <div style={{fontSize:15}}>Set aside <b className="green">{fmt0(c.required)}/mnd</b> to reach {fmt0(g.target)} by {monthLabel(g.targetDate)}.</div>
                    <div className="sub">{fmt0(c.remaining)} to go{c.n > 0 ? ' over ' + c.n + ' months' : ' — the date has passed, so save it now'}.</div>
                  </React.Fragment>}
            </div>

            {!c.reached &&
              <div className="kv mt" style={{flexWrap:'wrap', gap:8}}>
                <span className="k">I plan to save</span>
                <span className="v row" style={{gap:8, alignItems:'center', flexWrap:'wrap'}}>
                  <NumInput value={g.monthly || 0} step={25} width={120} suffix="€/mnd" onChange={v => setGoal(g.id, 'monthly', v)}/>
                  {c.planned > 0 &&
                    (c.onTrack
                      ? <span className="badge badge-green">On track · done by {monthLabel(c.projDate)}</span>
                      : (isFinite(c.projMonths)
                          ? <span className="badge" style={{background:'rgba(251,191,36,.15)', color:'var(--yellow)'}}>Short — not until {monthLabel(c.projDate)}</span>
                          : <span className="badge" style={{background:'rgba(248,113,113,.15)', color:'var(--red)'}}>Set a monthly amount</span>))}

            </div>
          </div>
        );
      })}

      <div className="card" style={{borderStyle:'dashed'}}>
        <div className="small muted" style={{lineHeight:1.6}}>
          Tip: open a dedicated ING savings pot per goal and set an automatic monthly transfer for the amount above — then just bump "saved so far" here when money lands. Goals are tracked separately from your investments, so they never skew your FIRE projection.
        </div>
      </div>
    </div>
  );
}

/* ============================ Cloud sync (Firebase) ============================ */
const FB_VER = '10.12.2';
const FB_CONFIG_KEY = 'sven_finance_fb';
const FB_BASE_KEY = 'sven_finance_fb_base';

function parseFirebaseConfig(text){
  if (!text) return null;
  try { const o = JSON.parse(text); if (o && o.apiKey && o.projectId) return o; } catch(e){}
  const keys = ['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId','measurementId','databaseURL'];
  const cfg = {};
  keys.forEach(k => { const m = text.match(new RegExp(k + '\\s*:\\s*["\']([^"\']+)["\']')); if (m) cfg[k] = m[1]; });
  return (cfg.apiKey && cfg.projectId) ? cfg : null;
}

let _fbLoading = null;
function loadFirebaseSDK(){
  if (window.firebase && window.firebase.firestore) return Promise.resolve(window.firebase);
  if (_fbLoading) return _fbLoading;
  const base = 'https://www.gstatic.com/firebasejs/' + FB_VER + '/';
  const files = ['firebase-app-compat.js','firebase-auth-compat.js','firebase-firestore-compat.js'];
  _fbLoading = files.reduce((p, f) => p.then(() => new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = base + f; s.async = false;
    s.onload = res; s.onerror = () => rej(new Error('Could not load ' + f + ' — check your connection or the SDK version.'));
    document.head.appendChild(s);
  })), Promise.resolve()).then(() => window.firebase);
  return _fbLoading;
}

function useCloudSync(data, setData){
  const [config, setConfig] = useState(() => { try { return JSON.parse(localStorage.getItem(FB_CONFIG_KEY) || 'null'); } catch(e){ return null; } });
  const [user, setUser] = useState(null);
  const [status, setStatus] = useState('off');      // off | loading | signedout | syncing | synced | error
  const [error, setError] = useState(null);
  const [lastAt, setLastAt] = useState(null);
  const [conflict, setConflict] = useState(null);    // { payload, at }

  const fb = useRef(null);
  const docRef = useRef(null);
  const unsub = useRef(null);
  const authBound = useRef(false);
  const firstSnap = useRef(true);
  const lastPayload = useRef(null);
  const writeTimer = useRef(null);
  const dataRef = useRef(data);
  useEffect(() => { dataRef.current = data; }, [data]);
  useEffect(() => { try { lastPayload.current = localStorage.getItem(FB_BASE_KEY); } catch(e){} }, []);

  const setBase = json => { lastPayload.current = json; try { localStorage.setItem(FB_BASE_KEY, json); } catch(e){} };

  function detach(){ if (unsub.current){ unsub.current(); unsub.current = null; } docRef.current = null; firstSnap.current = true; }

  function applyRemote(rp){
    try {
      const parsed = JSON.parse(rp);
      const migrated = migrate({ ...seedData(), ...parsed });
      setBase(JSON.stringify(migrated));
      setData(migrated);
      setStatus('synced'); setError(null);
    } catch(e){ setError('Could not read cloud data: ' + e.message); setStatus('error'); }
  }

  function pushLocal(json){
    const ref = docRef.current; if (!ref) return;
    const j = json || JSON.stringify(dataRef.current);
    setStatus('syncing');
    ref.set({ payload: j, updatedAt: Date.now() }).then(() => {
      setBase(j); setLastAt(Date.now()); setStatus('synced'); setError(null);
    }).catch(e => { setError(e.message); setStatus('error'); });
  }

  function startSync(u){
    const firebase = fb.current;
    setStatus('syncing'); setError(null);
    const ref = firebase.firestore().collection('fintrack').doc(u.uid);
    docRef.current = ref; firstSnap.current = true;
    if (unsub.current) unsub.current();
    unsub.current = ref.onSnapshot(snap => {
      const localJSON = JSON.stringify(dataRef.current);
      const base = lastPayload.current;
      if (!snap.exists){
        if (firstSnap.current){ firstSnap.current = false; pushLocal(localJSON); }
        return;
      }
      const remote = snap.data() || {};
      const rp = remote.payload || '';
      const at = remote.updatedAt || Date.now();
      if (firstSnap.current){
        firstSnap.current = false;
        if (rp === localJSON){ setBase(rp); setLastAt(at); setStatus('synced'); }
        else if (rp === base){ pushLocal(localJSON); }              // remote unchanged, local newer -> push
        else if (localJSON === base){ applyRemote(rp); setLastAt(at); } // local unchanged, remote newer -> pull
        else { setConflict({ payload: rp, at: remote.updatedAt || null }); setStatus('synced'); } // both changed -> ask
        return;
      }
      if (rp && rp !== lastPayload.current){ applyRemote(rp); setLastAt(at); }   // live change from another device
    }, err => { setError(err.message); setStatus('error'); });
  }

  useEffect(() => {
    if (!config){ setStatus('off'); return; }
    let alive = true;
    setStatus('loading'); setError(null);
    loadFirebaseSDK().then(firebase => {
      if (!alive) return;
      fb.current = firebase;
      if (!firebase.apps.length) firebase.initializeApp(config);
      if (!authBound.current){
        authBound.current = true;
        firebase.auth().onAuthStateChanged(u => { setUser(u); if (u) startSync(u); else { detach(); setStatus('signedout'); } });
      } else {
        const cu = firebase.auth().currentUser; setUser(cu);
        if (cu) startSync(cu); else setStatus('signedout');
      }
    }).catch(e => { if (alive){ setError(e.message); setStatus('error'); } });
    return () => { alive = false; };
  }, [config]);

  useEffect(() => {
    if (!user || !docRef.current || conflict) return;
    const json = JSON.stringify(data);
    if (json === lastPayload.current) return;
    if (writeTimer.current) clearTimeout(writeTimer.current);
    writeTimer.current = setTimeout(() => pushLocal(json), 1200);
    return () => { if (writeTimer.current) clearTimeout(writeTimer.current); };
  }, [data, user, conflict]);

  const saveConfig = text => {
    const cfg = parseFirebaseConfig(text);
    if (!cfg){ setError('Could not read that — paste the whole firebaseConfig block (with apiKey and projectId).'); return false; }
    try { localStorage.setItem(FB_CONFIG_KEY, JSON.stringify(cfg)); } catch(e){}
    setError(null); setConfig(cfg); return true;
  };
  const removeConfig = () => {
    detach();
    try { if (fb.current) fb.current.auth().signOut(); } catch(e){}
    try { localStorage.removeItem(FB_CONFIG_KEY); } catch(e){}
    setConfig(null); setUser(null); setConflict(null); setStatus('off');
  };
  const signIn = () => {
    setError(null);
    const firebase = fb.current;
    if (!firebase){ setError('Still connecting — try again in a second.'); return; }
    try { firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => setError(e.message)); }
    catch(e){ setError(e.message); }
  };
  const signOut = () => { try { fb.current.auth().signOut(); } catch(e){} };
  const resolveConflict = which => {
    if (!conflict) return;
    if (which === 'cloud') applyRemote(conflict.payload);
    else pushLocal(JSON.stringify(dataRef.current));
    setConflict(null);
  };
  const syncNow = () => pushLocal(JSON.stringify(dataRef.current));

  return { config, user, status, error, lastAt, conflict,
    projectId: config ? config.projectId : null,
    saveConfig, removeConfig, signIn, signOut, resolveConflict, syncNow };
}

            {s.status === 'loading' && <span className="muted">Connecting…</span>}
            {s.status === 'signedout' && <span className="muted">Not signed in</span>}
            {s.status === 'syncing' && <span style={{color:'var(--yellow)'}}>Syncing…</span>}
            {s.status === 'synced' && <span className="green">● Synced{ts ? ' · ' + ts : ''}</span>}
            {s.status === 'error' && <span className="red">Error</span>}
            {s.status === 'off' && <span className="muted">Off</span>}
          </span></div>
          {s.error && <div className="sub red mb">{s.error}</div>}

          {!s.user
            ? <div className="row mt" style={{gap:8, flexWrap:'wrap'}}>
                <button className="btn btn-blue" onClick={s.signIn}>Sign in with Google</button>
                <button className="btn" onClick={s.removeConfig}>Remove config</button>
              </div>
            : <React.Fragment>
                <div className="kv"><span className="k">Signed in</span><span className="v">{s.user.email || s.user.uid}</span></div>

                {s.conflict &&
                  <div className="card mt" style={{background:'var(--bg)', borderColor:'var(--yellow)'}}>
                    <div style={{color:'var(--yellow)', fontWeight:600, marginBottom:6}}>This device and the cloud both have data</div>
                    <div className="sub mb">The cloud copy{s.conflict.at ? ' (saved ' + new Date(s.conflict.at).toLocaleString('nl-NL') + ')' : ''} differs from what's on this device. Which should win?</div>
                    <div className="row" style={{gap:8, flexWrap:'wrap'}}>
                      <button className="btn btn-blue" onClick={() => s.resolveConflict('cloud')}>Use cloud copy</button>
                      <button className="btn" onClick={() => s.resolveConflict('device')}>Keep this device (overwrite cloud)</button>
                    </div>
                  </div>}

                <div className="row mt" style={{gap:8, flexWrap:'wrap'}}>
                  <button className="btn" onClick={s.syncNow}>Sync now</button>
                  <button className="btn" onClick={s.signOut}>Sign out</button>
                  <button className="btn" onClick={s.removeConfig}>Remove config</button>
                </div>
              </React.Fragment>}
        </React.Fragment>}

      <div className="sub mt" style={{lineHeight:1.6}}>Changes sync automatically a moment after you make them and arrive live on your other signed-in devices. If two devices edit at the same time, the most recent save wins. Your data backup (export/import) still works independently.</div>
    </div>
  );
}

/* Instrument panel. Numbered header, optional meta, navigates when given a target. */
function Panel({ n, title, meta, to, setTab, cls, children }){
  const clickable = !!to;
  const key = e => { if (clickable && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); setTab(to); } };
  return (
    <div className={'panel ' + (cls || '') + (clickable ? ' tile' : '')}
      role={clickable ? 'button' : undefined} tabIndex={clickable ? 0 : undefined}
      onClick={clickable ? (() => setTab(to)) : undefined} onKeyDown={clickable ? key : undefined}
      title={clickable ? ('Open ' + title) : undefined}>
      <div className="panel-h">
        <span className="panel-n">{n} <span className="pslash">//</span> {title}</span>
        <span className="panel-m">{meta || ''}{clickable ? ' →' : ''}</span>
      </div>
      {children}
    </div>
  );
}

function Ring({ pct, color, label, value, size = 44 }){
  const r = (size - 5) / 2, c = 2 * Math.PI * r;
  const p = Math.max(0, Math.min(100, pct || 0));
  return (
    <div style={{textAlign:'center', minWidth:0}}>
      <svg width={size} height={size} viewBox={'0 0 ' + size + ' ' + size} aria-hidden="true">
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--surface2)" strokeWidth={4}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={4} strokeLinecap="round"
          strokeDasharray={c} strokeDashoffset={c - c * p / 100}
          transform={'rotate(-90 ' + (size/2) + ' ' + (size/2) + ')'}
          style={{transition:'stroke-dashoffset 1s cubic-bezier(.25,.8,.3,1)'}}/>
      </svg>
      <div className="mono-lab" style={{marginTop:2}}>{label}</div>
      <div className="mono" style={{fontSize:11.5}}>{value}</div>
    </div>
  );
}

/* Sparkline over snapshot history. Needs two points to mean anything. */
function Spark({ points, color = 'var(--red)', h = 52 }){
  if (!points || points.length < 2)
    return <div className="sub" style={{height:h, display:'flex', alignItems:'center'}}>Two snapshots needed to draw a trend.</div>;
  const w = 300, min = Math.min.apply(null, points), max = Math.max.apply(null, points);
  const span = (max - min) || 1, step = w / (points.length - 1);
  const pts = points.map((v,i) => [i * step, h - 5 - ((v - min) / span) * (h - 12)]);
  const line = pts.map((q,i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  return (
    <svg width="100%" height={h} viewBox={'0 0 ' + w + ' ' + h} preserveAspectRatio="none" aria-hidden="true">
      <path d={line + ' L' + w + ' ' + h + ' L0 ' + h + ' Z'} fill={color} opacity=".12"/>
      <path d={line} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
        style={{strokeDasharray:1200, animation:'sparkIn 1.1s ease both .2s'}}/>
      <circle cx={last[0]} cy={last[1]} r="3" fill={color}/>
    </svg>
  );
}

/* Impulse buy: prices a purchase in hours of your life and forgone compounding.
   Deliberately not moralising — it reports, you decide. */
function ImpulseBuy({ data }){
  const fp = data.fireParams || {};
  const [price, setPrice] = useState(250);
  const income = data.income || {};
  const netMonthly = (income.sven || 0);
  const hourly = netMonthly > 0 ? netMonthly / 173.3 : 0;
  const age = currentAge(fp.birthYear);
  const yrs = Math.max(1, (fp.targetAge || 55) - age);
  const grow = Math.pow(1 + (fp.grossReturn || 7) / 100, yrs);
  const future = price * grow;
  const contribM = (fp.monthlyContribution || 0) + (fp.charlotteContribution || 0);
  const days = contribM > 0 ? price / (contribM / 30.4) : null;
  const hours = hourly > 0 ? price / hourly : null;
  const verdict = hours === null ? 'Set your income in Budget for the hours-of-life figure.'
    : hours < 2 ? 'Under two hours of work. Buy it and forget it.'
    : hours < 8 ? 'About a day of work. Fine if you\u2019ll actually use it.'
    : hours < 40 ? 'A week of your life. Worth sleeping on.'
    : 'Serious money. Give it a fortnight and see if you still want it.';
  const barMax = Math.max(future, 1);
  return (
    <div className="panel b-impulse">
      <div className="panel-h">
        <span className="panel-n">08 <span className="pslash">//</span> Impulse check</span>
        <span className="panel-m">no judgement</span>
      </div>
      <div className="row" style={{gap:10, flexWrap:'wrap', alignItems:'center'}}>
        <span className="small dim">I want to spend</span>
        <NumInput value={price} step={25} min={0} width={92} onChange={setPrice}/>
        <button className="btn" onClick={() => setPrice(60)}>€60</button>
        <button className="btn" onClick={() => setPrice(250)}>€250</button>
        <button className="btn" onClick={() => setPrice(900)}>€900</button>
        <button className="btn" onClick={() => setPrice(2500)}>€2.500</button>
      </div>
      <div className="grid3 mt">
        <div className="statbox">
          <div className="mono-lab">If invested instead</div>
          <div className="sv" style={{color:'var(--green)'}}>{fmt0(future)}</div>
          <div className="sub">by age {fp.targetAge || 55} at {fp.grossReturn || 7}%</div>
        </div>
        <div className="statbox">
          <div className="mono-lab">Hours of your life</div>
          <div className="sv">{hours === null ? '—' : (hours < 10 ? hours.toFixed(1) : Math.round(hours))}</div>
          <div className="sub">{hourly > 0 ? 'at ' + fmt0(hourly) + '/hr net' : 'income not set'}</div>
        </div>
        <div className="statbox">
          <div className="mono-lab">Investing days lost</div>
          <div className="sv">{days === null ? '—' : Math.round(days)}</div>
          <div className="sub">{contribM > 0 ? 'at ' + fmt0(contribM) + '/mo invested' : 'no contribution set'}</div>
        </div>
      </div>
      <div className="mt" style={{display:'flex', gap:6, alignItems:'center'}}>
        <span className="mono-lab" style={{width:52}}>Now</span>
        <div className="allocbar" style={{height:9}}>
          <div className="growbar" style={{height:'100%', width:(price / barMax * 100) + '%', background:'var(--red)'}}/>
        </div>
        <span className="mono" style={{fontSize:11}}>{fmt0(price)}</span>
      </div>
      <div style={{display:'flex', gap:6, alignItems:'center', marginTop:5}}>
        <span className="mono-lab" style={{width:52}}>Later</span>
        <div className="allocbar" style={{height:9}}>
          <div className="growbar" style={{height:'100%', width:'100%', background:'var(--green)'}}/>
        </div>
        <span className="mono" style={{fontSize:11}}>{fmt0(future)}</span>
      </div>
      <div className="sub mt">{verdict}</div>
    </div>
  );
}

/* Dashboard: every tab's headline in one place. Each figure is computed on the same
   basis as its own tab, so nothing here can quietly disagree with the detail views. */
function DashboardTab({ data, lens = 'sven', setTab }){
  const fp = data.fireParams || {};
  const vAssets = (data.assets || []).filter(a => lensMatch(a.owner, lens));
  const vLiabs = (data.liabilities || []).filter(l => lensMatch(l.owner, lens));
  const sumCat = c => vAssets.filter(a => a.category === c).reduce((s,a) => s + a.value, 0);
  const gross = vAssets.reduce((s,a) => s + a.value, 0);
  const debt = vLiabs.reduce((s,l) => s + l.value, 0);
  const netWorth = gross - debt;
  const liquid = sumCat('stocks') + sumCat('crypto') + sumCat('savings');
  const propVal = sumCat('property');
  const propEquity = propVal - debt;
  const ltv = propVal > 0 ? debt / propVal * 100 : 0;

  /* FI target on the same basis as the FIRE tab: spend / SWR, nothing leaned on */
  const fcAnnual = (data.fixedCosts || []).reduce((s,c) => s + monthlyEq(c), 0) * 12;
  const spend = lens === 'sven' ? (fp.annualWithdrawal || 0)
    : (fp.householdSpend > 0 ? fp.householdSpend : fcAnnual);
  const swr = fp.swr || 4;
  const fiTarget = spend > 0 ? spend / (swr / 100) : 0;
  const fiPct = fiTarget > 0 ? Math.min(100, liquid / fiTarget * 100) : 0;

  /* this month, mirroring the Budget tab */
  const income = data.income || {};
  const hh = data.household || {};
  const contribEach = hh.jointContribEach != null ? hh.jointContribEach : 1000;
  const fc = data.fixedCosts || [];
  const sharedTotal = fc.filter(c => c.shared).reduce((s,c) => s + monthlyEq(c), 0);
  const personalFixed = fc.filter(c => !c.shared && lensMatch(c.owner, lens)).reduce((s,c) => s + monthlyEq(c), 0);
  let totalFixed, totalIn;
  if (lens === 'charlotte'){ totalFixed = contribEach; totalIn = income.charlotte || 0; }
  else if (lens === 'ours'){ totalFixed = sharedTotal + personalFixed; totalIn = (income.sven || 0) + (income.charlotte || 0); }
  else { totalFixed = contribEach + personalFixed; totalIn = income.sven || 0; }
  const mk = monthKey();
  const monthTx = (data.transactions || []).filter(t => t.date.slice(0,7) === mk && !t.isTransfer && lensMatch(t.account, lens));
  const totalVar = monthTx.filter(t => t.amount < 0 && catOf(data, t.categoryId).type === 'variable')
    .reduce((s,t) => s + Math.abs(t.amount), 0);
  const surplus = totalIn - (totalFixed + totalVar);
  const savingsRate = totalIn > 0 ? surplus / totalIn * 100 : 0;

  /* portfolio: DEGIRO money-in vs live value — same anchor as the growth card */
  const ptx = data.portfolioTx || [];
  const invested = ptx.reduce((s,t) => s - t.totalEur, 0);
  const degiroNow = vAssets.filter(a => a.category === 'stocks' && a.institutionId === 'degiro' && !/^Cash/i.test(a.name))
    .reduce((s,a) => s + a.value, 0);
  const pfGrowth = degiroNow - invested;
  const showPf = lensMatch('sven', lens) && ptx.length > 0;   // imported tx are Sven's DEGIRO, unowned
  const stocksVal = sumCat('stocks'), cryptoVal = sumCat('crypto');

  const vGoals = (data.goals || []).filter(g => lensMatch(g.owner, lens));
  const openGoals = vGoals.filter(g => (g.saved || 0) < (g.target || 0));
  const nextGoal = openGoals.slice().sort((a,b) =>
    String(a.targetDate || '9999').localeCompare(String(b.targetDate || '9999')))[0] || null;

  const snaps = (data.snapshots || []).slice().sort((a,b) => a.date.localeCompare(b.date));
  const lastSnap = snaps[snaps.length - 1] || null;
  const snapDelta = (lens === 'sven' && lastSnap && lastSnap.liquidNW > 0) ? liquid - lastSnap.liquidNW : null;

  /* nudges — each jumps to where it gets fixed */
  const nudges = [];
  const fxRate = (data.fx && data.fx.GBP) || 1.17;
  if ((data.assets || []).some(a => a.currency === 'GBP') && Math.abs(fxRate - 1.17) < 0.0001)
    nudges.push({ t:'GBP rate is still the 1,17 placeholder — tap ↻ Live rate', to:'networth', go:'Net Worth' });
  if (!lastSnap || lastSnap.date.slice(0,7) !== mk)
    nudges.push({ t:'No net-worth snapshot for this month yet', to:'history', go:'History' });
  if (lens !== 'sven' && !(fp.householdSpend > 0))
    nudges.push({ t:'Household spend is guessed from fixed costs — set the real figure', to:'fire', go:'FIRE' });
  if (lens !== 'sven' && !(fp.charlotteContribution > 0))
    nudges.push({ t:'Charlotte invests €0/mo in the projection', to:'fire', go:'FIRE' });
  if (lens !== 'sven' && !(income.charlotte > 0))
    nudges.push({ t:'Charlotte’s income is still €0', to:'budget', go:'Budget' });
  if (!ptx.length)
    nudges.push({ t:'Import DEGIRO Transactions.csv for the growth chart', to:'portfolio', go:'Portfolio' });

  const nwLabel = lens === 'ours' ? 'Household net worth'
    : lens === 'charlotte' ? 'Charlotte · net worth' : 'Net worth';

  /* instrument-panel extras */
  const hr = TODAY.getHours();
  const greet = hr < 6 ? 'Good night' : hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening';
  const greetName = lens === 'ours' ? 'Sven & Charlotte' : (OWNERS[lens] || 'Sven');
  const opName = lens === 'charlotte' ? 'C. Cook'
    : lens === 'ours' ? 'Van Almenkerk · Cook' : 'S. van Almenkerk';
  const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
  const dayOfYear = Math.floor((TODAY - new Date(TODAY.getFullYear(), 0, 0)) / 86400000);
  const dateLine = TODAY.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  const contribM = (fp.monthlyContribution || 0) + (lens === 'sven' ? 0 : (fp.charlotteContribution || 0));
  const age = currentAge(fp.birthYear);
  const yrsToTarget = Math.max(0, (fp.targetAge || 55) - age);
  const coastToday = fiTarget > 0 ? fiTarget / Math.pow(1 + (fp.grossReturn || 7) / 100, yrsToTarget) : 0;
  const coastPct = coastToday > 0 ? Math.min(100, liquid / coastToday * 100) : 0;
  const sparkPts = snaps.slice(-14).map(x => x.liquidNW || 0).filter(v => v > 0);
  const allocRows = ASSET_CATS.map(c => ({ name:c.name, color:c.color, val:sumCat(c.id) })).filter(r => r.val > 0);
  const allocMax = Math.max.apply(null, allocRows.map(r => r.val).concat([1]));

  /* milestone ladder — a window around where you actually are */
  const msAll = [10000,25000,50000,100000,250000,500000,1000000]
    .filter(m => m < fiTarget * 0.96).map(m => ({ at:m, label:fmt0(m) }));
  if (coastToday > 0 && coastToday < fiTarget * 0.96) msAll.push({ at:coastToday, label:'Coast FI' });
  if (fiTarget > 0) msAll.push({ at:fiTarget, label:'FI · spend covered' });
  msAll.sort((a,b) => a.at - b.at);
  const msDone = msAll.filter(m => liquid >= m.at).length;
  const msView = msAll.slice(Math.max(0, msDone - 1), Math.max(0, msDone - 1) + 5);
  const msPct = msAll.length ? msDone / msAll.length * 100 : 0;

  /* month elapsed, for the budget burn bar */
  const dim = new Date(TODAY.getFullYear(), TODAY.getMonth() + 1, 0).getDate();
  const monthPct = TODAY.getDate() / dim * 100;
  const spendPct = totalIn > 0 ? Math.min(100, (totalFixed + totalVar) / totalIn * 100) : 0;

  return (
    <div className="dash">
      <div className="dash-status">
        <span>Sven Finance <span style={{opacity:.55}}>// v43</span></span>
        <span className="dstat">
          <span>Lens {(OWNERS[lens] || 'Ours')}</span>
          <span>{plural(vAssets.length, 'position')}</span>
          <span>{plural(snaps.length, 'snapshot')}</span>
          <span>GBP {String(fxRate).replace('.', ',')}</span>
          <span>{ISO(TODAY).replace(/-/g, '')}</span>
        </span>
      </div>

      <div className="bento">
        <Panel n="02" title="Session" meta={nwLabel} to="networth" setTab={setTab} cls="b-session">
          <div className="spread" style={{alignItems:'flex-end', gap:12, flexWrap:'wrap'}}>
            <div style={{minWidth:0}}>
              <div className="greet">{greet}, <i>{greetName}</i>.</div>
              <div className="mono-lab" style={{marginTop:5}}>{dateLine} · day {dayOfYear} of 365</div>
            </div>
            <div style={{textAlign:'right'}}>
              <div className="hero-num"><CountUp value={netWorth} format={fmt0}/></div>
              <div className="mono-lab" style={{marginTop:3}}>
                {fmt0(gross)} assets − {fmt0(debt)} debt
              </div>
              {snapDelta !== null &&
                <div className="mono" style={{fontSize:11.5, marginTop:2, color: snapDelta >= 0 ? 'var(--green)' : 'var(--red)'}}>
                  {(snapDelta >= 0 ? '▲ +' : '▼ −') + fmt0(Math.abs(snapDelta))} vs snapshot</div>}
            </div>
          </div>
        </Panel>

        <Panel n="05" title="Vitals" meta="Progress to FI" to="fire" setTab={setTab} cls="b-vitals">
          <div className="spread" style={{alignItems:'baseline'}}>
            <span className="hero-num green"><CountUp value={fiPct} format={pct1}/></span>
            <span className="mono-lab">of {fmt0(fiTarget)}</span>
          </div>
          <Spark points={sparkPts} color="var(--red)"/>
          <div className="grid2" style={{gap:7}}>
            <div className="statbox"><div className="mono-lab">Liquid</div><div className="sv">{fmt0(liquid)}</div></div>
            <div className="statbox"><div className="mono-lab">Investing</div><div className="sv">{fmt0(contribM)}<span className="mono-lab"> /mo</span></div></div>
            <div className="statbox"><div className="mono-lab">Saving</div><div className="sv">{pct1(savingsRate)}</div></div>
            <div className="statbox"><div className="mono-lab">Horizon</div><div className="sv">{yrsToTarget}<span className="mono-lab"> yrs</span></div></div>
          </div>
          <div className="row" style={{justifyContent:'space-around', marginTop:11}}>
            <Ring pct={fiPct} color="var(--green)" label="FI" value={pct1(fiPct)}/>
            <Ring pct={coastPct} color="var(--yellow)" label="Coast" value={pct1(coastPct)}/>
            <Ring pct={propVal > 0 ? (propEquity / propVal * 100) : 0} color="var(--blue)" label="Equity"

                      width:(r.val / allocMax * 100) + '%', background:r.color, opacity:.75}}/>

          <div style={{borderTop:'1px solid var(--rule)', marginTop:8, paddingTop:7}} className="mono-lab">

            ? <div className="sub">Nothing outstanding — the numbers are as current as your last update.</div>
            : nudges.map((n,i) => (
                <button key={i} className="nudge" onClick={() => setTab(n.to)}>
                  <span className="n-ico" aria-hidden="true">●</span>
                  <span>{n.t}</span>
                  <span className="n-go">{n.go} →</span>
                </button>
              ))}
        </Panel>

        <Panel n="07" title="Milestones" meta={msDone + '/' + msAll.length} to="fire" setTab={setTab} cls="b-miles">
          <div className="spread" style={{alignItems:'baseline'}}>
            <span className="hero-num" style={{fontSize:26}}>{pct1(msPct)}</span>
            <span className="mono-lab">of the ladder</span>
          </div>
          <div style={{position:'relative', height:8, background:'var(--bg)', borderRadius:5, margin:'8px 0 10px'}}>
            <div className="growbar" style={{position:'absolute', left:0, top:0, height:'100%',
              width:Math.min(100, msPct) + '%', background:'var(--green)', borderRadius:5}}/>
          </div>
          {msView.map((m,i) => {
            const hit = liquid >= m.at;
            const isNext = !hit && msView.slice(0,i).every(q => liquid >= q.at);
            return (
              <div key={i} className={'msrow' + (hit ? ' on' : '') + (isNext ? ' next' : '')}>
                <span className={'msbox' + (hit ? ' on' : '') + (isNext ? ' next' : '')} aria-hidden="true">
                  {hit ? '✓' : (isNext ? '→' : '')}</span>
                <span style={{flex:1, minWidth:0}}>{m.label}</span>
                <span className="mono" style={{fontSize:10.5}}>
                  {hit ? fmt0(m.at) : fmt0(m.at - liquid) + ' to go'}</span>
              </div>
            );
          })}
        </Panel>

        <ImpulseBuy data={data}/>
      </div>
    </div>
  );
}

/* ============================ App shell ============================ */
const TABS = [
  { id:'dash',     label:'Dashboard' },
  { id:'networth', label:'Net Worth' },
  { id:'fire',     label:'FIRE' },
  { id:'budget',   label:'Budget' },
  { id:'goals',    label:'Goals' },
  { id:'portfolio',label:'Portfolio' },
  { id:'property', label:'Property' },
  { id:'history',  label:'History' },
  { id:'settings', label:'⚙', cls:'settings', title:'Settings' },
];

function FinanceModel(){
  const [data, setData] = useState(loadData);
  const [tab, setTab] = useState('dash');
  const [lens, setLens] = useState('sven');
  const sync = useCloudSync(data, setData);

  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e){}
  }, [data]);

  const liquid = data.assets
    .filter(a => a.category !== 'property' && lensMatch(a.owner, lens))
    .reduce((s,a) => s + a.value, 0);

  return (
    <div className="app">
      <div className="header">
        <div className="brand">
          <svg width="30" height="30" viewBox="0 0 120 120" aria-hidden="true" style={{flexShrink:0}}>
            <defs><clipPath id="dawnHdr"><rect x="0" y="0" width="120" height="74"/></clipPath></defs>
            <g style={{animation:'rayPulse 6s ease-in-out infinite 2s'}}>
              <line x1="60" y1="14" x2="60" y2="26" stroke="#988C6C" strokeWidth="3" strokeLinecap="round" style={{animation:'fadein .5s ease both .9s'}}/>
              <line x1="30" y1="26" x2="39" y2="36" stroke="#988C6C" strokeWidth="3" strokeLinecap="round" style={{animation:'fadein .5s ease both 1s'}}/>
              <line x1="90" y1="26" x2="81" y2="36" stroke="#988C6C" strokeWidth="3" strokeLinecap="round" style={{animation:'fadein .5s ease both 1s'}}/>
            </g>
            <g clipPath="url(#dawnHdr)"><circle cx="60" cy="74" r="25" fill="#4A211C" style={{animation:'riseUp .95s cubic-bezier(.2,.8,.2,1) both .4s'}}/></g>
            <line x1="14" y1="74" x2="106" y2="74" stroke="#988C6C" strokeWidth="3.4" strokeLinecap="round" strokeDasharray="92" style={{animation:'drawStroke .8s ease both .25s'}}/>
          </svg>
          <div style={{display:'flex', flexDirection:'column'}}>
            <span className="wm">Sven <span className="fin">Finance</span></span>
            <span className="tag">Private-wealth almanac</span>
          </div>
        </div>
        <div className="lens" role="tablist" aria-label="Whose finances">
          {LENSES.map(L => (
            <button key={L[0]} className={'lens-btn' + (lens === L[0] ? ' on' : '')}
              onClick={() => setLens(L[0])}>{L[1]}</button>
          ))}
        </div>
        <HeaderPill liquid={liquid} snapshots={data.snapshots} lens={lens}/>
      </div>

      <nav className="tabs" role="tablist">
        {TABS.map(t => (
          <button key={t.id} role="tab" aria-selected={tab === t.id}
            title={t.title || t.label}
            className={'tab ' + (t.cls || '') + (tab === t.id ? ' active' : '')}
            onClick={() => setTab(t.id)}>{t.label}</button>
        ))}
      </nav>

      <main key={tab}>
        {tab === 'dash'     && <DashboardTab data={data} lens={lens} setTab={setTab}/>}
        {tab === 'networth' && <NetWorthTab data={data} setData={setData} lens={lens}/>}
        {tab === 'fire'     && <FireTab data={data} setData={setData} lens={lens}/>}
        {tab === 'budget'   && <BudgetTab data={data} setData={setData} lens={lens}/>}
        {tab === 'goals'    && <GoalsTab data={data} setData={setData} lens={lens}/>}
        {tab === 'portfolio'&& <PortfolioTab data={data} setData={setData} lens={lens}/>}
        {tab === 'property' && <PropertyTab data={data} setData={setData} lens={lens}/>}
        {tab === 'history'  && <HistoryTab data={data} setData={setData} lens={lens}/>}
        {tab === 'settings' && <SettingsTab data={data} setData={setData} sync={sync}/>}
      </main>
    </div>
  );
}

// Boot diagnostic — if the app didn't mount, show a readable reason instead of a blank page.
window.addEventListener('load', function(){
  setTimeout(function(){
    var el = document.getElementById('root');
    if (el && el.children.length > 0) return;            // mounted fine
    var missing = [];
    if (typeof React === 'undefined') missing.push('React');
    if (typeof ReactDOM === 'undefined') missing.push('ReactDOM');
    if (typeof Babel === 'undefined') missing.push('Babel');
    if (typeof PropTypes === 'undefined') missing.push('PropTypes');
    if (typeof Recharts === 'undefined') missing.push('Recharts');
    var msg = missing.length
      ? 'Could not load: ' + missing.join(', ') + '. A network/CDN block is the usual cause.'
      : (window.__bootErr ? ('Startup error: ' + window.__bootErr) : 'The app did not start.');
    if (el) el.innerHTML =
      '<div style="max-width:560px;margin:64px auto;padding:24px;font-family:-apple-system,Segoe UI,sans-serif;'
      + 'background:#ECE4D6;border:1px solid #D9CFBD;border-radius:14px;color:#211F1B;line-height:1.5">'
      + '<div style="font-size:18px;font-weight:700;margin-bottom:8px">Finance dashboard could not start</div>'
      + '<div style="color:#5C574C;font-size:14px">' + msg + '</div>'
      + '<div style="color:#8A8475;font-size:12px;margin-top:14px">If this is the in-app preview, open the deployed '
      + 'GitHub Pages version instead — external chart/React libraries load fine there.</div></div>';
  }, 1200);
});

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<FinanceModel />);
</script>

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
