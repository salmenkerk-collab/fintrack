<html lang="nl">
<head>

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"

<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.28.4/babel.min.js"
  onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@babel/standalone@7.28.4/babel.min.js'"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.min.js"

<!-- Early error capture: turns a future blank screen into a readable message -->
<script>
  window.__bootErr = null;
  window.addEventListener('error', function(e){
    if (!window.__bootErr) window.__bootErr = (e && e.message ? e.message : 'Unknown error') +
      (e && e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '');
  }, true);

<style>
  :root{
    --bg:#0f172a; --surface:#1e293b; --surface2:#334155;
    --text:#f8fafc; --muted:#94a3b8; --dim:#475569;
    --blue:#3b82f6; --green:#4ade80; --orange:#fb923c;
    --purple:#a78bfa; --red:#f87171; --yellow:#fbbf24;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{ -webkit-text-size-adjust:100%; }
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size:15px; line-height:1.45;
    padding-top:env(safe-area-inset-top);
  }
  .app{ max-width:1180px; margin:0 auto; padding:16px 16px 64px; }

  /* ---------- header ---------- */
  .header{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:6px 0 14px; }
  .brand{ font-size:17px; font-weight:700; letter-spacing:.2px; }
  .brand span{ color:var(--blue); }
  .liquid-pill{
    display:flex; flex-direction:column; align-items:flex-end; gap:1px;
    background:var(--surface); border:1px solid var(--surface2);
    border-radius:12px; padding:7px 13px; white-space:nowrap;
  }
  .liquid-pill .lp-main{ font-size:14px; font-weight:700; }
  .liquid-pill .lp-main b{ color:var(--text); font-variant-numeric:tabular-nums; }
  .liquid-pill .lp-label{ color:var(--muted); font-weight:500; font-size:11px; text-transform:uppercase; letter-spacing:.6px; }
  .liquid-pill .lp-delta{ font-size:12px; font-weight:600; font-variant-numeric:tabular-nums; }
  .delta-pos{ color:var(--green); } .delta-neg{ color:var(--red); } .delta-zero{ color:var(--muted); }

  /* ---------- tabs ---------- */
  .tabs{ display:flex; gap:4px; border-bottom:1px solid var(--surface2); overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    background:none; border:none; color:var(--muted); cursor:pointer;
    font:inherit; font-weight:600; font-size:14px; padding:10px 13px;
    border-bottom:2px solid transparent; white-space:nowrap;
  }
  .tab:hover{ color:var(--text); }
  .tab.active{ color:var(--blue); border-bottom-color:var(--blue); }
  .tab.settings{ margin-left:auto; font-size:16px; }
  .tab:focus-visible{ outline:2px solid var(--blue); outline-offset:-2px; border-radius:6px; }

  /* ---------- layout & cards ---------- */
  main{ padding-top:18px; }
  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .grid2{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .layout-side{ display:grid; grid-template-columns:1fr 300px; gap:14px; align-items:start; }
  .card{
    background:var(--surface); border:1px solid var(--surface2);
    border-radius:14px; padding:16px;
  }
  .card h3{ font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.7px; margin-bottom:8px; }
  .card h2{ font-size:15px; font-weight:700; margin-bottom:10px; }
  .metric{ font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; }
  .metric.primary{ font-size:32px; }
  .metric.red{ color:var(--red); }
  .sub{ color:var(--muted); font-size:12.5px; margin-top:3px; }
  .pills-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .pill{
    background:var(--surface); border:1px solid var(--surface2); border-radius:999px;
    padding:7px 14px; font-size:13px; font-weight:600; display:flex; gap:7px; align-items:center;
  }
  .pill .k{ color:var(--muted); font-weight:500; }
  .stack{ display:flex; flex-direction:column; gap:14px; }
  .row{ display:flex; align-items:center; gap:8px; }
  .spread{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .muted{ color:var(--muted); } .dim{ color:var(--dim); }
  .small{ font-size:12.5px; }
  .mt{ margin-top:14px; } .mb{ margin-bottom:10px; }
  .green{ color:var(--green); } .red{ color:var(--red); } .yellow{ color:var(--yellow); }
  .orangeTxt{ color:var(--orange); } .blueTxt{ color:var(--blue); }
  .num{ font-variant-numeric:tabular-nums; }

  /* ---------- tables ---------- */
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th{ text-align:left; color:var(--muted); font-size:11.5px; text-transform:uppercase; letter-spacing:.6px; font-weight:600; padding:7px 8px; border-bottom:1px solid var(--surface2); }
  td{ padding:8px; border-bottom:1px solid rgba(51,65,85,.55); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  td.r, th.r{ text-align:right; }

  /* ---------- category accordion ---------- */
  .cat-header{
    display:flex; align-items:center; gap:10px; width:100%;
    background:var(--surface2); border:none; color:var(--text); cursor:pointer;
    font:inherit; font-weight:700; font-size:14px;
    border-radius:10px; padding:10px 12px; margin-top:8px;
  }
  .cat-header .chev{ color:var(--muted); font-size:11px; width:12px; }
  .cat-header .cat-total{ margin-left:auto; font-variant-numeric:tabular-nums; }
  .cat-header .cat-pct{ color:var(--muted); font-weight:500; font-size:12.5px; width:52px; text-align:right; }
  .cat-dot{ width:9px; height:9px; border-radius:50%; flex:none; }

  /* ---------- buttons & inputs ---------- */
  .btn{
    background:var(--surface2); color:var(--text); border:1px solid var(--surface2);
    border-radius:9px; padding:7px 13px; font:inherit; font-size:13px; font-weight:600; cursor:pointer;
  }
  .btn:hover{ border-color:var(--dim); }
  .btn-blue{ background:var(--blue); border-color:var(--blue); color:#fff; }
  .btn-blue:hover{ background:#2f74e0; }
  .btn-green{ background:rgba(74,222,128,.15); border-color:rgba(74,222,128,.4); color:var(--green); }
  .btn-icon{ background:none; border:none; cursor:pointer; font-size:14px; padding:3px 5px; border-radius:6px; opacity:.75; }
  .btn-icon:hover{ opacity:1; background:var(--surface2); }
  .btn:focus-visible,.btn-icon:focus-visible,input:focus-visible,select:focus-visible{ outline:2px solid var(--blue); outline-offset:1px; }
  input, select{
    background:var(--bg); border:1px solid var(--surface2); color:var(--text);
    border-radius:8px; padding:7px 10px; font:inherit; font-size:13.5px;
  }
  input[type=number]{ -moz-appearance:textfield; }
  input[type=range]{ width:100%; accent-color:var(--blue); padding:0; border:none; background:none; }
  label.fld{ display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); font-weight:600; }
  .form-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; align-items:end; }

  .stale-y{ color:var(--yellow); } .stale-o{ color:var(--orange); }
  .badge{ display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; }
  .badge-blue{ background:rgba(59,130,246,.18); color:var(--blue); }
  .badge-green{ background:rgba(74,222,128,.15); color:var(--green); }
  .badge-red{ background:rgba(248,113,113,.15); color:var(--red); }

  /* ---------- FIRE scenario cards ---------- */
  .scen{ border-top:3px solid var(--surface2); }
  .scen.pess{ border-top-color:var(--red); }
  .scen.base{ border-top-color:var(--blue); }
  .scen.opt{ border-top-color:var(--green); }
  .scen .big{ font-size:24px; font-weight:800; }
  .kv{ display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px dashed rgba(51,65,85,.6); font-size:13px; }
  .kv:last-child{ border-bottom:none; }
  .kv .k{ color:var(--muted); }
  .kv .v{ font-weight:700; font-variant-numeric:tabular-nums; }

  .placeholder{
    border:1px dashed var(--surface2); border-radius:14px; padding:48px 20px;
    text-align:center; color:var(--muted);
  }
  .placeholder .ph-icon{ font-size:30px; margin-bottom:10px; }

  .donut-wrap{ position:relative; width:100%; height:230px; }
  .donut-center{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; pointer-events:none;
  }
  .donut-center .dc-val{ font-size:19px; font-weight:800; font-variant-numeric:tabular-nums; }
  .donut-center .dc-lbl{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; }

  .recharts-default-tooltip{ background:var(--surface) !important; border:1px solid var(--surface2) !important; border-radius:10px; }
  .recharts-tooltip-label, .recharts-tooltip-item{ color:var(--text) !important; font-size:12.5px !important; }

  /* ---- modal / CSV import ---- */
  .modal-back{position:fixed;inset:0;background:rgba(2,6,23,.8);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto;}
  .modal{background:var(--surface);border:1px solid var(--surface2);border-radius:16px;max-width:1080px;width:100%;padding:18px;margin-bottom:40px;}
  .review-wrap{max-height:50vh;overflow:auto;border:1px solid var(--surface2);border-radius:10px;}
  .review-wrap table{font-size:12.5px;}
  .review-wrap th{position:sticky;top:0;background:var(--surface);z-index:2;}
  .tx-row td{border-bottom:1px solid rgba(51,65,85,.4);}
  .tx-auto{box-shadow:inset 3px 0 0 var(--green);}
  .tx-sug{box-shadow:inset 3px 0 0 var(--yellow);}
  .tx-none{box-shadow:inset 3px 0 0 var(--red);}
  .tx-transfer{opacity:.55;}
  .tx-active{background:rgba(59,130,246,.12);}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--dim);border-radius:10px;padding:10px 16px;font-size:13px;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:90vw;}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px 12px;}
  .legend b{color:var(--text);background:var(--surface2);border-radius:4px;padding:0 5px;margin-right:2px;}
  /* ---- settings ---- */
  .cat-row{position:relative;display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid rgba(51,65,85,.5);}
  .drag-row{cursor:grab;}
  .drag-over{outline:2px dashed var(--blue);outline-offset:-2px;border-radius:8px;}
  .swatch{width:18px;height:18px;border-radius:6px;border:1px solid rgba(255,255,255,.2);cursor:pointer;flex:none;}
  .pop{position:absolute;z-index:30;background:var(--surface);border:1px solid var(--surface2);border-radius:10px;padding:8px;display:grid;grid-template-columns:repeat(7,28px);gap:4px;box-shadow:0 10px 30px rgba(0,0,0,.5);}
  .pop button{font-size:16px;background:none;border:none;cursor:pointer;border-radius:6px;padding:2px;line-height:1;}
  .pop button:hover{background:var(--surface2);}
  @media (max-width:900px){
    .layout-side{ grid-template-columns:1fr; }
  }
  @media (max-width:640px){
    .grid3, .grid2{ grid-template-columns:1fr; }
    .metric.primary{ font-size:27px; }
    .liquid-pill{ padding:6px 10px; }
    .header{ flex-wrap:wrap; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;
/* Guarded so a chart-library load hiccup degrades to "charts missing" instead of a blank app. */
const __R = (typeof Recharts !== 'undefined' && Recharts) ? Recharts : {};
const { ResponsiveContainer, PieChart, Pie, Cell, AreaChart, Area, BarChart, Bar,

/* ============================ constants & helpers ============================ */
const STORAGE_KEY = 'sven_finance_v1';
const TODAY = new Date();
const ISO = d => d.toISOString().slice(0,10);

const eur  = new Intl.NumberFormat('nl-NL', { style:'currency', currency:'EUR' });

const fmt  = v => eur.format(v);
const fmt0 = v => eur0.format(v);
const pct1 = v => new Intl.NumberFormat('nl-NL', { maximumFractionDigits:1 }).format(v) + '%';

const uid = () => Math.random().toString(36).slice(2,10);

const ASSET_CATS = [
  { id:'stocks',   name:'Stocks',   icon:'📈', color:'#3b82f6' },

/* ---- CoinGecko live crypto pricing (free, no key, EUR-native, CORS-enabled) ---- */
const COIN_IDS = { BTC:'bitcoin', ETH:'ethereum', XRP:'ripple', SOL:'solana',
  ADA:'cardano', VET:'vechain', MANA:'decentraland', SUI:'sui', DOT:'polkadot',
  DOGE:'dogecoin', LINK:'chainlink', MATIC:'matic-network', AVAX:'avalanche-2',

  ATOM:'cosmos', NEAR:'near', ALGO:'algorand', XLM:'stellar' };
const COIN_LIST = Object.keys(COIN_IDS);
function tickerFromName(name){
  const m = String(name||'').match(/\(([A-Za-z0-9]+)\)/);
  if (m) return m[1].toUpperCase();
  const w = String(name||'').trim().toUpperCase();
  return COIN_IDS[w] ? w : '';
}
function coinIdFromName(name){ const t = tickerFromName(name); return COIN_IDS[t] || null; }
function fetchCryptoPrices(ids){
  const u = 'https://api.coingecko.com/api/v3/simple/price?ids=' +
    encodeURIComponent(ids.join(',')) + '&vs_currencies=eur';
  return fetch(u).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });

function relTime(iso){
  if (!iso) return null;
  const days = Math.floor((TODAY - new Date(iso)) / 86400000);
  const txt = days <= 0 ? 'Updated today' : days === 1 ? 'Updated 1 day ago' : 'Updated ' + days + ' days ago';

  return <span className={'small num ' + cls}>{txt}</span>;

/* Migration: guarantees every structural list exists, moves legacy data onto the
   id-referenced model. Safe to run repeatedly. */
function migrate(d){
  d.transactions  = d.transactions || [];
  d.categories    = (d.categories && d.categories.length)     ? d.categories     : SEED_CATEGORIES.map(c => ({ ...c }));
  d.institutions  = (d.institutions && d.institutions.length) ? d.institutions   : SEED_INSTITUTIONS.map(i => ({ ...i }));
  d.knownIBANs    = (d.knownIBANs && d.knownIBANs.length)     ? d.knownIBANs.map(i => i.id ? i : { ...i, id: uid() }) : SEED_IBANS.map(i => ({ ...i }));
  d.learnedRules  = d.learnedRules  || [];
  d.importHistory = d.importHistory || [];
  d.fileAccountMap = d.fileAccountMap || {};
  d.settings = Object.assign({ trustING: true }, d.settings || {});
  d.fixedCosts = (d.fixedCosts || []).map(c =>
    Object.assign({ categoryId:'vaste-lasten', frequency:'monthly', note:'' }, c));
  /* legacy v1/v2 budgetVariable entries (category by NAME) → id-referenced transactions */
  if (d.budgetVariable){
    const NAME_MAP = { 'Groceries':'boodschappen', 'Dining & bars':'restaurants-bars',
      'Personal care':'gezondheid', 'Clothing':'winkelen', 'Gifts':'overig',
      'Travel':'vrije-tijd', 'Other':'overig' };
    Object.keys(d.budgetVariable).forEach(mk => (d.budgetVariable[mk] || []).forEach(v => {
      d.transactions.push({ id: v.id || uid(), date: mk + '-15', description: v.name,
        amount: -Math.abs(v.amount || 0), account:'sven',
        categoryId: NAME_MAP[v.category] || 'overig', source:'manual', hash:null, isTransfer:false });
    }));
    delete d.budgetVariable;
  }
  d.assets = (d.assets || []).map(a => {
    if (a.category === 'crypto')
      return { ...a, coinId: a.coinId || coinIdFromName(a.name),
        quantity: (a.quantity != null ? a.quantity : null),
        priceEUR: (a.priceEUR != null ? a.priceEUR : null),
        costBasis: (a.costBasis != null ? a.costBasis : null) };
    if (a.category === 'stocks') return { ...a, isin: a.isin || null,
        costBasis: (a.costBasis != null ? a.costBasis : null) };
    return a;
  });
  return d;
}

function loadData(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw){
      const parsed = JSON.parse(raw);
      if (parsed && parsed.assets) return migrate({ ...seedData(), ...parsed });
    }
  } catch(e){ /* corrupted storage → reseed */ }
  return migrate(seedData());
}

function HeaderPill({ liquid, snapshots }){
  const sorted = [...(snapshots||[])].sort((a,b) => a.date.localeCompare(b.date));
  const last = sorted[sorted.length-1];
  let delta = null;
  if (last && last.liquidNW > 0){
    const d = liquid - last.liquidNW;
    delta = { d, p: d / last.liquidNW * 100 };
  }
  const cls = !delta ? 'delta-zero' : delta.d >= 0 ? 'delta-pos' : 'delta-neg';
  const arrow = !delta ? '' : delta.d >= 0 ? '▲' : '▼';
  return (
    <div className="liquid-pill" title="Stocks + crypto + savings. Delta vs last snapshot in History.">
      <span className="lp-label">Liquid NW</span>
      <span className="lp-main"><b>{fmt0(liquid)}</b></span>
      <span className={'lp-delta ' + cls}>
        {delta
          ? arrow + ' ' + (delta.d >= 0 ? '+' : '−') + fmt0(Math.abs(delta.d)) + ' (' + (delta.d >= 0 ? '+' : '') + pct1(delta.p) + ')'
          : 'no snapshot yet'}
      </span>
    </div>
  );
}

/* ============================ TAB 2 — FIRE ============================ */
function currentAge(birthYear){
  // birthday 16 Nov → before that date you are (year − birthYear − 1)
  const y = TODAY.getFullYear();
  const hadBirthday = (TODAY.getMonth() > 10) || (TODAY.getMonth() === 10 && TODAY.getDate() >= 16);
  return y - birthYear - (hadBirthday ? 0 : 1);
}

function box3Drag(p, fp){
  if (p <= fp.box3Exempt) return 0;
  return fp.box3FictitiousReturn/100 * fp.box3TaxRate/100 * ((p - fp.box3Exempt) / p) * 100; // %-points
}

/* Simulate one scenario. Returns trajectory rows + key milestones. */
function simulate(startNW, fp, grossPct, inflPct){
  const startYear = TODAY.getFullYear();
  const age0 = currentAge(fp.birthYear);
  const targetYear = startYear + (fp.targetAge - age0);
  const fireNumber = fp.annualWithdrawal / (fp.swr/100);     // today's money
  const horizon = Math.max(fp.targetAge - age0, 1) + 12;     // sim a bit past target

  const rows = [];
  let v = startNW, fireYear = null;
  for (let t = 0; t <= horizon; t++){
    const year = startYear + t, age = age0 + t;
    const real = v / Math.pow(1 + inflPct/100, t);
    const fireAtT = fireNumber * Math.pow(1 + inflPct/100, t);
    rows.push({ year, age, nominal:Math.round(v), real:Math.round(real),
                fireTarget:Math.round(fireAtT) });
    if (fireYear === null && v >= fireAtT) fireYear = year;
    const drag = box3Drag(v, fp);
    const net = (grossPct - drag) / 100;
    const growth = v * net;
    rows[rows.length-1].growth = Math.round(growth);
    rows[rows.length-1].contrib = fp.monthlyContribution * 12;
    v = v + growth + fp.monthlyContribution * 12;
  }

  /* Coast FIRE: earliest year where value, grown at GROSS return only (no more
     contributions), still reaches the inflation-adjusted FIRE number at target age. */
  const yearsToTarget = targetYear - startYear;
  const fireAtTarget = fireNumber * Math.pow(1 + inflPct/100, yearsToTarget);
  let coastYear = null;
  for (const r of rows){
    if (r.year > targetYear) break;
    const grown = r.nominal * Math.pow(1 + grossPct/100, targetYear - r.year);
    if (grown >= fireAtTarget){ coastYear = r.year; break; }
  }

  const atTarget = rows.find(r => r.year === targetYear) || rows[rows.length-1];
  return {
    rows, fireNumber, fireYear,
    fireAge: fireYear !== null ? age0 + (fireYear - startYear) : null,
    yearsToFire: fireYear !== null ? fireYear - startYear : null,
    coastYear, coastAge: coastYear !== null ? age0 + (coastYear - startYear) : null,
    realAtTarget: atTarget ? atTarget.real : 0,
    fireAtTarget, targetYear, age0, startYear,
  };
}

/* Monthly contribution needed to hit the FIRE number exactly at target age (bisection). */
function monthlyNeeded(startNW, fp){
  const test = m => simulate(startNW, { ...fp, monthlyContribution:m }, fp.grossReturn, fp.inflation);
  let lo = 0, hi = 20000;
  const hits = m => { const s = test(m); return s.fireYear !== null && s.fireYear <= s.targetYear; };
  if (hits(0)) return 0;
  if (!hits(hi)) return null;
  for (let i = 0; i < 40; i++){
    const mid = (lo + hi) / 2;
    if (hits(mid)) hi = mid; else lo = mid;
  }
  return Math.ceil(hi / 10) * 10;
}

const monthKey = () => ISO(TODAY).slice(0,7);
const monthLabel = mk => {
  const d = mk ? new Date(mk + '-15T12:00:00') : TODAY;
  return new Intl.DateTimeFormat('nl-NL', { month:'long', year:'numeric' }).format(d);
};
const prevMonthKey = mk => {
  const p = mk.split('-').map(Number);
  const d = new Date(p[0], p[1] - 2, 15);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
};
const budgetCats = data => [...(data.categories || [])].sort((a,b) => (a.order||0) - (b.order||0));
const catOf = (data, id) => {
  if (id === 'transfer') return { id:'transfer', name:'Overboeking (transfer)', icon:'🔁', color:'#475569', type:'transfer' };
  return (data.categories || []).find(c => c.id === id)
      || { id, name:'Onbekend', icon:'❓', color:'#475569', type:'variable' };
};
const monthlyEq = c =>
  c.frequency === 'quarterly' ? c.amount / 3 :
  c.frequency === 'yearly'    ? c.amount / 12 :
  c.frequency === 'one-off'   ? 0 : c.amount;
const ACCOUNT_LABELS = { sven:'Sven', charlotte:'Charlotte', joint:'Joint' };

function MonthCompare({ data, mk }){
  const pk = prevMonthKey(mk);
  const sumFor = (m, cid) => (data.transactions || [])
    .filter(t => !t.isTransfer && t.amount < 0 && t.date.slice(0,7) === m && t.categoryId === cid)
    .reduce((s,t) => s + Math.abs(t.amount), 0);
  const rows = budgetCats(data).filter(c => c.type === 'variable').map(c => ({
    c, cur: sumFor(mk, c.id), prev: sumFor(pk, c.id),
  })).filter(r => r.cur > 0 || r.prev > 0);
  if (!rows.some(r => r.prev > 0)) return null;
  return (
    <div className="card">
      <h3>This month vs {monthLabel(pk)}</h3>
      <table>
        <tbody>
          {rows.map(r => {
            const chg = r.prev > 0 ? (r.cur - r.prev) / r.prev * 100 : null;
            return (
              <tr key={r.c.id}>
                <td style={{fontWeight:600}}>{r.c.icon} {r.c.name}</td>
                <td className="r num muted">{fmt(r.prev)}</td>
                <td className="r num" style={{fontWeight:700}}>{fmt(r.cur)}</td>
                <td className={'r num small ' + (chg === null ? 'dim' : chg > 0 ? 'red' : 'green')}>
                  {chg === null ? 'new' : (chg >= 0 ? '+' : '') + pct1(chg)}
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

const MORTGAGE_PAYMENT = 1040.68;

function amortize(balance, annualRatePct, payment, extra){
  let b = balance, months = 0, interestTotal = 0;
  const r = annualRatePct/100/12;
  while (b > 0 && months < 12000){
    const i = b * r;
    if (payment + extra <= i) return null;          // payment doesn't cover interest
    interestTotal += i;
    b = b + i - (payment + extra);
    months++;
  }
  return { months, interestTotal };
}
function balanceAfterMonths(balance, ratePct, payment, extra, m){
  let b = balance; const r = ratePct/100/12;
  for (let k = 0; k < m && b > 0; k++) b = b + b*r - (payment + extra);
  return Math.max(0, b);
}
function balanceMonthsAgo(balance, ratePct, payment, m){
  let b = balance; const r = ratePct/100/12;
  for (let k = 0; k < m; k++) b = (b + payment) / (1 + r);
  return b;
}
function addMonths(date, m){
  const d = new Date(date); d.setMonth(d.getMonth() + m); return d;
}
const fmtMonthYear = d => new Intl.DateTimeFormat('nl-NL', { month:'long', year:'numeric' }).format(d);

function PropertyTab({ data, setData }){
  const p = data.property;
  const appreciation = !!p.appreciation;
  const extra = data.mortgageOverpayment || 0;
  const rate = p.interestRate || 3.0;

  const equity = p.value - p.mortgageBalance;
  const ltv = p.value > 0 ? p.mortgageBalance / p.value * 100 : 0;
  const perM2 = p.size > 0 ? p.value / p.size : 0;

  const setProp = patch => {
    const np = { ...p, ...patch };
    let assets = data.assets, liabs = data.liabilities;
    if ('value' in patch){
      let synced = false;
      assets = assets.map(a => (!synced && a.category === 'property')
        ? (synced = true, { ...a, value: patch.value, lastUpdated: ISO(TODAY) }) : a);
    }
    if ('mortgageBalance' in patch){
      liabs = liabs.map((l,i) => i === 0 ? { ...l, value: patch.mortgageBalance, lastUpdated: ISO(TODAY) } : l);
    }
    setData({ ...data, property: np, assets, liabilities: liabs });
  };

  /* equity growth chart: 2024 → 2035 */
  const curYear = TODAY.getFullYear();
  const chartRows = [];
  for (let y = 2024; y <= 2035; y++){
    const mOff = (y - curYear) * 12;
    const bal = y < 2025
      ? balanceMonthsAgo(p.mortgageBalance, rate, MORTGAGE_PAYMENT, Math.abs(mOff))
      : mOff <= 0
        ? balanceMonthsAgo(p.mortgageBalance, rate, MORTGAGE_PAYMENT, Math.abs(mOff))
        : balanceAfterMonths(p.mortgageBalance, rate, MORTGAGE_PAYMENT, 0, mOff);
    const val = appreciation ? p.value * Math.pow(1.02, y - curYear) : p.value;
    chartRows.push({ year:y, value:Math.round(val), mortgage:Math.round(bal), equity:Math.round(val - bal) });
  }

  /* amortisation table: now → +10y */
  const amortRows = [];
  for (let i = 0; i <= 10; i++){
    const bal = balanceAfterMonths(p.mortgageBalance, rate, MORTGAGE_PAYMENT, 0, i*12);
    const val = appreciation ? p.value * Math.pow(1.02, i) : p.value;
    amortRows.push({ year:curYear+i, bal, eq:val-bal, ltv: val > 0 ? bal/val*100 : 0 });
  }

  /* overpay vs invest */
  const baseline = amortize(p.mortgageBalance, rate, MORTGAGE_PAYMENT, 0);
  const boosted  = amortize(p.mortgageBalance, rate, MORTGAGE_PAYMENT, extra);
  let cmp = null;
  if (baseline && boosted && extra > 0){
    const interestSaved = baseline.interestTotal - boosted.interestTotal;
    const monthsShaved = baseline.months - boosted.months;
    const i = 0.05/12, n = baseline.months;
    const fv = extra * ((Math.pow(1+i, n) - 1) / i);
    const contributed = extra * n;
    const investGain = fv - contributed;
    cmp = { interestSaved, monthsShaved, investGain, fv, contributed,
      payoffNew: addMonths(TODAY, boosted.months), payoffOld: addMonths(TODAY, baseline.months),
      bal10: balanceAfterMonths(p.mortgageBalance, rate, MORTGAGE_PAYMENT, extra, 120),
      investWins: investGain > interestSaved };
  }

  return (
    <div className="stack">
      <div className="grid2">
        <div className="card">
          <h2>🏠 Orchislaan 5-1, Arnhem</h2>
          <div className="kv"><span className="k">Estimated value <span className="dim">(Funda waardecheck)</span></span>
            <span className="v"><NumInput value={p.value} step={1000} width={110} onChange={v => setProp({ value:v })}/></span></div>
          <div className="kv"><span className="k">Size</span><span className="v">{p.size} m²</span></div>
          <div className="kv"><span className="k">Value per m²</span><span className="v">{fmt0(perM2)}/m²</span></div>
          <div className="kv"><span className="k">NHG mortgage</span><span className="v green">Yes</span></div>
          <label className="row mt small" style={{cursor:'pointer', gap:8}}>
            <input type="checkbox" checked={appreciation} onChange={e => setProp({ appreciation: e.target.checked })} style={{width:16, height:16}}/>
            Assume 2% annual appreciation
          </label>
        </div>

        <div className="card">
          <h2>Mortgage</h2>
          <div className="kv"><span className="k">Outstanding balance</span>
            <span className="v"><NumInput value={p.mortgageBalance} step={0.01} width={125} onChange={v => setProp({ mortgageBalance:v })}/></span></div>
          <div className="kv"><span className="k">Reference</span><span className="v">ING hypotheek N 107-569089</span></div>
          <div className="kv"><span className="k">Monthly payment</span><span className="v">{fmt(MORTGAGE_PAYMENT)}</span></div>
          <div className="kv"><span className="k">Passeerdatum</span><span className="v">16 december 2024</span></div>
          <div className="kv"><span className="k">Interest rate</span>
            <span className="v"><NumInput value={rate} step={0.05} width={75} suffix="%" onChange={v => setProp({ interestRate:v })}/></span></div>
        </div>
      </div>

      <div className="grid3">
        <div className="card"><h3>Current equity</h3><div className="metric green">{fmt0(equity)}</div></div>
        <div className="card">
          <h3>Loan-to-value</h3><div className="metric">{pct1(ltv)}</div>
          <div style={{height:8, background:'var(--bg)', borderRadius:6, marginTop:10, overflow:'hidden'}}>
            <div style={{height:'100%', width:Math.min(100, 100-ltv)+'%', background:'var(--green)', borderRadius:6}}></div>
          </div>
          <div className="sub">Green bar = equity share, grows as LTV falls</div>
        </div>
        <div className="card"><h3>Equity share</h3><div className="metric">{pct1(100-ltv)}</div></div>
      </div>

      <div className="card">
        <h2>Equity growth 2024–2035</h2>
        <div style={{width:'100%', height:290}}>
          <ResponsiveContainer>
            <AreaChart data={chartRows} margin={{top:8, right:8, left:8, bottom:0}}>
              <CartesianGrid stroke="#334155" strokeDasharray="3 3"/>
              <XAxis dataKey="year" tick={{fill:'#94a3b8', fontSize:12}}/>
              <YAxis tick={{fill:'#94a3b8', fontSize:12}} tickFormatter={v => '€' + Math.round(v/1000) + 'k'} width={58} domain={[0, 'auto']}/>
              <Tooltip formatter={(v,n) => [fmt0(v), n]}/>
              <Area type="monotone" dataKey="value" name="Property value" stroke="#a78bfa" fill="#a78bfa" fillOpacity={0.15} strokeWidth={2}/>
              <Area type="monotone" dataKey="mortgage" name="Mortgage balance" stroke="#f87171" fill="#f87171" fillOpacity={0.18} strokeWidth={2}/>
              <Area type="monotone" dataKey="equity" name="Equity" stroke="#4ade80" fillOpacity={0} strokeWidth={2} strokeDasharray="5 3"/>
              <Legend wrapperStyle={{fontSize:12}}/>
            </AreaChart>
          </ResponsiveContainer>
        </div>
      </div>

      <div className="card">
        <h2>Amortisation projection</h2>
        <table>
          <thead><tr><th>Year</th><th className="r">Approx balance</th><th className="r">Equity</th><th className="r">LTV</th></tr></thead>
          <tbody>
            {amortRows.map(r => (
              <tr key={r.year}>
                <td style={{fontWeight:600}}>{r.year}</td>
                <td className="r num">{fmt0(r.bal)}</td>
                <td className="r num green">{fmt0(r.eq)}</td>
                <td className="r num">{pct1(r.ltv)}</td>

function monthsBetween(d1, d2){
  const a = new Date(d1), b = new Date(d2);
  return Math.max(1, (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth()));
}

function HistoryTab({ data, setData }){
  const fileRef = useRef(null);
  const snaps = [...(data.snapshots||[])].sort((a,b) => a.date.localeCompare(b.date));

  const sumCat = c => data.assets.filter(a => a.category === c).reduce((s,a) => s + a.value, 0);
  const debt = data.liabilities.reduce((s,l) => s + l.value, 0);
  const liquid = sumCat('stocks') + sumCat('crypto') + sumCat('savings');
  const savings = sumCat('savings');
  const propEq = sumCat('property') - debt;
  const netWorth = liquid + propEq;

  const takeSnapshot = () => {
    const month = ISO(TODAY).slice(0,7);
    const entry = { date: ISO(TODAY), liquidNW: Math.round(liquid*100)/100,
      savings: Math.round(savings*100)/100, propertyEquity: Math.round(propEq*100)/100,
      netWorth: Math.round(netWorth*100)/100, mortgage: data.property.mortgageBalance,
      monthlyInvest: data.fireParams.monthlyContribution };
    const next = snaps.filter(s => s.date.slice(0,7) !== month).concat([entry])
                      .sort((a,b) => a.date.localeCompare(b.date));
    setData({ ...data, snapshots: next });
  };
  const delSnap = date => setData({ ...data, snapshots: snaps.filter(s => s.date !== date) });
  const editSnap = (date, k, v) => setData({ ...data,
    snapshots: snaps.map(s => s.date === date ? { ...s, [k]: v } : s) });

  /* chart rows + expected trajectory (5% net + contributions) */
  const rows = [];
  snaps.forEach((s, i) => {
    let expected;
    if (i === 0) expected = s.liquidNW;
    else {
      const m = monthsBetween(snaps[i-1].date, s.date);
      let e = rows[i-1].expected;
      for (let k = 0; k < m; k++) e = e*(1 + 0.05/12) + (s.monthlyInvest || data.fireParams.monthlyContribution);
      expected = e;
    }
    rows.push({
      month: s.date.slice(0,7),
      liquid: s.liquidNW,
      savings: s.savings || 0,
      invested: s.liquidNW - (s.savings || 0),
      prop: s.propertyEquity,
      expected: Math.round(expected),
      delta: i > 0 ? Math.round((s.liquidNW - snaps[i-1].liquidNW)*100)/100 : null,
    });
  });
  const deltas = rows.filter(r => r.delta !== null);
  const refExpected = data.fireParams.monthlyContribution + liquid * 0.05/12;

  /* stats */
  let stats = null;
  if (snaps.length >= 2){
    const last3 = deltas.slice(-3);
    const avg3 = last3.reduce((s,r) => s + r.delta, 0) / last3.length;
    const first = snaps[0], last = snaps[snaps.length-1];
    const span = monthsBetween(first.date, last.date);
    const twelveAgoIdx = snaps.findIndex(s => monthsBetween(s.date, last.date) <= 12);
    const baseFor12 = snaps[Math.max(0, twelveAgoIdx)] || first;
    const growth12 = last.liquidNW - baseFor12.liquidNW;
    const best = deltas.reduce((a,b) => b.delta > a.delta ? b : a);
    const worst = deltas.reduce((a,b) => b.delta < a.delta ? b : a);
    const cagr = first.liquidNW > 0 ? (Math.pow(last.liquidNW/first.liquidNW, 12/span) - 1) * 100 : 0;
    return renderHistory({ snaps, rows, deltas, refExpected, takeSnapshot, delSnap, editSnap,
      fileRef, data, setData,
      stats: { avg3, growth12, span, best, worst, cagr } });
  }
  return renderHistory({ snaps, rows, deltas, refExpected, takeSnapshot, delSnap, editSnap, fileRef, data, setData, stats });
}

function doBackup(data){
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'fintrack-backup-' + ISO(TODAY) + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ============================ CSV import machinery ============================ */
function djb2(str){ let h = 5381; for (let i = 0; i < str.length; i++) h = (((h << 5) + h) + str.charCodeAt(i)) >>> 0; return h.toString(16); }

function lev(a, b){
  a = a || ''; b = b || '';
  if (Math.abs(a.length - b.length) > 4) return 99;
  const m = [];
  for (let i = 0; i <= a.length; i++) m[i] = [i];
  for (let j = 1; j <= b.length; j++) m[0][j] = j;
  for (let i = 1; i <= a.length; i++)
    for (let j = 1; j <= b.length; j++)
      m[i][j] = Math.min(m[i-1][j] + 1, m[i][j-1] + 1, m[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return m[a.length][b.length];
}

/* Dutch decimal commas + thousand-separator dots: "1.234,56" -> 1234.56. Plain "12.50" also accepted. */
function parseDutchAmount(s){
  if (s === null || s === undefined) return NaN;
  s = String(s).trim().replace(/[€\s]/g, '');
  if (s === '') return NaN;
  if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
  else s = s.replace(/,/g, '');
  return parseFloat(s);
}

/* Accepts YYYYMMDD, DD-MM-YYYY, YYYY-MM-DD -> ISO */
function parseINGDate(s){
  s = String(s || '').trim();
  let m;
  if ((m = s.match(/^(\d{4})(\d{2})(\d{2})$/)))     return m[1] + '-' + m[2] + '-' + m[3];
  if ((m = s.match(/^(\d{2})-(\d{2})-(\d{4})$/)))   return m[3] + '-' + m[2] + '-' + m[1];
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/)))   return s;
  return null;
}

/* Quote-aware CSV state machine. Separator: ';' first (ING Puntkommagescheiden), fallback ','. */
function parseCSV(text){
  text = String(text || '').replace(/^\uFEFF/, '');
  const nl = text.indexOf('\n');
  const first = nl >= 0 ? text.slice(0, nl) : text;
  const sep = first.split(';').length > 1 ? ';' : ',';
  const rows = []; let cur = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (inQ){
      if (ch === '"'){ if (text[i+1] === '"'){ field += '"'; i++; } else inQ = false; }
      else field += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === sep){ cur.push(field); field = ''; }
      else if (ch === '\n' || ch === '\r'){
        if (ch === '\r' && text[i+1] === '\n') i++;
        cur.push(field); field = '';
        if (cur.length > 1 || cur[0] !== '') rows.push(cur);
        cur = [];
      }
      else field += ch;
    }
  }
  if (field !== '' || cur.length){ cur.push(field); if (cur.length > 1 || cur[0] !== '') rows.push(cur); }
  return { rows, sep };
}

/* Case-insensitive, whitespace-tolerant header lookup: 'Naam / Omschrijving' === 'naam/omschrijving' */
const normKey = k => String(k || '').toLowerCase().replace(/\s+/g, '');
function fieldGetter(header){
  const idx = {};
  header.forEach((h, i) => { idx[normKey(h)] = i; });
  return (row, aliases) => {
    for (const a of aliases){ if (idx[a] !== undefined) return String(row[idx[a]] || '').trim(); }
    return '';
  };
}

/* UTF-8 first; older ING exports are Windows-1252 */
function readFileSmart(file){
  return file.arrayBuffer().then(buf => {
    try { return new TextDecoder('utf-8', { fatal:true }).decode(buf); }
    catch(e){ return new TextDecoder('windows-1252').decode(buf); }
  });
}

/* Merchant fingerprint: lowercase, strip BETALINGSKENMERK, IBANs, dates, long transaction ids */
function fingerprint(desc){
  return String(desc || '').toLowerCase()
    .replace(/betalingskenmerk[^,\n]*/g, '')
    .replace(/\b[a-z]{2}\d{2}[a-z]{4}\d{6,}\b/g, '')
    .replace(/\b\d{2}[-\/]\d{2}[-\/]\d{2,4}\b/g, '')
    .replace(/\b\d{6,}\b/g, '')
    .replace(/[^a-z0-9& ]+/g, ' ')
    .replace(/\s+/g, ' ').trim().slice(0, 60);
}

/* Apple Pay / Tikkie / iDEAL bury the merchant in Mededelingen */
function extractMerchant(name, mede){
  const all = (name || '') + ' ' + (mede || '');
  if (/apple\s?pay/i.test(all)){
    const m = (mede || '').match(/betaling aan\s+([^,\n]+)/i);
    if (m) return m[1].trim();
    const seg = (mede || '').split(',')[0].replace(/apple\s?pay/ig, '').trim();
    if (seg) return seg;
  }
  if (/tikkie/i.test(all)){
    const m = (mede || '').match(/(?:naam|van|aan):?\s*([^,\n]+)/i);
    if (m) return 'Tikkie · ' + m[1].trim();
  }
  if (/ideal/i.test(all) && mede){
    const m = mede.match(/(?:betaling aan|naam):?\s*([^,\n]+)/i);
    if (m) return m[1].trim();
  }
  return name || '(geen omschrijving)';
}

/* Seed keyword rules — fallback only, mapped to ING category ids */
const SEED_RULES = {
  'boodschappen':     ['albert heijn','jumbo','lidl','aldi','dirk','plus ','coop','picnic','hema','action'],
  'restaurants-bars': ['restaurant','cafe','café','bar ','hop','mcdonald','kfc','burger','pizza','thuisbezorgd','uber eats','domino'],
  'transport':        ['shell','bp ','esso','tango','tinq','total','ns ','gvb','ret ','htm','uber','bolt','ov-chipkaart'],
  'vrije-tijd':       ['spotify','netflix','disney','hbo','pathe','pathé','bioscoop','concertgebouw','ticketmaster'],
  'gezondheid':       ['apotheek','huisarts','tandarts','kruidvat','etos','douglas','rituals'],
  'winkelen':         ['bol.com','amazon','zalando','aliexpress','coolblue','mediamarkt','ikea'],
  'inkomsten':        ['salaris','vmi holland','embla medical'],
};

/* Priority: 1) ING's own category column  2) learned rules  3) seed keywords
   4) fuzzy suggestion  5) uncategorised */
function categorizeTx(tx, data){
  const trust = (data.settings || {}).trustING !== false;
  if (tx.ingCategoryName){
    const cat = (data.categories || []).find(c => c.name.toLowerCase() === tx.ingCategoryName.toLowerCase());
    if (cat){
      tx.categoryId = cat.id; tx.source = 'ing';
      tx.status = trust ? 'auto' : 'suggested';
      return tx;
    }
  }
  const fp = tx.fingerprint;
  const lr = (data.learnedRules || []).find(r => r.pattern && (fp.includes(r.pattern) || r.pattern.includes(fp)));
  if (lr){ tx.categoryId = lr.categoryId; tx.source = 'learned'; tx.status = 'auto'; tx.ruleId = lr.pattern; return tx; }
  for (const cid of Object.keys(SEED_RULES)){
    if (SEED_RULES[cid].some(k => fp.includes(k))){
      tx.categoryId = cid; tx.source = 'seed'; tx.status = 'auto'; return tx;
    }
  }
  let best = null;
  (data.learnedRules || []).forEach(r => {
    const d = lev(fp.slice(0, (r.pattern || '').length + 3), r.pattern);
    if (d < 3 && (!best || d < best.d)) best = { r, d };
  });
  if (best){ tx.categoryId = best.r.categoryId; tx.source = 'learned'; tx.status = 'suggested'; tx.ruleId = best.r.pattern; return tx; }
  tx.categoryId = null; tx.status = 'none'; tx.source = null;
  return tx;
}

      name: f.name, account: suggestAccount(f.name), text,
      preview: parseCSV(text).rows.slice(0, 4),
    })))).then(parsed => setFiles(prev => [...prev, ...parsed]));
  };
  const setAccount = (i, acc) => setFiles(prev => prev.map((f, k) => k === i ? { ...f, account: acc } : f));
  const removeFile = i => setFiles(prev => prev.filter((_, k) => k !== i));

  const parseAll = () => {
    const knownHashes = new Set();
    (data.importHistory || []).forEach(h => (h.hashes || []).forEach(x => knownHashes.add(x)));
    (data.transactions || []).forEach(t => { if (t.hash) knownHashes.add(t.hash); });
    const ibanSet = new Set((data.knownIBANs || []).map(i => String(i.iban || '').replace(/\s+/g, '').toUpperCase()));

    const out = [], fails = []; let dups = 0; const batch = new Set();
    files.forEach(f => {
      const { rows } = parseCSV(f.text);
      if (rows.length < 2){ fails.push({ file:f.name, raw:'(empty or unreadable file)', reason:'No data rows', fix:{date:'',desc:'',amount:''}, account:f.account }); return; }
      const get = fieldGetter(rows[0]);
      rows.slice(1).forEach(row => {
        try {
          const dateRaw = get(row, ['datum','date']);
          const date = parseINGDate(dateRaw);
          if (!date) throw new Error('Unrecognised date "' + dateRaw + '"');
          const name = get(row, ['naam/omschrijving','naam','omschrijving','name/description','description']);
          const mede = get(row, ['mededelingen','notifications']);
          let amount = parseDutchAmount(get(row, ['bedrag(eur)','bedrag','amount(eur)','amount']));
          if (isNaN(amount)) throw new Error('Unrecognised amount');
          const afbij = get(row, ['afbij','af/bij','debit/credit']).toLowerCase();
          if (afbij === 'af') amount = -Math.abs(amount);
          else if (afbij === 'bij') amount = Math.abs(amount);
          const counter = get(row, ['tegenrekening','counterparty']).replace(/\s+/g, '').toUpperCase();
          const isTransfer = !!counter && ibanSet.has(counter);
          const merchant = extractMerchant(name, mede);
          const descRaw = (name + (mede ? ' · ' + mede : '')).slice(0, 140);
          const hash = djb2(date + '|' + amount.toFixed(2) + '|' + normKey(name));
          if (knownHashes.has(hash) || batch.has(hash)){ dups++; return; }
          batch.add(hash);
          const tx = { tid: uid(), date, amount, account: f.account,
            descClean: merchant, descRaw, customDesc: null,
            fingerprint: fingerprint(merchant), hash, isTransfer,
            ingCategoryName: get(row, ['categorie','category']) || null,
            categoryId: null, status: 'none', source: null, ruleId: null };
          if (!isTransfer) categorizeTx(tx, data);
          tx.engineCategoryId = tx.categoryId;
          out.push(tx);
        } catch(err){
          fails.push({ file: f.name, raw: row.join(' ; ').slice(0, 160), reason: err.message,
            fix: { date:'', desc:'', amount:'' }, account: f.account });
        }
      });
    });
    out.sort((a, b) => b.date.localeCompare(a.date));
    setTxs(out); setFailures(fails); setDupCount(dups);
    setStage('review'); setActiveIdx(0);
  };

  /* review helpers */
  const visible = txs.filter(t =>
    filterCat === 'all' ? true :
    filterCat === 'none' ? (!t.isTransfer && !t.categoryId) :
    filterCat === 'transfer' ? t.isTransfer :
    t.categoryId === filterCat);

  const setCat = (tid, cid) => setTxs(prev => prev.map(t =>
    t.tid === tid ? { ...t, categoryId: cid || null, status: cid ? 'auto' : 'none' } : t));

  const matchCount = tx => txs.filter(t => !t.isTransfer && t.fingerprint === tx.fingerprint).length;
  const applyMatching = tx => {
    if (!tx.categoryId) return;
    setTxs(prev => prev.map(t => (!t.isTransfer && t.fingerprint === tx.fingerprint)
      ? { ...t, categoryId: tx.categoryId, status: 'auto' } : t));
  };

  const toggleSel = tid => setSelected(p => ({ ...p, [tid]: !p[tid] }));
  const allVisSelected = visible.length > 0 && visible.every(t => selected[t.tid]);
  const toggleAll = () => {
    const next = {};
    if (!allVisSelected) visible.forEach(t => { next[t.tid] = true; });
    setSelected(next);
  };
  const applyBulk = () => {
    if (!bulkCat) return;
    setTxs(prev => prev.map(t => selected[t.tid] && !t.isTransfer
      ? { ...t, categoryId: bulkCat, status: 'auto' } : t));
    setSelected({});
  };

  const commitDesc = tid => {
    setTxs(prev => prev.map(t => t.tid === tid ? { ...t, customDesc: descDraft || null } : t));
    setEditingDesc(null);
  };

  useEffect(() => {
    if (stage !== 'review') return;
    const h = e => {
      const tag = (e.target.tagName || '').toUpperCase();
      if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
      if (e.key === 'ArrowDown'){ e.preventDefault(); setActiveIdx(i => Math.min(visible.length - 1, i + 1)); }
      else if (e.key === 'ArrowUp'){ e.preventDefault(); setActiveIdx(i => Math.max(0, i - 1)); }
      else if (/^[1-9]$/.test(e.key)){
        const c = hotkeys[parseInt(e.key, 10) - 1];
        const t = visible[activeIdx];
        if (c && t && !t.isTransfer) setCat(t.tid, c.id);
      }
      else if (e.key === 'Escape') onClose();
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  });

  const total = txs.length;
  const done = txs.filter(t => t.isTransfer || t.categoryId).length;
  const needs = total - done;

  const commit = fillOther => {
    const rules = (data.learnedRules || []).map(r => ({ ...r }));
    let newRules = 0;
    const upsert = (pattern, categoryId) => {
      if (!pattern) return;
      const ex = rules.find(r => r.pattern === pattern);
      if (ex){
        if (ex.categoryId !== categoryId){ ex.categoryId = categoryId; ex.confidence = 1; }
        else ex.confidence = (ex.confidence || 1) + 1;
        ex.lastSeen = ISO(TODAY);
      } else { rules.push({ pattern, categoryId, confidence:1, hitCount:0, lastSeen:ISO(TODAY), source:'user-override' }); newRules++; }
    };
    const final = txs.map(t => ({ ...t,
      categoryId: t.isTransfer ? 'transfer' : (t.categoryId || (fillOther ? 'overig' : t.categoryId)) }));
    final.forEach(t => {
      if (t.isTransfer || !t.categoryId) return;
      if (t.engineCategoryId !== t.categoryId) upsert(t.fingerprint, t.categoryId);
      else if (t.source === 'learned' && t.ruleId){
        const r = rules.find(x => x.pattern === t.ruleId);
        if (r){ r.hitCount = (r.hitCount || 0) + 1; r.confidence = (r.confidence || 1) + 1; }
      }
    });
    const txRecords = final.map(t => ({
      id: uid(), date: t.date,
      description: t.customDesc || (cleanOn ? t.descClean : t.descRaw),
      raw: t.descRaw, amount: t.amount, account: t.account,
      categoryId: t.categoryId, source: t.source || 'manual-review',
      hash: t.hash, isTransfer: t.isTransfer, ing: !!t.ingCategoryName,
    }));
    /* reconciliation vs ING's own tags, expenses in this batch */
    let recon = null;
    const ingRows = final.filter(t => t.ingCategoryName && !t.isTransfer && t.amount < 0);
    if (ingRows.length){
      const ing = {}, app = {};
      ingRows.forEach(t => {
        const cat = (data.categories || []).find(c => c.name.toLowerCase() === t.ingCategoryName.toLowerCase());
        const ingKey = cat ? cat.name : t.ingCategoryName;
        ing[ingKey] = (ing[ingKey] || 0) + t.amount;
        const appKey = catOf(data, t.categoryId).name;
        app[appKey] = (app[appKey] || 0) + t.amount;
      });
      const keys = [...new Set([...Object.keys(ing), ...Object.keys(app)])];
      recon = keys.map(k => ({ name:k, ing: ing[k] || 0, app: app[k] || 0,
        match: Math.abs((ing[k] || 0) - (app[k] || 0)) < 0.005 }));
    }
    const fmap = { ...(data.fileAccountMap || {}) };
    files.forEach(f => { fmap[f.name.replace(/\d+/g, '#')] = f.account; });
    const accounts = [...new Set(files.map(f => f.account))];
    const histEntry = { id: uid(), date: ISO(TODAY), filenames: files.map(f => f.name),
      accounts, txCount: txRecords.length, hashes: txRecords.map(t => t.hash) };
    onCommit({ txRecords, rules, histEntry, fmap, recon,
      toastMsg: 'Imported ' + txRecords.length + ' transactions across ' + accounts.length +
        ' account' + (accounts.length > 1 ? 's' : '') + '. Skipped ' + dupCount +
        ' duplicates. Learned ' + newRules + ' new rule' + (newRules === 1 ? '' : 's') + '.' });
  };

  const setFailFix = (idx, k, v) => setFailures(prev => prev.map((f, i) => i === idx ? { ...f, fix: { ...f.fix, [k]: v } } : f));
  const fixFailure = idx => {
    const f = failures[idx];
    const amount = parseDutchAmount(f.fix.amount);
    const date = parseINGDate(f.fix.date);
    if (!date || isNaN(amount)) { alert('Need a valid date (DD-MM-YYYY) and amount.'); return; }
    const merchant = f.fix.desc || 'Onbekend';
    const tx = { tid: uid(), date, amount, account: f.account || 'sven',
      descClean: merchant, descRaw: f.raw, customDesc: null,
      fingerprint: fingerprint(merchant),
      hash: djb2(date + '|' + amount.toFixed(2) + '|' + normKey(merchant)),
      isTransfer: false, ingCategoryName: null, categoryId: null, status: 'none', source: null, ruleId: null };
    categorizeTx(tx, data);
    tx.engineCategoryId = tx.categoryId;
    setTxs(p => [tx, ...p]);
    setFailures(p => p.filter((_, i) => i !== idx));
  };

  const statusCls = t => t.isTransfer ? 'tx-transfer'
    : t.status === 'none' ? 'tx-none'
    : t.status === 'suggested' ? 'tx-sug' : 'tx-auto';

  return (
    <div className="modal-back" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal">
        <div className="spread mb">
          <h2 style={{margin:0}}>📤 Import ING CSV {stage === 'review' && <span className="muted small">— review before committing</span>}</h2>
          <button className="btn" onClick={onClose}>✕ Close</button>
        </div>

        {stage === 'intake' && (
          <div className="stack">
            <div className="card" style={{background:'var(--bg)', borderStyle:'dashed', textAlign:'center', padding:'28px 16px'}}>
              <div className="mb">Drop in one or more ING CSV exports — personal, Charlotte's, and joint can go in together.</div>
              <button className="btn btn-blue" onClick={() => fileRef.current && fileRef.current.click()}>Choose CSV files…</button>
              <input ref={fileRef} type="file" accept=".csv,text/csv" multiple style={{display:'none'}}
                onChange={e => { addFiles(e.target.files); e.target.value = ''; }}/>
            </div>
            {files.map((f, i) => (
              <div key={i} className="card" style={{background:'var(--bg)'}}>
                <div className="spread mb" style={{flexWrap:'wrap', gap:8}}>
                  <span style={{fontWeight:700}}>📄 {f.name}</span>
                  <span className="row" style={{gap:8}}>
                    <label className="row small muted" style={{gap:6}}>Account:
                      <select value={f.account} onChange={e => setAccount(i, e.target.value)}>
                        <option value="sven">Sven</option>
                        <option value="charlotte">Charlotte</option>
                        <option value="joint">Joint</option>
                      </select>
                    </label>
                    <button className="btn-icon" title="Remove file" onClick={() => removeFile(i)}>✖️</button>
                  </span>
                </div>
                <div className="review-wrap" style={{maxHeight:120}}>
                  <table>
                    <tbody>
                      {f.preview.map((r, ri) => (
                        <tr key={ri}>{r.slice(0, 7).map((cell, ci) =>
                          <td key={ci} className={ri === 0 ? 'dim small' : 'small'} style={{whiteSpace:'nowrap', maxWidth:140, overflow:'hidden', textOverflow:'ellipsis'}}>{cell}</td>)}</tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            ))}
            {files.length > 0 &&
              <button className="btn btn-blue" style={{alignSelf:'flex-end'}} onClick={parseAll}>
                Parse {files.length} file{files.length > 1 ? 's' : ''} →
              </button>}
          </div>
        )}

        {stage === 'review' && (
          <div className="stack">
            <div className="legend">
              <span><b>↑/↓</b> navigate</span>
              {hotkeys.map((c, i) => <span key={c.id}><b>{i+1}</b> {c.icon} {c.name.split(' ')[0]}</span>)}
            </div>

            <div className="row" style={{gap:10, flexWrap:'wrap'}}>
              <label className="row small muted" style={{gap:6}}>Filter:
                <select value={filterCat} onChange={e => { setFilterCat(e.target.value); setActiveIdx(0); }}>
                  <option value="all">All ({txs.length})</option>
                  <option value="none">Uncategorised ({txs.filter(t => !t.isTransfer && !t.categoryId).length})</option>
                  <option value="transfer">Transfers ({txs.filter(t => t.isTransfer).length})</option>
                  {cats.map(c => <option key={c.id} value={c.id}>{c.name} ({txs.filter(t => t.categoryId === c.id).length})</option>)}
                </select>
              </label>
              <label className="row small muted" style={{gap:6, cursor:'pointer'}}>
                <input type="checkbox" checked={cleanOn} onChange={e => setCleanOn(e.target.checked)} style={{width:14, height:14}}/>
                Clean descriptions
              </label>
              <span className="row small" style={{gap:6, marginLeft:'auto'}}>
                <select value={bulkCat} onChange={e => setBulkCat(e.target.value)}>
                  <option value="">Bulk category…</option>
                  {cats.map(c => <option key={c.id} value={c.id}>{c.icon} {c.name}</option>)}
                </select>
                <button className="btn" onClick={applyBulk} disabled={!bulkCat || !Object.values(selected).some(Boolean)}>
                  Apply to {Object.values(selected).filter(Boolean).length} selected
                </button>
              </span>
            </div>

            <div className="review-wrap">
              <table>
                <thead>
                  <tr>
                    <th style={{width:28}}><input type="checkbox" checked={allVisSelected} onChange={toggleAll} style={{width:14, height:14}}/></th>
                    <th>Date</th><th>Description</th><th className="r">Amount</th><th>Account</th><th>Category</th><th></th>
                  </tr>
                </thead>
                <tbody>
                  {visible.map((t, i) => (
                    <tr key={t.tid} className={'tx-row ' + statusCls(t) + (i === activeIdx ? ' tx-active' : '')}
                        onClick={() => setActiveIdx(i)}>
                      <td><input type="checkbox" checked={!!selected[t.tid]} onChange={() => toggleSel(t.tid)} style={{width:14, height:14}}/></td>
                      <td className="num dim small" style={{whiteSpace:'nowrap'}}>{t.date}</td>
                      <td style={{maxWidth:260}}>
                        {editingDesc === t.tid
                          ? <input autoFocus value={descDraft} style={{width:'95%'}}
                              onChange={e => setDescDraft(e.target.value)}
                              onBlur={() => commitDesc(t.tid)}
                              onKeyDown={e => { if (e.key === 'Enter') commitDesc(t.tid); }}/>
                          : <span style={{fontWeight:600, cursor:'text'}} title="Click to rename"
                              onClick={() => { setEditingDesc(t.tid); setDescDraft(t.customDesc || t.descClean); }}>
                              {t.customDesc || (cleanOn ? t.descClean : t.descRaw)}
                            </span>}
                        {t.source === 'ing' && <span className="badge badge-blue" style={{marginLeft:6}}>ING</span>}
                      </td>
                      <td className={'r num ' + (t.amount < 0 ? '' : 'green')}>{fmt(t.amount)}</td>
                      <td className="dim small">{ACCOUNT_LABELS[t.account] || t.account}</td>
                      <td>
                        {t.isTransfer
                          ? <span className="dim small">🔁 Transfer (own accounts)</span>
                          : <select value={t.categoryId || ''} onChange={e => setCat(t.tid, e.target.value)}>
                              <option value="">— choose —</option>
                              {cats.map(c => <option key={c.id} value={c.id}>{c.icon} {c.name}</option>)}
                            </select>}
                      </td>
                      <td className="r">
                        {!t.isTransfer && t.categoryId && matchCount(t) > 1 &&
                          <button className="btn-icon" title={'Apply this category to all ' + matchCount(t) + ' matching "' + t.descClean + '"'}
                            onClick={() => applyMatching(t)}>⇶</button>}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            {failures.length > 0 && (
              <div className="card" style={{background:'var(--bg)', borderColor:'rgba(248,113,113,.4)'}}>
                <h3 className="red">Could not parse ({failures.length})</h3>
                {failures.map((f, i) => (
                  <div key={i} className="mb">
                    <div className="small muted num">{f.file}: {f.raw}</div>
                    <div className="small red mb">{f.reason}</div>
                    <div className="row" style={{gap:6, flexWrap:'wrap'}}>
                      <input placeholder="DD-MM-YYYY" style={{width:110}} value={f.fix.date} onChange={e => setFailFix(i, 'date', e.target.value)}/>
                      <input placeholder="Description" style={{width:160}} value={f.fix.desc} onChange={e => setFailFix(i, 'desc', e.target.value)}/>
                      <input placeholder="-12,50" style={{width:90}} value={f.fix.amount} onChange={e => setFailFix(i, 'amount', e.target.value)}/>
                      <button className="btn" onClick={() => fixFailure(i)}>Fix &amp; add</button>
                      <button className="btn" onClick={() => setFailures(p => p.filter((_, k) => k !== i))}>Skip</button>
                    </div>
                  </div>
                ))}
              </div>
            )}

            <div className="spread" style={{flexWrap:'wrap', gap:10}}>
              <span className="small muted">
                {total} transactions · <span className="green">{done} categorised</span>
                {needs > 0 && <span> · <span className="red">{needs} need review</span></span>}
                {dupCount > 0 && <span> · {dupCount} duplicates skipped</span>}
              </span>
              <span className="row" style={{gap:8}}>
                <button className="btn" onClick={onClose}>Cancel</button>
                {needs > 0 && <button className="btn" onClick={() => commit(true)}>Import remaining as Overig</button>}
                <button className="btn btn-blue" disabled={needs > 0} onClick={() => commit(false)}
                  title={needs > 0 ? 'Categorise all rows first, or use "Import remaining as Overig"' : ''}>
                  Import {total} transactions
                </button>
              </span>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================ TAB 7 — Settings ============================ */
const EMOJI_OPTIONS = ['🏠','🛒','🍽','🚗','💊','🎮','🛍','💼','✈️','⚡','📺','💪','🎁','💰'];
const COLOR_OPTIONS = ['#4ade80','#fb923c','#a78bfa','#f87171','#fbbf24','#3b82f6','#ec4899','#94a3b8'];
const slugify = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

function SettingsTab({ data, setData }){
  const [pop, setPop] = useState(null);                 // { id, kind:'icon'|'color' }
  const dragIdx = useRef(null);
  const [dragOver, setDragOver] = useState(null);
  const [catForm, setCatForm] = useState({ name:'', icon:'🛒', color:'#4ade80', type:'variable' });
  const [costForm, setCostForm] = useState({ name:'', amount:'', categoryId:'vaste-lasten', frequency:'monthly', note:'' });
  const [instForm, setInstForm] = useState({ name:'', type:'broker' });
  const [ibanForm, setIbanForm] = useState({ iban:'', owner:'', type:'personal' });
  const [importMode, setImportMode] = useState('replace');
  const importRef = useRef(null);

  const cats = budgetCats(data);
  const catHits = id =>
    (data.transactions || []).filter(t => t.categoryId === id).length +
    (data.fixedCosts || []).filter(c => c.categoryId === id).length;
  const instUsage = id => data.assets.filter(a => a.institutionId === id).length;

  /* ---- Section A: categories ---- */
  const setCats = next => setData({ ...data, categories: next });
  const updCat = (id, patch) => setCats(data.categories.map(c => c.id === id ? { ...c, ...patch } : c));
  const delCat = id => setCats(data.categories.filter(c => c.id !== id).map((c,i) => ({ ...c, order:i })));
  const addCat = () => {
    if (!catForm.name) return;
    let id = slugify(catForm.name) || uid();
    if (data.categories.some(c => c.id === id)) id = id + '-' + uid().slice(0,4);
    setCats([...data.categories, { ...catForm, id, order: data.categories.length }]);
    setCatForm({ name:'', icon:'🛒', color:'#4ade80', type:'variable' });
  };
  const onDrop = idx => {
    const from = dragIdx.current;
    dragIdx.current = null; setDragOver(null);
    if (from === null || from === idx) return;
    const arr = [...cats];
    const moved = arr.splice(from, 1)[0];
    arr.splice(idx, 0, moved);
    setCats(arr.map((c, i) => ({ ...c, order: i })));
  };

  /* ---- Section B: fixed costs ---- */
  const updCost = (id, patch) => setData({ ...data,
    fixedCosts: data.fixedCosts.map(c => c.id === id ? { ...c, ...patch } : c) });
  const delCost = id => setData({ ...data, fixedCosts: data.fixedCosts.filter(c => c.id !== id) });
  const addCost = () => {
    if (!costForm.name || !costForm.amount) return;
    setData({ ...data, fixedCosts:[...data.fixedCosts,
      { id: uid(), name: costForm.name, amount: parseFloat(costForm.amount) || 0,
        categoryId: costForm.categoryId, frequency: costForm.frequency, note: costForm.note, group: null }] });
    setCostForm({ name:'', amount:'', categoryId:'vaste-lasten', frequency:'monthly', note:'' });
  };
  const totalFixedEq = (data.fixedCosts || []).reduce((s,c) => s + monthlyEq(c), 0);

  /* ---- Section C: institutions ---- */
  const updInst = (id, patch) => setData({ ...data,
    institutions: data.institutions.map(i => i.id === id ? { ...i, ...patch } : i) });
  const delInst = id => setData({ ...data, institutions: data.institutions.filter(i => i.id !== id) });
  const addInst = () => {
    if (!instForm.name) return;
    let id = slugify(instForm.name) || uid();
    if (data.institutions.some(i => i.id === id)) id = id + '-' + uid().slice(0,4);
    setData({ ...data, institutions:[...data.institutions, { id, name:instForm.name, type:instForm.type }] });
    setInstForm({ name:'', type:'broker' });
  };

  /* ---- Section D: IBANs ---- */
  const updIban = (id, patch) => setData({ ...data,
    knownIBANs: data.knownIBANs.map(i => i.id === id ? { ...i, ...patch } : i) });
  const delIban = id => setData({ ...data, knownIBANs: data.knownIBANs.filter(i => i.id !== id) });
  const addIban = () => {
    if (!ibanForm.iban) return;
    setData({ ...data, knownIBANs:[...data.knownIBANs, { id: uid(), ...ibanForm }] });
    setIbanForm({ iban:'', owner:'', type:'personal' });
  };

  /* ---- Section E: data management ---- */
  const doReset = () => {
    const v = prompt('This wipes EVERYTHING and restores the defaults. Type RESET to confirm:');
    if (v === 'RESET'){
      const fresh = migrate(seedData());
      setData(fresh);
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh)); } catch(e){}
    }
  };
  const onImportFile = e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || typeof parsed !== 'object'){ alert('Not a valid fintrack JSON file.'); return; }
        let merged;
        if (importMode === 'replace'){
          if (!confirm('Replace ALL current data with this file?')) return;
          merged = migrate({ ...seedData(), ...parsed });
        } else {
          merged = { ...data };
          const arrayKeys = { transactions:'id', snapshots:'date', assets:'id', liabilities:'id',
            fixedCosts:'id', learnedRules:'pattern', knownIBANs:'id', importHistory:'id',
            categories:'id', institutions:'id' };
          Object.keys(arrayKeys).forEach(k => {
            if (Array.isArray(parsed[k])){
              const key = arrayKeys[k];
              const map = new Map((merged[k] || []).map(x => [x[key], x]));
              parsed[k].forEach(x => map.set(x[key], x));
              merged[k] = [...map.values()];
            }
          });
          ['fireParams','income','property','settings','fileAccountMap'].forEach(k => {
            if (parsed[k]) merged[k] = { ...merged[k], ...parsed[k] };
          });
          merged = migrate(merged);
          if (!confirm('Merge this file into your current data (' + Object.keys(parsed).length + ' sections)?')) return;
        }
        setData(merged);
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(merged)); } catch(err){}
      } catch(err){ alert('Could not read file: ' + err.message); }
      e.target.value = '';
    };
    reader.readAsText(file);
  };

  return (
    <div className="stack">
      {/* ---------- A — Categories ---------- */}
      <div className="card">
        <h2>A · Categories</h2>
        <div className="sub mb">Single source of truth for Budget and CSV import. Drag ≡ to reorder; everything references categories by id, so renaming is always safe.</div>
        {cats.map((c, idx) => (
          <div key={c.id} className={'cat-row drag-row' + (dragOver === idx ? ' drag-over' : '')}
            draggable onDragStart={() => { dragIdx.current = idx; }}
            onDragOver={e => { e.preventDefault(); setDragOver(idx); }}
            onDragLeave={() => setDragOver(null)}
            onDrop={() => onDrop(idx)}>
            <span className="dim" title="Drag to reorder">≡</span>
            <button className="btn-icon" style={{fontSize:16}} title="Change icon"
              onClick={() => setPop(pop && pop.id === c.id && pop.kind === 'icon' ? null : { id:c.id, kind:'icon' })}>{c.icon}</button>

            <input value={c.name} onChange={e => updCat(c.id, { name: e.target.value })}
