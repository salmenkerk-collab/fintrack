<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finance">
<meta name="theme-color" content="#F3EDE2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<title>Sven Finance</title>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"
  onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js'"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"
  onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js'"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.28.4/babel.min.js"
  onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@babel/standalone@7.28.4/babel.min.js'"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"
  onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js'"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.min.js"
  onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.min.js'"></script>

<!-- Early error capture: turns a future blank screen into a readable message -->
<script>
  window.__bootErr = null;
  window.addEventListener('error', function(e){
    if (!window.__bootErr) window.__bootErr = (e && e.message ? e.message : 'Unknown error') +
      (e && e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '');
  }, true);
</script>

<style>
  :root{
    --bg:#F3EDE2; --surface:#ECE4D6; --surface2:#D9CFBD;
    --text:#211F1B; --muted:#5C574C; --dim:#8A8475;
    --blue:#4A211C; --green:#5E6B3B; --orange:#9A6A34;
    --purple:#988C6C; --red:#A2492B; --yellow:#B98A2E;
    --gold:#988C6C; --rule:rgba(33,31,27,.14); --rule2:rgba(33,31,27,.08);
    --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{ -webkit-text-size-adjust:100%; }
  body{
    background:var(--bg); background-image:radial-gradient(1100px 620px at 82% -12%, rgba(255,255,255,.5), transparent 60%); background-attachment:fixed; color:var(--text);
    font-family:'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; letter-spacing:.1px;
    font-size:15px; line-height:1.45;
    padding-top:env(safe-area-inset-top);
  }
  .app{ max-width:1180px; margin:0 auto; padding:16px 16px 64px; }
  main{ animation: tabIn .45s ease both; }
  @keyframes tabIn{from{opacity:0}to{opacity:1}}
  main .card{ animation: secRise .5s ease both; }
  .grid2 > .card:nth-child(2){ animation-delay:.07s }
  .grid3 > .card:nth-child(2){ animation-delay:.07s } .grid3 > .card:nth-child(3){ animation-delay:.14s }
  .stack > .card:nth-child(2){ animation-delay:.06s } .stack > .card:nth-child(3){ animation-delay:.12s }
  .stack > .card:nth-child(4){ animation-delay:.18s } .stack > .card:nth-child(5){ animation-delay:.24s } .stack > .card:nth-child(6){ animation-delay:.30s }
  @keyframes secRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
  @keyframes drawStroke{from{stroke-dashoffset:92}to{stroke-dashoffset:0}}
  @keyframes riseUp{from{transform:translateY(40px)}to{transform:translateY(0)}}
  @keyframes rayPulse{0%,100%{opacity:1}50%{opacity:.5}}
  /* v37 — motion polish */
  @keyframes tabIn2{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  main{ animation: tabIn2 .4s cubic-bezier(.25,.8,.3,1) both; }
  @keyframes growW{ from{ width:0 } }
  @keyframes sparkIn{ from{ stroke-dashoffset:1200 } to{ stroke-dashoffset:0 } }
  .growbar{ animation: growW .9s cubic-bezier(.25,.8,.3,1) both .12s; }
  html{ scroll-behavior:smooth; }
  .tab{ transition: color .2s ease, border-bottom-color .28s ease; }
  .btn{ transition: border-color .18s ease, background .18s ease, transform .12s ease; }
  .btn:active{ transform: scale(.96); }
  .btn-icon{ transition: opacity .15s ease, transform .12s ease; }
  .btn-icon:active{ transform: scale(.9); }
  /* dashboard — instrument panel */
  .dash{ display:grid; gap:10px; }
  .dash-status{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    font-family:var(--mono); font-size:9.5px; letter-spacing:1.6px; text-transform:uppercase; color:var(--dim);
    background:var(--surface); border:1px solid var(--rule); border-radius:11px; padding:8px 13px; }
  .dstat{ display:flex; gap:15px; flex-wrap:wrap; }
  .panel{ background:var(--surface); border:1px solid var(--rule); border-radius:14px; padding:13px 15px; min-width:0; }
  .panel-h{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:9px; }
  .panel-n{ font-family:var(--mono); font-size:9.5px; letter-spacing:2px; text-transform:uppercase; color:var(--gold); }
  .panel-n .pslash{ color:var(--dim); opacity:.6; }
  .panel-m{ font-family:var(--mono); font-size:9.5px; letter-spacing:1.4px; text-transform:uppercase; color:var(--dim); white-space:nowrap; }
  .mono{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
  .mono-lab{ font-family:var(--mono); font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--dim); }
  .hero-num{ font-family:'Fraunces',Georgia,serif; font-size:33px; font-weight:500; letter-spacing:-1px;
    font-variant-numeric:tabular-nums; line-height:1; }
  .greet{ font-family:'Fraunces',Georgia,serif; font-size:23px; font-weight:500; letter-spacing:-.4px; line-height:1.15; }
  .greet i{ font-style:italic; }
  .statbox{ background:var(--bg); border-radius:9px; padding:7px 10px; min-width:0; }
  .statbox .sv{ font-family:'Fraunces',Georgia,serif; font-size:16px; font-weight:500; font-variant-numeric:tabular-nums; }
  .allocrow{ display:flex; align-items:center; gap:8px; margin-bottom:7px; font-size:12px; }
  .allocbar{ flex:1; height:7px; border-radius:4px; background:var(--surface2); overflow:hidden; min-width:20px; }
  .msrow{ display:flex; align-items:center; gap:9px; padding:3.5px 0; font-size:12.5px; color:var(--dim); }
  .msrow.on{ color:var(--text); }
  .msrow.next{ color:var(--text); }
  .msbox{ width:13px; height:13px; border-radius:3px; border:1px solid var(--rule); flex-shrink:0;
    display:inline-flex; align-items:center; justify-content:center; font-size:9px; line-height:1; }
  .msbox.on{ background:var(--green); border-color:var(--green); color:var(--bg); }
  .msbox.next{ border-color:var(--yellow); color:var(--yellow); }
  .bento{ display:grid; gap:10px; grid-template-columns:minmax(0,1fr); }
  @media(min-width:920px){
    .bento{ grid-template-columns:213px minmax(0,1fr) 322px;
      grid-template-areas:
        "op      session  vitals"
        "alloc   month    vitals"
        "alloc   nudges   miles"
        "impulse impulse  miles"; }
    .b-op{grid-area:op} .b-session{grid-area:session} .b-vitals{grid-area:vitals}
    .b-alloc{grid-area:alloc} .b-month{grid-area:month} .b-nudges{grid-area:nudges}
    .b-impulse{grid-area:impulse} .b-miles{grid-area:miles}
  }
  /* dashboard tiles */
  .dash-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(238px,1fr)); gap:12px; }
  .tile{ cursor:pointer; transition: transform .16s cubic-bezier(.25,.8,.3,1), border-color .16s ease; }
  .tile:hover{ transform:translateY(-2px); border-color:var(--gold); }
  .tile:active{ transform:translateY(0) scale(.995); }
  .tile:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }
  .tile-go{ color:var(--dim); font-size:13px; transition:transform .16s ease, color .16s ease; }
  .tile:hover .tile-go{ transform:translateX(3px); color:var(--blue); }
  .nudge{ display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:none;
    border:none; border-bottom:1px dashed var(--rule); padding:7px 2px; cursor:pointer;
    font:inherit; font-size:13px; color:var(--text); transition:color .15s ease; }
  .nudge:last-child{ border-bottom:none; }
  .nudge:hover{ color:var(--blue); }
  .nudge .n-ico{ color:var(--yellow); flex-shrink:0; }
  .nudge .n-go{ margin-left:auto; color:var(--dim); font-size:11px; white-space:nowrap; }
  /* milestone ladder */
  .milestones{ display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:3px 14px; margin-top:6px; }
  .ms{ display:flex; align-items:baseline; gap:8px; padding:4px 9px; border-radius:7px; color:var(--dim); border:1px dashed transparent; }
  .ms .ms-ico{ width:14px; text-align:center; flex-shrink:0; }
  .ms .ms-lab{ flex:1; font-size:12.5px; }
  .ms .ms-amt{ font-size:12px; }
  .ms.hit{ color:var(--text); }
  .ms.hit .ms-ico{ color:var(--green); }
  .ms.nxt{ border-color:var(--yellow); color:var(--text); background:rgba(185,138,46,.07); }
  .ms.nxt .ms-ico{ color:var(--yellow); }
  .ms-togo{ font-size:11px; color:var(--yellow); white-space:nowrap; }

  /* ---------- header ---------- */
  .header{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:6px 0 14px; }
  .brand{ display:flex; align-items:center; gap:11px; }
  .brand .wm{ font-family:'Fraunces',Georgia,serif; font-weight:500; font-size:20px; letter-spacing:-.3px; line-height:1.05; }
  .brand .wm .fin{ color:var(--blue); font-style:italic; }
  .brand .tag{ font-size:9.5px; letter-spacing:2px; text-transform:uppercase; color:var(--gold); font-weight:600; margin-top:2px; }
  .lens{ display:inline-flex; gap:2px; background:rgba(33,31,27,.05); border:1px solid var(--rule); border-radius:12px; padding:3px; }
  .lens-btn{ border:none; background:none; font:inherit; font-size:12.5px; color:var(--muted); padding:6px 13px; border-radius:9px; cursor:pointer; transition:.15s; }
  .lens-btn:hover{ color:var(--ink); }
  .lens-btn.on{ background:var(--blue); color:var(--bg); font-weight:600; }
  .liquid-pill{
    display:flex; flex-direction:column; align-items:flex-end; gap:1px;
    background:var(--surface); border:1px solid var(--surface2);
    border-radius:12px; padding:7px 13px; white-space:nowrap;
  }
  .liquid-pill .lp-main{ font-size:14px; font-weight:700; }
  .liquid-pill .lp-main b{ color:var(--text); font-variant-numeric:tabular-nums; }
  .liquid-pill .lp-label{ color:var(--muted); font-weight:500; font-size:11px; text-transform:uppercase; letter-spacing:.6px; }
  .liquid-pill .lp-delta{ font-size:12px; font-weight:600; font-variant-numeric:tabular-nums; }
  .delta-pos{ color:var(--green); } .delta-neg{ color:var(--red); } .delta-zero{ color:var(--muted); }

  /* ---------- tabs ---------- */
  .tabs{ display:flex; gap:4px; border-bottom:1px solid var(--surface2); overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    background:none; border:none; color:var(--muted); cursor:pointer;
    font:inherit; font-weight:600; font-size:14px; padding:10px 13px;
    border-bottom:2px solid transparent; white-space:nowrap;
  }
  .tab:hover{ color:var(--text); }
  .tab.active{ color:var(--blue); border-bottom-color:var(--gold); }
  .tab.settings{ margin-left:auto; font-size:16px; }
  .tab:focus-visible{ outline:2px solid var(--blue); outline-offset:-2px; border-radius:6px; }

  /* ---------- layout & cards ---------- */
  main{ padding-top:18px; }
  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .grid2{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .layout-side{ display:grid; grid-template-columns:1fr 300px; gap:14px; align-items:start; }
  .card{
    background:var(--surface); border:1px solid var(--rule);
    border-radius:16px; padding:16px;
  }
  .card h3{ font-size:10.5px; font-weight:600; color:var(--gold); text-transform:uppercase; letter-spacing:2px; margin-bottom:8px; }
  .card h2{ font-family:'Fraunces',Georgia,serif; font-size:18px; font-weight:500; letter-spacing:-.3px; margin-bottom:10px; }
  .metric{ font-family:'Fraunces',Georgia,serif; font-size:28px; font-weight:500; letter-spacing:-.5px; font-variant-numeric:tabular-nums; }
  .metric.primary{ font-size:40px; letter-spacing:-1px; }
  .metric.red{ color:var(--red); }
  .sub{ color:var(--muted); font-size:12.5px; margin-top:3px; }
  .pills-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .pill{
    background:var(--surface); border:1px solid var(--surface2); border-radius:999px;
    padding:7px 14px; font-size:13px; font-weight:600; display:flex; gap:7px; align-items:center;
  }
  .pill .k{ color:var(--muted); font-weight:500; }
  .stack{ display:flex; flex-direction:column; gap:14px; }
  .row{ display:flex; align-items:center; gap:8px; }
  .spread{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .muted{ color:var(--muted); } .dim{ color:var(--dim); }
  .small{ font-size:12.5px; }
  .mt{ margin-top:14px; } .mb{ margin-bottom:10px; }
  .green{ color:var(--green); } .red{ color:var(--red); } .yellow{ color:var(--yellow); }
  .orangeTxt{ color:var(--orange); } .blueTxt{ color:var(--blue); }
  .num{ font-variant-numeric:tabular-nums; }

  /* ---------- tables ---------- */
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th{ text-align:left; color:var(--gold); font-size:11px; text-transform:uppercase; letter-spacing:1.6px; font-weight:600; padding:7px 8px; border-bottom:1px solid var(--surface2); }
  td{ padding:8px; border-bottom:1px solid rgba(33,31,27,.12); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  td.r, th.r{ text-align:right; }

  /* ---------- category accordion ---------- */
  .cat-header{
    display:flex; align-items:center; gap:10px; width:100%;
    background:var(--surface2); border:none; color:var(--text); cursor:pointer;
    font:inherit; font-weight:700; font-size:14px;
    border-radius:10px; padding:10px 12px; margin-top:8px;
  }
  .cat-header .chev{ color:var(--muted); font-size:11px; width:12px; }
  .cat-header .cat-total{ margin-left:auto; font-variant-numeric:tabular-nums; }
  .cat-header .cat-pct{ color:var(--muted); font-weight:500; font-size:12.5px; width:52px; text-align:right; }
  .cat-dot{ width:9px; height:9px; border-radius:50%; flex:none; }

  /* ---------- buttons & inputs ---------- */
  .btn{
    background:var(--surface2); color:var(--text); border:1px solid var(--surface2);
    border-radius:9px; padding:7px 13px; font:inherit; font-size:13px; font-weight:600; cursor:pointer;
  }
  .btn:hover{ border-color:var(--dim); }
  .btn-blue{ background:var(--blue); border-color:var(--blue); color:#fff; }
  .btn-blue:hover{ background:#4A211C; }
  .btn-green{ background:rgba(74,222,128,.15); border-color:rgba(74,222,128,.4); color:var(--green); }
  .btn-icon{ background:none; border:none; cursor:pointer; font-size:14px; padding:3px 5px; border-radius:6px; opacity:.75; }
  .btn-icon:hover{ opacity:1; background:var(--surface2); }
  .btn:focus-visible,.btn-icon:focus-visible,input:focus-visible,select:focus-visible{ outline:2px solid var(--blue); outline-offset:1px; }
  input, select{
    background:var(--bg); border:1px solid var(--surface2); color:var(--text);
    border-radius:8px; padding:7px 10px; font:inherit; font-size:13.5px;
  }
  input[type=number]{ -moz-appearance:textfield; }
  input[type=range]{ width:100%; accent-color:var(--blue); padding:0; border:none; background:none; }
  label.fld{ display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); font-weight:600; }
  .form-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; align-items:end; }

  .stale-y{ color:var(--yellow); } .stale-o{ color:var(--orange); }
  .badge{ display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; }
  .badge-blue{ background:rgba(59,130,246,.18); color:var(--blue); }
  .badge-green{ background:rgba(74,222,128,.15); color:var(--green); }
  .badge-red{ background:rgba(248,113,113,.15); color:var(--red); }

  /* ---------- FIRE scenario cards ---------- */
  .scen{ border-top:3px solid var(--surface2); }
  .scen.pess{ border-top-color:var(--red); }
  .scen.base{ border-top-color:var(--blue); }
  .scen.opt{ border-top-color:var(--green); }
  .scen .big{ font-size:24px; font-weight:800; }
  .kv{ display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px dashed rgba(51,65,85,.6); font-size:13px; }
  .kv:last-child{ border-bottom:none; }
  .kv .k{ color:var(--muted); }
  .kv .v{ font-weight:700; font-variant-numeric:tabular-nums; }

  .placeholder{
    border:1px dashed var(--surface2); border-radius:14px; padding:48px 20px;
    text-align:center; color:var(--muted);
  }
  .placeholder .ph-icon{ font-size:30px; margin-bottom:10px; }

  .donut-wrap{ position:relative; width:100%; height:230px; }
  .donut-center{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; pointer-events:none;
  }
  .donut-center .dc-val{ font-size:19px; font-weight:800; font-variant-numeric:tabular-nums; }
  .donut-center .dc-lbl{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; }

  .recharts-default-tooltip{ background:var(--surface) !important; border:1px solid var(--surface2) !important; border-radius:10px; }
  .recharts-tooltip-label, .recharts-tooltip-item{ color:var(--text) !important; font-size:12.5px !important; }

  /* ---- modal / CSV import ---- */
  .modal-back{position:fixed;inset:0;background:rgba(33,31,27,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto;}
  .modal{background:var(--surface);border:1px solid var(--surface2);border-radius:16px;max-width:1080px;width:100%;padding:18px;margin-bottom:40px;}
  .review-wrap{max-height:50vh;overflow:auto;border:1px solid var(--surface2);border-radius:10px;}
  .review-wrap table{font-size:12.5px;}
  .review-wrap th{position:sticky;top:0;background:var(--surface);z-index:2;}
  .tx-row td{border-bottom:1px solid rgba(51,65,85,.4);}
  .tx-auto{box-shadow:inset 3px 0 0 var(--green);}
  .tx-sug{box-shadow:inset 3px 0 0 var(--yellow);}
  .tx-none{box-shadow:inset 3px 0 0 var(--red);}
  .tx-transfer{opacity:.55;}
  .tx-active{background:rgba(74,33,28,.10);}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--dim);border-radius:10px;padding:10px 16px;font-size:13px;z-index:60;box-shadow:0 8px 30px rgba(33,31,27,.16);max-width:90vw;}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px 12px;}
  .legend b{color:var(--text);background:var(--surface2);border-radius:4px;padding:0 5px;margin-right:2px;}
  /* ---- settings ---- */
  .cat-row{position:relative;display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid rgba(33,31,27,.12);}
  .drag-row{cursor:grab;}
  .drag-over{outline:2px dashed var(--blue);outline-offset:-2px;border-radius:8px;}
  .swatch{width:18px;height:18px;border-radius:6px;border:1px solid rgba(33,31,27,.18);cursor:pointer;flex:none;}
  .pop{position:absolute;z-index:30;background:var(--surface);border:1px solid var(--surface2);border-radius:10px;padding:8px;display:grid;grid-template-columns:repeat(7,28px);gap:4px;box-shadow:0 10px 30px rgba(33,31,27,.18);}
  .pop button{font-size:16px;background:none;border:none;cursor:pointer;border-radius:6px;padding:2px;line-height:1;}
  .pop button:hover{background:var(--surface2);}
  @media (max-width:900px){
    .layout-side{ grid-template-columns:1fr; }
  }
  @media (max-width:640px){
    .grid3, .grid2{ grid-template-columns:1fr; }
    .metric.primary{ font-size:32px; }
    .liquid-pill{ padding:6px 10px; }
    .header{ flex-wrap:wrap; }
  }

function CountUp({ value, format, dur }){
  const [disp, setDisp] = useState(typeof value === 'number' && isFinite(value) ? 0 : value);
  const fromRef = useRef(0);
  const mountedRef = useRef(false);
  useEffect(() => {
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const start = mountedRef.current ? fromRef.current : 0;
    mountedRef.current = true;
    if (reduce || typeof value !== 'number' || !isFinite(value)) { fromRef.current = value; setDisp(value); return; }
    const to = value, d = dur || 1000;
    let t0 = null, raf;
    const step = (ts) => {
      if (t0 === null) t0 = ts;
      const pr = Math.min((ts - t0) / d, 1);
      const e = 1 - Math.pow(1 - pr, 3);
      const cur = start + (to - start) * e;
      fromRef.current = cur; setDisp(cur);
      if (pr < 1) raf = requestAnimationFrame(step);
      else { fromRef.current = to; setDisp(to); }
    };
    raf = requestAnimationFrame(step);
    return () => { if (raf) cancelAnimationFrame(raf); };
  }, [value]);
  return format ? format(disp) : Math.round(disp);
}

/* Migration: guarantees every structural list exists, moves legacy data onto the
   id-referenced model. Safe to run repeatedly. */
function migrate(d){
  d.transactions  = d.transactions || [];
  d.categories    = (d.categories && d.categories.length)     ? d.categories     : SEED_CATEGORIES.map(c => ({ ...c }));
  d.institutions  = (d.institutions && d.institutions.length) ? d.institutions   : SEED_INSTITUTIONS.map(i => ({ ...i }));
  d.knownIBANs    = (d.knownIBANs && d.knownIBANs.length)     ? d.knownIBANs.map(i => i.id ? i : { ...i, id: uid() }) : SEED_IBANS.map(i => ({ ...i }));
  d.learnedRules  = d.learnedRules  || [];
  d.importHistory = d.importHistory || [];
  d.fileAccountMap = d.fileAccountMap || {};
  d.settings = Object.assign({ trustING: true }, d.settings || {});
  d.fixedCosts = (d.fixedCosts || []).map(c =>
    Object.assign({ categoryId:'vaste-lasten', frequency:'monthly', note:'' }, c));
  /* legacy v1/v2 budgetVariable entries (category by NAME) → id-referenced transactions */
  if (d.budgetVariable){
    const NAME_MAP = { 'Groceries':'boodschappen', 'Dining & bars':'restaurants-bars',
      'Personal care':'gezondheid', 'Clothing':'winkelen', 'Gifts':'overig',
      'Travel':'vrije-tijd', 'Other':'overig' };
    Object.keys(d.budgetVariable).forEach(mk => (d.budgetVariable[mk] || []).forEach(v => {
      d.transactions.push({ id: v.id || uid(), date: mk + '-15', description: v.name,
        amount: -Math.abs(v.amount || 0), account:'sven',
        categoryId: NAME_MAP[v.category] || 'overig', source:'manual', hash:null, isTransfer:false });
    }));
    delete d.budgetVariable;
  }
  d.assets = (d.assets || []).map(a => {
    if (a.category === 'crypto')
      return { ...a, coinId: a.coinId || coinIdFromName(a.name),
        quantity: (a.quantity != null ? a.quantity : null),
        priceEUR: (a.priceEUR != null ? a.priceEUR : null),
        costBasis: (a.costBasis != null ? a.costBasis : null) };
    if (a.category === 'stocks') return { ...a, isin: a.isin || null,
        costBasis: (a.costBasis != null ? a.costBasis : null) };
    return a;
  });
  if (d.fireParams && !Array.isArray(d.fireParams.contributionSchedule)) d.fireParams.contributionSchedule = [];
  if (d.fireParams){
    const fpd = d.fireParams;
    if (fpd.aowEnabled === undefined) fpd.aowEnabled = false;
    if (fpd.charlotteContribution === undefined) fpd.charlotteContribution = 0;
    if (!Array.isArray(d.portfolioTx)) d.portfolioTx = [];
    if (fpd.aowAge === undefined) fpd.aowAge = 70;
    if (fpd.aowAnnualGross === undefined) fpd.aowAnnualGross = 13673;
    if (fpd.aowBuildPct === undefined) fpd.aowBuildPct = 100;
    if (fpd.householdSpend === undefined) fpd.householdSpend = 0;
    if (fpd.rentalHaircut === undefined) fpd.rentalHaircut = 25;
    if (fpd.pension === undefined) fpd.pension = { enabled:true, startAge:70, accrualFactor:60,
      sven:{ safeNet:1110, employerNet:2045 }, charlotte:{ safeNet:799, employerNet:2996 } };
    if (fpd.pension && d.settings && !d.settings._pensionAge70V1){ fpd.pension.startAge = 70; d.settings._pensionAge70V1 = true; }
  }
  if (!Array.isArray(d.goals)) d.goals = [{ id:'goal-car-2028', name:'New car', icon:'🚗', target:25000, targetDate:'2028-06', saved:0, monthly:0 }];
  /* one-time retro: tag already-imported broker funding (Flatex / DEGIRO / Trade Republic)
     and own-savings moves as transfers, so they drop out of spending & recurring-cost views */
  if (!d.settings._xfRetroV1){
    const XF = /\b(flatex|degiro|trade ?republic)\b/i, SAV = /spaarrekening/i;
    (d.transactions || []).forEach(t => {
      const blob = (t.description || '') + ' ' + (t.raw || '');
      if (!t.isTransfer && (XF.test(blob) || SAV.test(blob))){ t.isTransfer = true; t.categoryId = 'transfer'; }
    });
    d.settings._xfRetroV1 = true;
  }
  // household owner tags — default everything to Sven so existing data is unchanged
  (d.assets || []).forEach(a => { if (!a.owner) a.owner = 'sven'; });
  (d.liabilities || []).forEach(l => { if (!l.owner) l.owner = 'sven'; });
  (d.goals || []).forEach(g => { if (!g.owner) g.owner = 'sven'; });
  if (d.income && d.income.charlotte === undefined) d.income.charlotte = 0;
  if (!d.household) d.household = {};
  if (d.household.jointContribEach == null) d.household.jointContribEach = ((d.income || {}).jointContribution) || 1000;
  if (d.household.sharedSplit == null) d.household.sharedSplit = 50;
  if (d.fixedCosts && d.settings && !d.settings._sharedCostsV1){
    const sharedIds = { hyp:1, vve:1, gas:1, ozb:1, wat:1, afv:1, odii:1 };
    d.fixedCosts.forEach(c => { if (sharedIds[c.id]) c.shared = true; });
    const gas = d.fixedCosts.find(c => c.id === 'gas'); if (gas && gas.amount < 150) gas.amount = 150;
    if (!d.fixedCosts.some(c => c.id === 'groc-shared'))
      d.fixedCosts.push({ id:'groc-shared', group:'Housing', name:'Shared groceries', amount:300, note:'From joint Revolut', shared:true });
    d.settings._sharedCostsV1 = true;
  }
  (d.fixedCosts || []).forEach(c => { if (!c.owner) c.owner = 'sven'; if (!c.currency) c.currency = 'EUR'; if (c.currency === 'GBP') c.amount = (c.fxAmount || 0) * ((d.fx && d.fx.GBP) || 1.17); });
  if (!d.fx) d.fx = { GBP: 1.17 };
  // keep EUR value of foreign-currency assets in sync with the stored rate
  (d.assets || []).forEach(a => { if (a.currency === 'GBP') a.value = (a.fxAmount || 0) * (d.fx.GBP || 1.17); });
  (d.liabilities || []).forEach(l => { if (!l.currency) l.currency = 'EUR'; if (l.currency === 'GBP') l.value = (l.fxAmount || 0) * (d.fx.GBP || 1.17); });
  // one-time: give Charlotte her own London flat (GBP, rented) and remove any stray ownership of Orchislaan
  if (d.settings && !d.settings._charlotteHousingV1){
    if (Array.isArray(d.assets) && !d.assets.some(a => /balmoral/i.test(a.name || ''))){
      d.assets.push({ id:'asset-balmoral', name:'Balmoral Court, London', note:'Charlotte · rented out · GBP',
        value:409500, category:'property', institutionId:'balmoral', owner:'charlotte',
        currency:'GBP', fxAmount:350000, rentGBP:1994, lastUpdated: ISO(TODAY) });
      if (Array.isArray(d.liabilities) && !d.liabilities.some(l => l.linkedAssetId === 'asset-balmoral'))
        d.liabilities.push({ id:'liab-balmoral-mortgage', name:'Mortgage · Balmoral Court, London',
          value:163451.34, owner:'charlotte', currency:'GBP', fxAmount:139702, linkedAssetId:'asset-balmoral',
          monthlyPayment:471, interestRate:2.32, note:'', lastUpdated: ISO(TODAY) });
    }
    if (Array.isArray(d.institutions) && !d.institutions.some(i => i.id === 'balmoral'))
      d.institutions.push({ id:'balmoral', name:'Balmoral Court (London)', type:'other' });
    d.settings._charlotteHousingV1 = true;
  }
  return d;
}

function loadData(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw){
      const parsed = JSON.parse(raw);
      if (parsed && parsed.assets) return migrate({ ...seedData(), ...parsed });
    }
  } catch(e){ /* corrupted storage → reseed */ }
  return migrate(seedData());
}

function HeaderPill({ liquid, snapshots, lens }){
  const personal = !lens || lens === 'sven';
  const sorted = [...(snapshots||[])].sort((a,b) => a.date.localeCompare(b.date));
  const last = sorted[sorted.length-1];
  let delta = null;
  if (personal && last && last.liquidNW > 0){
    const d = liquid - last.liquidNW;
    delta = { d, p: d / last.liquidNW * 100 };
  }
  const cls = !delta ? 'delta-zero' : delta.d >= 0 ? 'delta-pos' : 'delta-neg';
  const arrow = !delta ? '' : delta.d >= 0 ? '▲' : '▼';
  return (
    <div className="liquid-pill" title="Stocks + crypto + savings. Delta vs last snapshot in History.">
      <span className="lp-label">Liquid NW</span>
      <span className="lp-main"><b><CountUp value={liquid} format={fmt0}/></b></span>
      <span className={'lp-delta ' + cls}>
        {!personal
          ? (OWNERS[lens] || '') + ' view'
          : (delta
              ? arrow + ' ' + (delta.d >= 0 ? '+' : '\u2212') + fmt0(Math.abs(delta.d)) + ' (' + (delta.d >= 0 ? '+' : '') + pct1(delta.p) + ')'
              : 'no snapshot yet')}
      </span>
    </div>
  );
}

  const [form, setForm] = useState({ name:'', note:'', value:'', category:'stocks', institutionId:'degiro', coinId:'', owner:'sven', currency:'EUR' });
  const [toast, setToast] = useState(null);
  const [pricing, setPricing] = useState(false);
  const [showDegiro, setShowDegiro] = useState(false);
  const toastT = useRef(null);
  const flash = m => { setToast(m); if (toastT.current) clearTimeout(toastT.current); toastT.current = setTimeout(() => setToast(null), 6500); };

  const assets = data.assets, liabs = data.liabilities;
  const vAssets = assets.filter(a => lensMatch(a.owner, lens));
  const vLiabs = liabs.filter(l => lensMatch(l.owner, lens));
  const sumCat = c => vAssets.filter(a => a.category === c).reduce((s,a) => s + a.value, 0);
  const gross = vAssets.reduce((s,a) => s + a.value, 0);
  const debt = vLiabs.reduce((s,l) => s + l.value, 0);
  const netWorth = gross - debt;
  const liquid = sumCat('stocks') + sumCat('crypto') + sumCat('savings');
  const propEquity = sumCat('property') - debt;
  const savingsRate = data.income.sven > 0 ? data.fireParams.monthlyContribution / data.income.sven * 100 : 0;

  const donutData = ASSET_CATS.map(c => ({ name:c.name, value:sumCat(c.id), fill:c.color }))
                              .filter(d => d.value > 0);

  /* crypto by coin */
  const coins = {};
  vAssets.filter(a => a.category === 'crypto').forEach(a => {
    const m = a.name.match(/\(([A-Z]+)\)/);
    const sym = m ? m[1] : a.name;
    coins[sym] = (coins[sym] || 0) + a.value;
  });
  const coinRows = Object.entries(coins).sort((a,b) => b[1]-a[1]);

  /* by institution */
  const instTotals = {};
  vAssets.forEach(a => { instTotals[a.institutionId] = (instTotals[a.institutionId] || 0) + a.value; });

  const save = next => setData({ ...data, assets: next });

  const startEdit = a => { setEditingId(a.id); setEdit({ ...a, value: a.currency === 'GBP' ? (a.fxAmount || 0) : a.value, quantity: a.quantity != null ? a.quantity : '' }); };
  const commitEdit = () => {
    save(assets.map(a => {
      if (a.id !== editingId) return a;
      let v = parseFloat(edit.value) || 0;
      let q = a.quantity, coinId = a.coinId, fxAmount = a.fxAmount;
      if (edit.category === 'crypto'){
        coinId = edit.coinId || coinIdFromName(edit.name);
        q = (edit.quantity === '' || edit.quantity == null) ? null : parseFloat(edit.quantity);
        if (q != null && !isNaN(q) && a.priceEUR) v = q * a.priceEUR;   // recompute from last price
      }
      if (edit.category !== 'crypto' && edit.currency === 'GBP'){
        fxAmount = parseFloat(edit.value) || 0;
        v = fxAmount * ((data.fx && data.fx.GBP) || 1.17);   // GBP entered -> EUR for totals
      }
      return { ...edit, value: v, quantity: q, coinId, fxAmount, lastUpdated: ISO(TODAY) };
    }));
    setEditingId(null);
  };
  const removeAsset = id => { if (confirm('Delete this asset?')) save(assets.filter(a => a.id !== id)); };
  const addAsset = () => {
    if (!form.name || !form.value) return;
    const native = parseFloat(form.value) || 0;
    const cur = form.currency || 'EUR';
    const base = { id:uid(), name:form.name, note:form.note,
      value: cur === 'GBP' ? native * ((data.fx && data.fx.GBP) || 1.17) : native,
      currency: cur, fxAmount: cur === 'GBP' ? native : null,
      category:form.category,
      institutionId:form.institutionId, owner:form.owner || 'sven', lastUpdated: ISO(TODAY) };
    if (form.category === 'crypto'){ base.coinId = form.coinId || coinIdFromName(form.name); base.quantity = null; base.priceEUR = null; }
    if (form.category === 'stocks'){ base.isin = null; }
    save([...assets, base]);
    setForm({ name:'', note:'', value:'', category:form.category, institutionId:form.institutionId, coinId:'', owner:form.owner, currency:form.currency });
    setAdding(false);
  };
  const setFxRate = v => {
    const rate = parseFloat(v) || 0;
    setData({ ...data, fx: { ...(data.fx || {}), GBP: rate },
      assets: assets.map(a => a.currency === 'GBP' ? { ...a, value: (a.fxAmount || 0) * rate } : a) });
  };
  const refreshFx = () => {
    fetch('https://api.frankfurter.app/latest?from=GBP&to=EUR')
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(j => {
        const rate = j && j.rates && j.rates.EUR;
        if (!rate) throw new Error('no rate in response');
        setData({ ...data, fx: { ...(data.fx || {}), GBP: rate },
          assets: assets.map(a => a.currency === 'GBP' ? { ...a, value: (a.fxAmount || 0) * rate } : a) });
        flash('GBP to EUR updated to ' + rate.toFixed(4) + ' \u00b7 ECB daily reference.');
      })
      .catch(e => flash('FX update failed: ' + e.message + ' \u2014 set the rate manually.'));
  };
  const refreshCrypto = () => {
    const cryptos = assets.filter(a => a.category === 'crypto');
    const ids = [...new Set(cryptos.map(a => a.coinId || coinIdFromName(a.name)).filter(Boolean))];
    if (!ids.length){ flash('No recognised coins to price. Set each coin in its edit row first.'); return; }
    setPricing(true);
    fetchCryptoPrices(ids).then(prices => {
      let priced = 0, boot = 0;
      const next = assets.map(a => {
        if (a.category !== 'crypto') return a;
        const cid = a.coinId || coinIdFromName(a.name);
        const px = (cid && prices[cid]) ? prices[cid].eur : null;
        if (!px) return a;
        let qty = a.quantity;
        if (qty == null || qty === '' || isNaN(qty)){ qty = a.value > 0 ? a.value / px : 0; boot++; }
        priced++;
        return { ...a, coinId: cid, quantity: qty, priceEUR: px, value: qty * px, lastUpdated: ISO(TODAY) };
      });
      setData({ ...data, assets: next });
      flash('Updated ' + priced + ' crypto position' + (priced === 1 ? '' : 's') +
        (boot ? ' · derived quantities for ' + boot + ' from current value' : '') + '.');
      setPricing(false);
    }).catch(err => { flash('Price fetch failed: ' + err.message + ' — values unchanged.'); setPricing(false); });
  };
  const updateLiab = (id, v) => {
    const tgt = liabs.find(l => l.id === id) || {};
    const isG = tgt.currency === 'GBP';
    const rate = (data.fx && data.fx.GBP) || 1.17;
    const patch = isG
      ? { fxAmount: parseFloat(v) || 0, value: (parseFloat(v) || 0) * rate, lastUpdated: ISO(TODAY) }
      : { value: v, lastUpdated: ISO(TODAY) };
    const next = { ...data, liabilities: liabs.map(l => l.id === id ? { ...l, ...patch } : l) };
    if (!isG && !tgt.linkedAssetId) next.property = { ...data.property, mortgageBalance: v };
    setData(next);
  };

  return (
    <div className="stack">
      {toast && <div className="toast">{toast}</div>}
      {showDegiro && <BrokerImportModal data={data} onClose={() => setShowDegiro(false)}
        onCommit={(nextAssets, msg) => { setData({ ...data, assets: nextAssets }); setShowDegiro(false); flash(msg); }}/>}
      <div className="grid3">
        <div className="card">
          <h3>Net worth</h3>
          <div className="metric primary"><CountUp value={netWorth} format={fmt0}/></div>
          <div className="sub">Gross assets − liabilities</div>
        </div>
        <div className="card">
          <h3>Gross assets</h3>
          <div className="metric"><CountUp value={gross} format={fmt0}/></div>
          <div className="sub">{assets.length} holdings across {Object.keys(instTotals).length} institutions</div>
        </div>
        <div className="card">
          <h3>Debt</h3>
          <div className="metric red"><CountUp value={debt} format={fmt0}/></div>
          <div className="sub">Hypotheek ING</div>
        </div>
      </div>

      <div className="pills-row" style={{marginTop:0}}>
        <span className="pill"><span className="k">Liquid</span> <span className="num">{fmt0(liquid)}</span></span>
        <span className="pill"><span className="k">Property equity</span> <span className="num">{fmt0(propEquity)}</span></span>
        <span className="pill"><span className="k">Savings rate</span> <span className="num green">{pct1(savingsRate)}</span></span>
      </div>

      <div className="layout-side">

          <div className="card">
            <h2>Asset allocation</h2>
            <div className="donut-wrap">
              <ResponsiveContainer>
                <PieChart>
                  <Pie animationDuration={900} animationEasing="ease-out" data={donutData} dataKey="value" nameKey="name"
                       innerRadius={62} outerRadius={96} paddingAngle={2} stroke="none">
                    {donutData.map((d,i) => <Cell key={i} fill={d.fill}/>)}
                  </Pie>
                  <Tooltip formatter={v => fmt0(v)} />
                </PieChart>
              </ResponsiveContainer>
              <div className="donut-center">
                <span className="dc-val">{fmt0(netWorth)}</span>
                <span className="dc-lbl">Net worth</span>
              </div>

              {donutData.map(d =>
                <span key={d.name} className="row small muted" style={{gap:6}}>

              <div className="row" style={{gap:8, flexWrap:'wrap'}}>
                <button className="btn" onClick={refreshCrypto} disabled={pricing} title="Fetch live EUR prices from CoinGecko">
                  {pricing ? '… pricing' : '↻ Refresh crypto'}</button>
                <button className="btn" onClick={() => setShowDegiro(true)} title="Update stock values from a DEGIRO portfolio or Trade Republic transaction export">📥 Import CSV</button>
                <button className="btn btn-blue" onClick={() => setAdding(!adding)}>{adding ? 'Close' : '+ Add asset'}</button>

                <label className="fld">Name
                  <input value={form.name} onChange={e => setForm({...form, name:e.target.value})} placeholder="e.g. Alphabet" /></label>
                <label className="fld">Broker / note
                  <input value={form.note} onChange={e => setForm({...form, note:e.target.value})} /></label>
                <label className="fld">Value ({form.currency === 'GBP' ? '\u00a3' : '\u20ac'})
                  <input type="number" value={form.value} onChange={e => setForm({...form, value:e.target.value})} />
                  {form.currency === 'GBP' && <span className="dim small">{'\u2248 ' + fmt((parseFloat(form.value) || 0) * ((data.fx && data.fx.GBP) || 1.17))}</span>}</label>
                <label className="fld">Category
                  <select value={form.category} onChange={e => setForm({...form, category:e.target.value})}>
                    {ASSET_CATS.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                  </select></label>
                <label className="fld">Institution
                  <select value={form.institutionId} onChange={e => setForm({...form, institutionId:e.target.value})}>
                    {data.institutions.map(i => <option key={i.id} value={i.id}>{i.name}</option>)}
                  </select></label>
                <label className="fld">Owner
                  <select value={form.owner || 'sven'} onChange={e => setForm({...form, owner:e.target.value})}>
                    {OWNER_OPTS.map(o => <option key={o[0]} value={o[0]}>{o[1]}</option>)}
                  </select></label>
                <label className="fld">Currency
                  <select value={form.currency || 'EUR'} onChange={e => setForm({...form, currency:e.target.value})}>
                    <option value="EUR">EUR €</option>
                    <option value="GBP">GBP £</option>
                  </select></label>
                {form.category === 'crypto' && (
                  <label className="fld">Coin (for live pricing)
                    <select value={form.coinId || ''} onChange={e => setForm({...form, coinId:e.target.value})}>
                      <option value="">— none —</option>
                      {COIN_LIST.map(t => <option key={t} value={COIN_IDS[t]}>{t}</option>)}
                    </select></label>
                )}
                <button className="btn btn-green" onClick={addAsset}>Add</button>
              </div>
            )}

            {assets.some(a => a.currency === 'GBP') && (
              <div className="row small muted" style={{gap:8, alignItems:'center', flexWrap:'wrap', margin:'2px 0 12px'}}>
                <span style={{fontWeight:600, color:'var(--ink)'}}>{'\u00a3 \u2192 \u20ac'}</span>
                <NumInput value={(data.fx && data.fx.GBP) || 1.17} step={0.01} width={84} onChange={setFxRate}/>
                <button className="btn" onClick={refreshFx}>{'\u21bb Live rate'}</button>
                <span className="dim">ECB daily · used for Charlotte's London housing</span>
              </div>
            )}
            {ASSET_CATS.map(cat => {
              const rows = vAssets.filter(a => a.category === cat.id);
              const total = rows.reduce((s,a) => s + a.value, 0);
              return (
                <div key={cat.id}>
                  <button className="cat-header" onClick={() => setOpen({...open, [cat.id]:!open[cat.id]})}>
                    <span className="chev">{open[cat.id] ? '▼' : '►'}</span>
                    <span className="cat-dot" style={{background:cat.color}}></span>
                    <span>{cat.icon} {cat.name}</span>
                    <span className="cat-total">{fmt0(total)}</span>
                    <span className="cat-pct">{gross ? pct1(total/gross*100) : '–'}</span>
                  </button>
                  {open[cat.id] && (
                    <table>
                      <tbody>
                        {rows.map(a => editingId === a.id ? (
                          edit.category === 'crypto' ? (
                            <tr key={a.id}>
                              <td><input style={{width:'95%'}} value={edit.name} onChange={e => setEdit({...edit, name:e.target.value})}/>
                                <select className="small" style={{marginTop:4, width:'95%'}} value={edit.owner || 'sven'} onChange={e => setEdit({...edit, owner:e.target.value})}>
                                  {OWNER_OPTS.map(o => <option key={o[0]} value={o[0]}>{o[1]}</option>)}
                                </select></td>
                              <td>
                                <span className="row" style={{gap:4}}>
                                  <select value={edit.coinId || ''} onChange={e => setEdit({...edit, coinId:e.target.value})} style={{maxWidth:84}}>
                                    <option value="">coin…</option>
                                    {COIN_LIST.map(t => <option key={t} value={COIN_IDS[t]}>{t}</option>)}
                                  </select>
                                  <input type="number" step="any" placeholder="qty" style={{width:84}}
                                    value={edit.quantity == null ? '' : edit.quantity}
                                    onChange={e => setEdit({...edit, quantity:e.target.value})}/>
                                </span>
                              </td>
                              <td className="r"><input type="number" style={{width:100}} value={edit.value} onChange={e => setEdit({...edit, value:e.target.value})}/></td>
                              <td className="r" style={{whiteSpace:'nowrap'}}>
                                <button className="btn-icon" title="Save" onClick={commitEdit}>✅</button>
                                <button className="btn-icon" title="Cancel" onClick={() => setEditingId(null)}>✖️</button>
                              </td>
                            </tr>
                          ) : (
                            <tr key={a.id}>
                              <td><input style={{width:'95%'}} value={edit.name} onChange={e => setEdit({...edit, name:e.target.value})}/>
                                <select className="small" style={{marginTop:4, width:'95%'}} value={edit.owner || 'sven'} onChange={e => setEdit({...edit, owner:e.target.value})}>
                                  {OWNER_OPTS.map(o => <option key={o[0]} value={o[0]}>{o[1]}</option>)}
                                </select>
                                <select className="small" style={{marginTop:4, width:'95%'}} value={edit.currency || 'EUR'} onChange={e => setEdit({...edit, currency:e.target.value})}>
                                  <option value="EUR">EUR</option>
                                  <option value="GBP">GBP £</option>
                                </select></td>
                              <td><input style={{width:'95%'}} value={edit.note} onChange={e => setEdit({...edit, note:e.target.value})}/></td>
                              <td className="r"><input type="number" style={{width:100}} value={edit.value} onChange={e => setEdit({...edit, value:e.target.value})}/></td>
                              <td className="r" style={{whiteSpace:'nowrap'}}>
                                <button className="btn-icon" title="Save" onClick={commitEdit}>✅</button>
                                <button className="btn-icon" title="Cancel" onClick={() => setEditingId(null)}>✖️</button>
                              </td>
                            </tr>
                          )
                        ) : (
                          <tr key={a.id}>
                            <td style={{fontWeight:600}}>
                              <span style={{display:'inline-flex', alignItems:'center'}}><HoldingIcon asset={a}/>{a.name}</span>
                            </td>
                            <td className="muted small">
                              {a.note}
                              {a.category === 'crypto' && a.quantity != null &&
                                <span> · {(+a.quantity).toLocaleString('nl-NL',{maximumFractionDigits:6})} {tickerFromName(a.name)}{a.priceEUR ? (' @ ' + fmt(a.priceEUR)) : ''}</span>}
                              <span style={{marginLeft:6}}>{relTime(a.lastUpdated)}</span>
                              {a.owner && a.owner !== 'sven' && <span className="dim" style={{marginLeft:6}}>· {OWNERS[a.owner]}</span>}
                            </td>
                            <td className="r num" style={{fontWeight:700}}>{a.currency === 'GBP'
                              ? <React.Fragment>{gbpfmt(a.fxAmount || 0)} <span className="dim small">{'\u00b7 ' + fmt(a.value)}</span></React.Fragment>
                              : fmt(a.value)}</td>
                            <td className="r" style={{whiteSpace:'nowrap'}}>
                              <button className="btn-icon" title="Edit" onClick={() => startEdit(a)}>✏️</button>
                              <button className="btn-icon" title="Delete" onClick={() => removeAsset(a.id)}>🗑</button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </div>
              );
            })}
          </div>

          <div className="card">
            <h2>Liabilities</h2>
            <table>
              <tbody>
                {vLiabs.map(l => (
                  <tr key={l.id}>
                    <td style={{fontWeight:600}}>{l.name}<div className="muted small">{l.note}
                      {l.owner && l.owner !== 'sven' && <span> · {OWNERS[l.owner]}</span>}
                      <span style={{marginLeft:6}}>{relTime(l.lastUpdated)}</span></div></td>
                    <td className="r">
                      <NumInput value={l.currency === 'GBP' ? (l.fxAmount || 0) : l.value} step={0.01} width={130} onChange={v => updateLiab(l.id, v)} />
                    </td>
                    <td className="r red num" style={{fontWeight:700}}>{l.currency === 'GBP'
                      ? <React.Fragment>{gbpfmt(l.fxAmount || 0)} <span className="dim small">{'· ' + fmt(l.value)}</span></React.Fragment>
                      : fmt(l.value)}</td>
                  </tr>
                ))}
                {vLiabs.length === 0 && <tr><td className="muted" colSpan={3}>No liabilities in this view.</td></tr>}
              </tbody>
            </table>
          </div>
        </div>

        <div className="stack">
          <div className="card">
            <h3>Crypto by coin</h3>
            <table>
              <tbody>
                {coinRows.map(([sym, v]) => (
                  <tr key={sym}>
                    <td style={{fontWeight:600}}>{sym}</td>
                    <td className="r num">{fmt(v)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="card">
            <h3>By institution</h3>
            <table>
              <tbody>
                {data.institutions.filter(i => instTotals[i.id]).map(i => (
                  <tr key={i.id}>
                    <td style={{fontWeight:600}}>{i.name}</td>
                    <td className="r num">{fmt0(instTotals[i.id])}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================ TAB 2 — FIRE ============================ */
function currentAge(birthYear){
  // birthday 16 Nov → before that date you are (year − birthYear − 1)
  const y = TODAY.getFullYear();
  const hadBirthday = (TODAY.getMonth() > 10) || (TODAY.getMonth() === 10 && TODAY.getDate() >= 16);
  return y - birthYear - (hadBirthday ? 0 : 1);
}

function box3Drag(p, fp){
  if (p <= fp.box3Exempt) return 0;
  return fp.box3FictitiousReturn/100 * fp.box3TaxRate/100 * ((p - fp.box3Exempt) / p) * 100; // %-points
}

/* Monthly contribution active at a given age: the base amount, stepped up by the schedule. */
function contribAtAge(fp, age){
  let m = Number(fp.monthlyContribution) || 0;
  const sched = (fp.contributionSchedule || []).slice().sort((a,b) => a.fromAge - b.fromAge);
  for (const s of sched){ if (age >= s.fromAge) m = Number(s.monthly) || 0; }
  return m;
}

/* Simulate one scenario. Returns trajectory rows + key milestones. */
function simulate(startNW, fp, grossPct, inflPct){
  const startYear = TODAY.getFullYear();
  const age0 = currentAge(fp.birthYear);
  const targetYear = startYear + (fp.targetAge - age0);
  const fireFull = fp.annualWithdrawal / (fp.swr/100);       // today's money, portfolio-only
  // AOW lowers the pot you need: its income offsets withdrawals from aowAge onward.
  // Credit today = capital-equivalent of that income (A / SWR), discounted from aowAge
  // back to the retirement year at the real (after-inflation) return.
  let aowCredit = 0;
  if (fp.aowEnabled){
    const A = (Number(fp.aowAnnualGross) || 0) * (Number(fp.aowBuildPct) || 0) / 100;
    const gapYears = Math.max(0, (Number(fp.aowAge) || 0) - fp.targetAge);
    const realReturn = Math.max(0.001, (grossPct - inflPct) / 100);
    aowCredit = (A / (fp.swr/100)) / Math.pow(1 + realReturn, gapYears);
  }
  const fireNumber = Math.max(0, fireFull - aowCredit);      // today's money
  const horizon = Math.max(fp.targetAge - age0, 1) + 12;     // sim a bit past target

  const rows = [];
  let v = startNW, fireYear = null;
  for (let t = 0; t <= horizon; t++){
    const year = startYear + t, age = age0 + t;
    const real = v / Math.pow(1 + inflPct/100, t);
    const fireAtT = fireNumber * Math.pow(1 + inflPct/100, t);
    rows.push({ year, age, nominal:Math.round(v), real:Math.round(real),
                fireTarget:Math.round(fireAtT) });
    if (fireYear === null && v >= fireAtT) fireYear = year;
    const drag = box3Drag(v, fp);
    const net = (grossPct - drag) / 100;
    const growth = v * net;
    rows[rows.length-1].growth = Math.round(growth);
    const monthly = contribAtAge(fp, age);
    rows[rows.length-1].contrib = monthly * 12;
    v = v + growth + monthly * 12;
  }

  /* Coast FIRE: earliest year where value, grown at GROSS return only (no more
     contributions), still reaches the inflation-adjusted FIRE number at target age. */
  const yearsToTarget = targetYear - startYear;
  const fireAtTarget = fireNumber * Math.pow(1 + inflPct/100, yearsToTarget);
  let coastYear = null;
  for (const r of rows){
    if (r.year > targetYear) break;
    const grown = r.nominal * Math.pow(1 + grossPct/100, targetYear - r.year);
    if (grown >= fireAtTarget){ coastYear = r.year; break; }
  }

  const atTarget = rows.find(r => r.year === targetYear) || rows[rows.length-1];
  return {
    rows, fireNumber, fireYear,
    fireAge: fireYear !== null ? age0 + (fireYear - startYear) : null,
    yearsToFire: fireYear !== null ? fireYear - startYear : null,
    coastYear, coastAge: coastYear !== null ? age0 + (coastYear - startYear) : null,
    realAtTarget: atTarget ? atTarget.real : 0,
    fireAtTarget, targetYear, age0, startYear, fireFull, aowCredit,
  };
}

/* Monthly contribution needed to hit the FIRE number exactly at target age (bisection). */
function monthlyNeeded(startNW, fp){
  const test = m => simulate(startNW, { ...fp, monthlyContribution:m, contributionSchedule:[] }, fp.grossReturn, fp.inflation);
  let lo = 0, hi = 20000;
  const hits = m => { const s = test(m); return s.fireYear !== null && s.fireYear <= s.targetYear; };
  if (hits(0)) return 0;
  if (!hits(hi)) return null;
  for (let i = 0; i < 40; i++){
    const mid = (lo + hi) / 2;
    if (hits(mid)) hi = mid; else lo = mid;
  }
  return Math.ceil(hi / 10) * 10;
}

/* FIRE milestones ladder: classic waypoints + Half/Coast/FI, deduped when crowded. */
function Milestones({ liquid, target, coast }){
  if (!target || target <= 0) return null;
  const marks = [
    { at:10000,  label:'First €10k' },
    { at:25000,  label:'€25k' },
    { at:50000,  label:'€50k' },
    { at:100000, label:'First €100k' },
    { at:250000, label:'Quarter million' },
    { at:500000, label:'Half million' },
  ].filter(m => m.at < target * 0.96);
  marks.push({ at: target * 0.25, label:'25% of FI' });
  marks.push({ at: target * 0.5,  label:'Half FI' });
  if (coast && coast > 0 && coast < target * 0.96) marks.push({ at: coast, label:'Coast FI' });
  marks.push({ at: target, label:'FI — spend covered' });
  marks.sort((a,b) => a.at - b.at);
  const kept = [];
  marks.forEach(m => {
    const prev = kept[kept.length - 1];
    if (prev && (m.at - prev.at) < target * 0.05){
      if (m.label.indexOf('FI') >= 0 || prev.label.indexOf('FI') < 0) kept[kept.length - 1] = m;
    } else kept.push(m);
  });
  const next = kept.find(m => liquid < m.at);
  const done = kept.filter(m => liquid >= m.at).length;
  return (
    <div className="mt">
      <div className="spread"><h3 style={{margin:0}}>Milestones</h3><span className="small dim">{done}/{kept.length}</span></div>
      <div className="milestones">
        {kept.map((m, i) => {
          const hit = liquid >= m.at;
          const isNext = next && next.at === m.at;
          return (
            <div key={i} className={'ms' + (hit ? ' hit' : '') + (isNext ? ' nxt' : '')}>
              <span className="ms-ico">{hit ? '✓' : (isNext ? '→' : '○')}</span>
              <span className="ms-lab">{m.label}</span>
              <span className="ms-amt num">{fmt0(m.at)}</span>
              {isNext && <span className="ms-togo num">{fmt0(m.at - liquid)} to go</span>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

    const propDebt = L.filter(l => owns(l, id)).reduce((s,l) => s + l.value, 0);
    return { stocks:sum('stocks'), crypto:sum('crypto'), savings:sum('savings'), property: Math.max(0, propVal - propDebt) };

  const haircut = fp.rentalHaircut != null ? fp.rentalHaircut : 25;        // tax, maintenance, vacancy, agent fees

  // ---- RE machinery (pensions + rental + bridge): demoted, for later ----

  const factor = (pen.accrualFactor != null ? pen.accrualFactor : 60) / 100;

  const pensionNetY = penOn ? people.reduce((s,pp) => s + penPerson(pp[0]), 0) : 0;
  const retireAge = fp.targetAge;
  const realR = Math.max(0.0001, (fp.grossReturn - fp.inflation) / 100);

  const spendGapBridge = Math.max(0, householdSpend - rentNetY);

  const annuityPV = spendGapBridge * (1 - Math.pow(1 + realR, -bridgeYears)) / realR;

          {TYPE.map(t => <span key={t.key} className="small" style={{display:'inline-flex', alignItems:'center', gap:5}}>

/* ============================ TAB 3 — Budget & cash flow ============================ */
const monthKey = () => ISO(TODAY).slice(0,7);
const monthLabel = mk => {
  const d = mk ? new Date(mk + '-15T12:00:00') : TODAY;
  return new Intl.DateTimeFormat('nl-NL', { month:'long', year:'numeric' }).format(d);
};
const prevMonthKey = mk => {
  const p = mk.split('-').map(Number);
  const d = new Date(p[0], p[1] - 2, 15);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
};
const budgetCats = data => [...(data.categories || [])].sort((a,b) => (a.order||0) - (b.order||0));
const catOf = (data, id) => {
  if (id === 'transfer') return { id:'transfer', name:'Overboeking (transfer)', icon:'🔁', color:'#8A8475', type:'transfer' };
  return (data.categories || []).find(c => c.id === id)
      || { id, name:'Onbekend', icon:'❓', color:'#8A8475', type:'variable' };
};
const monthlyEq = c =>
  c.frequency === 'quarterly' ? c.amount / 3 :
  c.frequency === 'yearly'    ? c.amount / 12 :
  c.frequency === 'one-off'   ? 0 : c.amount;
const ACCOUNT_LABELS = { sven:'Sven', charlotte:'Charlotte', joint:'Joint' };

function MonthCompare({ data, mk, lens = 'sven' }){
  const pk = prevMonthKey(mk);
  const sumFor = (m, cid) => (data.transactions || [])
    .filter(t => !t.isTransfer && t.amount < 0 && t.date.slice(0,7) === m && t.categoryId === cid && lensMatch(t.account, lens))
    .reduce((s,t) => s + Math.abs(t.amount), 0);
  const rows = budgetCats(data).filter(c => c.type === 'variable').map(c => ({
    c, cur: sumFor(mk, c.id), prev: sumFor(pk, c.id),
  })).filter(r => r.cur > 0 || r.prev > 0);
  if (!rows.some(r => r.prev > 0)) return null;
  return (
    <div className="card">
      <h3>This month vs {monthLabel(pk)}</h3>
      <table>
        <tbody>
          {rows.map(r => {
            const chg = r.prev > 0 ? (r.cur - r.prev) / r.prev * 100 : null;
            return (
              <tr key={r.c.id}>
                <td style={{fontWeight:600}}>{r.c.icon} {r.c.name}</td>
                <td className="r num muted">{fmt(r.prev)}</td>
                <td className="r num" style={{fontWeight:700}}>{fmt(r.cur)}</td>
                <td className={'r num small ' + (chg === null ? 'dim' : chg > 0 ? 'red' : 'green')}>
                  {chg === null ? 'new' : (chg >= 0 ? '+' : '') + pct1(chg)}
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

function BudgetTab({ data, setData, lens = 'sven' }){
  const [vForm, setVForm] = useState({ name:'', amount:'', categoryId:'boodschappen' });
  const [showImport, setShowImport] = useState(false);
  const [showCsv, setShowCsv] = useState(false);
  const [toast, setToast] = useState(null);
  const [recon, setRecon] = useState(null);
  const [lastImport, setLastImport] = useState(null);
  const toastTimer = useRef(null);

  const curMonth = monthKey();
  const [mk, setMk] = useState(curMonth);
  const dataMonths = [...new Set((data.transactions || []).map(t => t.date.slice(0,7)))];
  const allMonths = [...new Set([curMonth, mk].concat(dataMonths))].sort().reverse();
  const shiftMonth = delta => {
    const p = mk.split('-').map(Number);
    const d = new Date(p[0], p[1] - 1 + delta, 1);
    const nk = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    if (nk > curMonth) return;            // don't budget into the future
    setMk(nk);
  };
  const cats = budgetCats(data);
  const varCats = cats.filter(c => c.type === 'variable');
  const income = data.income;
  const hh = data.household || {};
  const split = hh.sharedSplit != null ? hh.sharedSplit : 50;            // Sven's %
  const contribEach = hh.jointContribEach != null ? hh.jointContribEach : 1000;
  const sharedItems = (data.fixedCosts || []).filter(c => c.shared);
  const personalItems = (data.fixedCosts || []).filter(c => !c.shared && lensMatch(c.owner, lens));  // personal fixed for this lens
  const sharedTotal = sharedItems.reduce((s,c) => s + monthlyEq(c), 0);
  const personalFixed = personalItems.reduce((s,c) => s + monthlyEq(c), 0);
  const svenShare = sharedTotal * split / 100;
  const jointIn = contribEach * 2;
  const jointBuffer = jointIn - sharedTotal;

  const monthTx = (data.transactions || []).filter(t => t.date.slice(0,7) === mk && !t.isTransfer && lensMatch(t.account, lens));
  const monthExpenses = monthTx.filter(t => t.amount < 0 && catOf(data, t.categoryId).type === 'variable');
  const monthIncomeTx = monthTx.filter(t => t.amount > 0 && catOf(data, t.categoryId).type === 'income');
  const totalVar = monthExpenses.reduce((s,t) => s + Math.abs(t.amount), 0);
  const importedIncome = monthIncomeTx.reduce((s,t) => s + t.amount, 0);

  let totalFixed, totalIn;
  if (lens === 'charlotte'){ totalFixed = contribEach; totalIn = income.charlotte || 0; }
  else if (lens === 'ours'){ totalFixed = sharedTotal + personalFixed; totalIn = (income.sven || 0) + (income.charlotte || 0); }
  else { totalFixed = contribEach + personalFixed; totalIn = income.sven || 0; }
  const visibleFixed = lens === 'ours' ? (data.fixedCosts || []) : personalItems;
  const visibleFixedTotal = visibleFixed.reduce((s,c) => s + monthlyEq(c), 0);

  const totalOut = totalFixed + totalVar;
  const surplus = totalIn - totalOut;
  const savingsRate = totalIn > 0 ? surplus / totalIn * 100 : 0;

  const setIncome = (k,v) => setData({ ...data, income: { ...income, [k]: v } });
  const setHH = (k,v) => setData({ ...data, household: { ...(data.household || {}), [k]: parseFloat(v) || 0 } });
  const setCost = (id,v) => setData({ ...data,
    fixedCosts: data.fixedCosts.map(c => c.id === id ? { ...c, amount:v } : c) });

  const addVar = () => {
    if (!vForm.name || !vForm.amount) return;
    const date = (mk === curMonth) ? ISO(TODAY) : mk + '-15';
    const tx = { id:uid(), date:date, description:vForm.name,
      amount:-Math.abs(parseFloat(vForm.amount) || 0), account:(lens === 'charlotte' ? 'charlotte' : lens === 'ours' ? 'joint' : 'sven'),
      categoryId:vForm.categoryId, source:'manual', hash:null, isTransfer:false };
    setData({ ...data, transactions:[...(data.transactions||[]), tx] });
    setVForm({ name:'', amount:'', categoryId:vForm.categoryId });
  };
  const delTx = id => setData({ ...data, transactions: data.transactions.filter(t => t.id !== id) });
  const setTxCat = (id, cid) => setData({ ...data, transactions: (data.transactions || []).map(t =>
    t.id === id ? { ...t, categoryId: cid, isTransfer: cid === 'transfer' } : t) });

  const showToast = msg => {
    setToast(msg);
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 7000);
  };

  const commitImport = payload => {
    setData({ ...data,
      transactions:[...(data.transactions||[]), ...payload.txRecords],
      learnedRules: payload.rules,
      importHistory:[...(data.importHistory||[]), payload.histEntry],
      fileAccountMap: payload.fmap });
    setShowImport(false);
    setRecon(payload.recon);
    setLastImport({ ts:Date.now(), ids:payload.txRecords.map(t => t.id), histId:payload.histEntry.id });
    showToast(payload.toastMsg);
  };

  const undoImport = () => {
    if (!lastImport) return;
    const ids = new Set(lastImport.ids);
    setData({ ...data,
      transactions: data.transactions.filter(t => !ids.has(t.id)),
      importHistory: (data.importHistory||[]).filter(h => h.id !== lastImport.histId) });
    setLastImport(null); setRecon(null);
    showToast('Last import undone — ' + ids.size + ' transactions removed.');
  };
  const canUndo = lastImport && (Date.now() - lastImport.ts < 5*60*1000);

  /* learned-rules management (CSV settings panel) */
  const setRuleCat = (pattern, cid) => setData({ ...data,
    learnedRules: data.learnedRules.map(r => r.pattern === pattern ? { ...r, categoryId:cid } : r) });
  const delRule = pattern => setData({ ...data,
    learnedRules: data.learnedRules.filter(r => r.pattern !== pattern) });
  const clearRules = () => { if (confirm('Clear ALL learned rules? Seed rules and ING categories keep working.'))
    setData({ ...data, learnedRules: [] }); };
  const exportRules = () => {
    const blob = new Blob([JSON.stringify(data.learnedRules || [], null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'fintrack-learned-rules-' + ISO(TODAY) + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };

  const catTotals = varCats.map(c => ({
    name: c.name.length > 14 ? c.name.slice(0,13) + '…' : c.name, fill: c.color,
    value: monthExpenses.filter(t => t.categoryId === c.id).reduce((s,t) => s + Math.abs(t.amount), 0),
  })).filter(c => c.value > 0);

  return (
    <div className="stack">
      {toast && <div className="toast">{toast}</div>}

      <div className="card" style={{paddingTop:12, paddingBottom:12}}>
        <div className="spread" style={{flexWrap:'wrap', gap:10}}>
          <div className="row" style={{gap:8, alignItems:'center'}}>
            <button className="btn" onClick={() => shiftMonth(-1)} title="Previous month">◀</button>
            <select value={mk} onChange={e => setMk(e.target.value)} style={{fontWeight:700, fontSize:15, minWidth:170}}>
              {allMonths.map(m => <option key={m} value={m}>{monthLabel(m)}{m === curMonth ? ' · this month' : ''}</option>)}
            </select>
            <button className="btn" onClick={() => shiftMonth(1)} disabled={mk >= curMonth} title="Next month">▶</button>
            {mk !== curMonth && <button className="btn" onClick={() => setMk(curMonth)}>Jump to this month</button>}
          </div>
          <span className="small muted">
            {monthExpenses.length > 0
              ? (monthExpenses.length + ' transaction' + (monthExpenses.length === 1 ? '' : 's') + ' · ' + fmt(totalVar) + ' variable')
              : 'No data for this month yet — import a CSV or log expenses below'}
          </span>
        </div>
        {mk !== curMonth &&
          <div className="sub" style={{marginTop:8}}>Viewing a past month. Expenses you log here are dated in {monthLabel(mk)}.</div>}
      </div>

      <div className="card">
        <h2>Income — {monthLabel(mk)}{lens === 'sven' ? '' : ' · ' + (lens === 'ours' ? 'Ours' : 'Charlotte') + ' view'}</h2>
        <table>
          <tbody>
            {(lens === 'sven' || lens === 'ours') &&
              <tr>
                <td style={{fontWeight:600}}>Sven net income <div className="muted small">VMI Holland B.V. · incl. transport</div></td>
                <td className="r"><NumInput value={income.sven} step={10} onChange={v => setIncome('sven', v)}/></td>
              </tr>}
            {(lens === 'charlotte' || lens === 'ours') &&
              <tr>
                <td style={{fontWeight:600}}>Charlotte net income <div className="muted small">Just started — provisional until a few payslips land</div></td>
                <td className="r"><NumInput value={income.charlotte || 0} step={10} onChange={v => setIncome('charlotte', v)}/></td>
              </tr>}
            <tr>
              <td style={{fontWeight:700}}>{lens === 'ours' ? 'Household income' : lens === 'charlotte' ? 'Charlotte income' : 'Your income'}</td>
              <td className="r num green" style={{fontWeight:800, fontSize:16}}>{fmt(totalIn)}</td>
            </tr>
          </tbody>
        </table>
        {lens === 'charlotte' && (income.charlotte || 0) === 0 &&
          <div className="sub">Charlotte just started work — set a provisional take-home, or leave at zero until the first payslips land.</div>}
        {importedIncome > 0 &&
          <div className="sub">Imported income this month (CSV): <b className="num green">{fmt(importedIncome)}</b></div>}

function lensMatch(owner, lens){
  owner = owner || 'sven';
  if (!lens || lens === 'ours') return true;

const STOCK_DOMAINS = [
  [/nvidia/i,'nvidia.com'], [/amazon/i,'amazon.com'], [/asml/i,'asml.com'],
  [/tesla/i,'tesla.com'], [/alibaba/i,'alibaba.com'], [/celsius/i,'celsiusholdings.com'],
  [/crocs/i,'crocs.com'], [/shell/i,'shell.com'], [/vanguard/i,'vanguard.com'],
  [/ishares|blackrock/i,'ishares.com'], [/uranium|global ?x/i,'globalxetfs.com'],
  [/microsoft/i,'microsoft.com'], [/apple/i,'apple.com'], [/alphabet|google/i,'abc.xyz'],
  [/meta|facebook/i,'meta.com'], [/visa/i,'visa.com'], [/novo nordisk/i,'novonordisk.com'],
];
function stockDomain(name){ for (const pair of STOCK_DOMAINS) if (pair[0].test(name || '')) return pair[1]; return null; }
function cryptoSym(a){ const m = (a.name || '').match(/\(([A-Za-z0-9]+)\)/); return m ? m[1].toLowerCase() : ''; }
function monoColor(s){ const warm = ['#4A211C','#5E6B3B','#9A6A34','#988C6C','#A2492B','#B98A2E','#8C5A6B'];
  let h = 0; for (let i = 0; i < (s || '').length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return warm[h % warm.length]; }
function HoldingIcon({ asset }){
  const [bad, setBad] = useState(false);
  if (!asset || (asset.category !== 'crypto' && asset.category !== 'stocks')) return null;
  let src = null, label = '';
  if (asset.category === 'crypto'){
    const sym = cryptoSym(asset);
    label = (sym || asset.name || '?').toUpperCase().slice(0, 3);
    if (sym) src = 'https://cdn.jsdelivr.net/npm/cryptocurrency-icons@0.18.1/svg/color/' + sym + '.svg';
  } else {
    const dom = stockDomain(asset.name);
    label = (asset.name || '?').replace(/[^A-Za-z ]/g, ' ').trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase() || '#';
    if (dom) src = 'https://www.google.com/s2/favicons?domain=' + dom + '&sz=64';
  }
  const box = { width:24, height:24, borderRadius:6, flexShrink:0, marginRight:9 };
  if (src && !bad) return <img src={src} alt="" loading="lazy" onError={() => setBad(true)}
    style={{ ...box, objectFit:'contain', background:'#fff', border:'1px solid var(--rule)' }}/>;
  return <span style={{ ...box, display:'inline-flex', alignItems:'center', justifyContent:'center',
    background: monoColor(asset.name), color:'#F3EDE2', fontSize:9.5, fontWeight:700, letterSpacing:'.3px' }}>{label}</span>;
}

/* DEGIRO Transactions.csv → growth reconstruction. Prices are last-known-at-trade, so the
   curve is exact on trade days and held flat in between — honest for monthly investing. */
function parseDegiroCsv(text){
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return { error:'Empty file.' };
  const parseLine = l => {
    const out = []; let cur = '', q = false;
    for (let i = 0; i < l.length; i++){
      const ch = l[i];
      if (q){ if (ch === '"'){ if (l[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; }
      else if (ch === '"') q = true;
      else if (ch === ','){ out.push(cur); cur = ''; }
      else cur += ch;
    }
    out.push(cur); return out;
  };
  const hdr = parseLine(lines[0]);
  const iD = hdr.indexOf('Datum'), iT = hdr.indexOf('Tijd'), iP = hdr.indexOf('Product'),
        iI = hdr.indexOf('ISIN'), iQ = hdr.indexOf('Aantal'), iV = hdr.indexOf('Waarde EUR'),
        iTot = hdr.indexOf('Totaal EUR');
  if (iD < 0 || iQ < 0 || iV < 0) return { error:'Header not recognised — expecting a DEGIRO Transactions.csv (Dutch export).' };
  const num = x => parseFloat(String(x || '0').replace(/\./g, '').replace(',', '.')) || 0;
  const tx = [];
  for (let i = 1; i < lines.length; i++){
    const c = parseLine(lines[i]);
    if (!c[iD] || !c[iI]) continue;
    const dp = c[iD].split('-');
    if (dp.length !== 3) continue;
    tx.push({ date: dp[2] + '-' + dp[1] + '-' + dp[0], time: c[iT] || '',
              name: c[iP] || '', isin: c[iI], qty: num(c[iQ]),
              valueEur: Math.abs(num(c[iV])), totalEur: num(c[iTot >= 0 ? iTot : iV]) });
  }
  return { tx };
}

function PortfolioGrowthCard({ data, setData }){
  const fileRef = useRef(null);
  const tx = data.portfolioTx || [];
  const fp = data.fireParams || {};
  const thr = fp.sigBuyThreshold != null ? fp.sigBuyThreshold : 750;
  const setThr = v => setData({ ...data, fireParams: { ...fp, sigBuyThreshold: v } });

  const onImport = e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const res = parseDegiroCsv(String(ev.target.result || ''));
      if (res.error){ alert(res.error); return; }
      const key = t => [t.date, t.time, t.isin, t.qty, t.totalEur].join('|');
      const seen = {}; tx.forEach(t => { seen[key(t)] = true; });
      const fresh = res.tx.filter(t => !seen[key(t)]);
      setData({ ...data, portfolioTx: tx.concat(fresh) });
      alert(fresh.length + ' new transactions imported' + (res.tx.length > fresh.length ? ' (' + (res.tx.length - fresh.length) + ' already known)' : '') + '.');
    };
    reader.readAsText(f);
    e.target.value = '';
  };
  const clearAll = () => { if (confirm('Remove all imported portfolio transactions?')) setData({ ...data, portfolioTx: [] }); };

  const sorted = tx.slice().sort((a,b) => (a.date + a.time).localeCompare(b.date + b.time));
  const qty = {}, px = {};
  let invested = 0;
  const byDate = {}, sigByDate = {};
  sorted.forEach(t => {
    if (t.qty){ px[t.isin] = t.valueEur / Math.abs(t.qty); qty[t.isin] = (qty[t.isin] || 0) + t.qty; }
    invested += -t.totalEur;
    let value = 0; for (const i in qty){ value += qty[i] * (px[i] || 0); }
    byDate[t.date] = { date: t.date, value: Math.round(value), invested: Math.round(invested) };
    if (t.qty > 0 && t.valueEur >= thr){
      sigByDate[t.date] = sigByDate[t.date] || { amt:0, names:[] };
      sigByDate[t.date].amt += t.valueEur;
      if (sigByDate[t.date].names.indexOf(t.name) < 0) sigByDate[t.date].names.push(t.name);
    }
  });
  const points = Object.keys(byDate).sort().map(d => ({ ...byDate[d], sig: sigByDate[d] ? Math.round(sigByDate[d].amt) : 0 }));
  // anchor the endpoint to the live DEGIRO positions in the asset list (ex cash),
  // so "today" reads true while the historic curve keeps last-trade prices.
  const degiroNow = (data.assets || []).filter(a => a.category === 'stocks' && a.institutionId === 'degiro' && !/^Cash/i.test(a.name))
    .reduce((s,a) => s + a.value, 0);
  let anchored = false;
  if (points.length && degiroNow > 0){
    const lp = points[points.length - 1];
    const today = ISO(TODAY);
    if (today > lp.date){ points.push({ date: today, value: Math.round(degiroNow), invested: lp.invested, sig: 0 }); anchored = true; }
  }
  const last = points.length ? points[points.length - 1] : null;
  const growth = last ? last.value - last.invested : 0;
  const growthPct = last && last.invested > 0 ? (last.value / last.invested - 1) * 100 : 0;
  const sigList = Object.keys(sigByDate).sort().reverse().map(d => ({ date:d, amt:sigByDate[d].amt, names:sigByDate[d].names }));

  const SigDot = props => {
    const pl = props.payload || {};
    if (!pl.sig) return <circle key={'sd' + props.index} cx={props.cx} cy={props.cy} r={0} fill="none"/>;
    return <circle key={'sd' + props.index} cx={props.cx} cy={props.cy} r={5} fill="var(--yellow)" stroke="var(--bg)" strokeWidth={1.5}/>;
  };

  return (
    <div className="card">
      <div className="spread" style={{flexWrap:'wrap', gap:8}}>
        <h2 style={{marginBottom:0}}>Portfolio growth · DEGIRO</h2>
        <div className="row" style={{gap:8}}>
          <button className="btn" onClick={() => fileRef.current && fileRef.current.click()}>📥 Import Transactions.csv</button>
          {tx.length > 0 && <button className="btn-icon" title="Clear imported transactions" onClick={clearAll}>🗑 clear</button>}
        </div>
      </div>
      <input ref={fileRef} type="file" accept=".csv,text/csv" style={{display:'none'}} onChange={onImport}/>
      {!last
        ? <div className="sub mt">Import your DEGIRO <b>Transactions.csv</b> (app → Inbox → Transacties → Export) to see total value against money in — market growth, not deposits — with significant buys marked in gold.</div>
        : <React.Fragment>
        <div className="grid3 mt">
          <div><h3>Money in</h3><div className="metric">{fmt0(last.invested)}</div></div>
          <div><h3>{anchored ? 'Value today' : 'Value @ last trade'}</h3><div className="metric">{fmt0(last.value)}</div>
            {anchored && <div className="sub">from your asset list</div>}</div>
          <div><h3>Market growth</h3><div className={'metric ' + (growth >= 0 ? 'green' : 'red')}>{(growth >= 0 ? '+' : '') + fmt0(growth)} · {pct1(growthPct)}</div></div>
        </div>
        <div style={{width:'100%', height:260}} className="mt">
          <ResponsiveContainer>
